services:
  sip-db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SIP_DB_NAME:-magnanimous_sip}
      POSTGRES_USER: ${SIP_DB_USER:-magnanimous_sip}
      POSTGRES_PASSWORD: ${SIP_DB_PASSWORD}
    ports:
      - "127.0.0.1:${SIP_DB_HOST_PORT:-5433}:5432"
    volumes:
      - sip-db-data:/var/lib/postgresql/data
      - ./sip-core/db/init.sql:/docker-entrypoint-initdb.d/001-magnanimous-sip.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SIP_DB_USER:-magnanimous_sip} -d ${SIP_DB_NAME:-magnanimous_sip}"]
      interval: 5s
      timeout: 3s
      retries: 20

  sip-core:
    build:
      context: ./sip-core
    restart: unless-stopped
    network_mode: host
    depends_on:
      sip-db:
        condition: service_healthy
    environment:
      MAGNANIMOUS_SIP_DOMAIN: ${MAGNANIMOUS_SIP_DOMAIN}
      SIP_DB_HOST: 127.0.0.1
      SIP_DB_PORT: ${SIP_DB_HOST_PORT:-5433}
      SIP_DB_NAME: ${SIP_DB_NAME:-magnanimous_sip}
      SIP_DB_USER: ${SIP_DB_USER:-magnanimous_sip}
      SIP_DB_PASSWORD: ${SIP_DB_PASSWORD}
      SIP_MAX_CONTACTS: ${SIP_MAX_CONTACTS:-5}
      ASTERISK_SIP_HOST: 127.0.0.1
      ASTERISK_SIP_PORT: ${ASTERISK_SIP_PORT:-5070}

  asterisk:
    build:
      context: ./asterisk
    restart: unless-stopped
    network_mode: host
    environment:
      ASTERISK_ARI_USER: ${ASTERISK_ARI_USER}
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD}
      ASTERISK_SIP_PORT: ${ASTERISK_SIP_PORT:-5070}
      MAGNANIMOUS_SIP_DOMAIN: ${MAGNANIMOUS_SIP_DOMAIN}
      MAGNANIMOUS_AI_EXTENSION: ${MAGNANIMOUS_AI_EXTENSION:-9000}
      MAGNANIMOUS_AI_PASSWORD: ${MAGNANIMOUS_AI_PASSWORD}
      MAGNANIMOUS_ADMIN_EXTENSION: ${MAGNANIMOUS_ADMIN_EXTENSION:-1000}
      MAGNANIMOUS_ADMIN_PASSWORD: ${MAGNANIMOUS_ADMIN_PASSWORD}
      CARRIER_SIP_ENDPOINT: ${CARRIER_SIP_ENDPOINT:-pstn-trunk}
      CARRIER_SIP_HOST: ${CARRIER_SIP_HOST:-}
      CARRIER_SIP_PORT: ${CARRIER_SIP_PORT:-5060}
      CARRIER_SIP_USERNAME: ${CARRIER_SIP_USERNAME:-}
      CARRIER_SIP_PASSWORD: ${CARRIER_SIP_PASSWORD:-}
      CARRIER_SIP_FROM_DOMAIN: ${CARRIER_SIP_FROM_DOMAIN:-}
      CARRIER_SIP_SECONDARY_ENDPOINT: ${CARRIER_SIP_SECONDARY_ENDPOINT:-}
      CARRIER_SIP_SECONDARY_HOST: ${CARRIER_SIP_SECONDARY_HOST:-}
      CARRIER_SIP_SECONDARY_PORT: ${CARRIER_SIP_SECONDARY_PORT:-5060}
      CARRIER_SIP_SECONDARY_USERNAME: ${CARRIER_SIP_SECONDARY_USERNAME:-}
      CARRIER_SIP_SECONDARY_PASSWORD: ${CARRIER_SIP_SECONDARY_PASSWORD:-}
      CARRIER_SIP_SECONDARY_FROM_DOMAIN: ${CARRIER_SIP_SECONDARY_FROM_DOMAIN:-}
      PSTN_TRUNK_HOST: ${PSTN_TRUNK_HOST:-}
      PSTN_TRUNK_PORT: ${PSTN_TRUNK_PORT:-5060}
      PSTN_TRUNK_USERNAME: ${PSTN_TRUNK_USERNAME:-}
      PSTN_TRUNK_PASSWORD: ${PSTN_TRUNK_PASSWORD:-}
      PSTN_TRUNK_FROM_DOMAIN: ${PSTN_TRUNK_FROM_DOMAIN:-}
      TELECOM_PUBLIC_IP: ${TELECOM_PUBLIC_IP:-}
    volumes:
      - ./certs:/certs:ro
      - asterisk-data:/var/lib/asterisk
      - asterisk-spool:/var/spool/asterisk
      - asterisk-log:/var/log/asterisk

  control-api:
    build:
      context: ./control-api
    restart: unless-stopped
    network_mode: host
    depends_on:
      sip-db:
        condition: service_healthy
      asterisk:
        condition: service_started
    environment:
      TELECOM_API_TOKEN: ${TELECOM_API_TOKEN}
      TELECOM_WEBHOOK_SECRET: ${TELECOM_WEBHOOK_SECRET}
      ASTERISK_ARI_URL: ${ASTERISK_ARI_URL:-http://127.0.0.1:8088/ari}
      ASTERISK_ARI_USER: ${ASTERISK_ARI_USER}
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD}
      MAGNANIMOUS_CALLER_ID: ${MAGNANIMOUS_CALLER_ID:-}
      MAGNANIMOUS_AI_EXTENSION: ${MAGNANIMOUS_AI_EXTENSION:-9000}
      MAGNANIMOUS_SIP_DOMAIN: ${MAGNANIMOUS_SIP_DOMAIN}
      SIP_DB_HOST: 127.0.0.1
      SIP_DB_PORT: ${SIP_DB_HOST_PORT:-5433}
      SIP_DB_NAME: ${SIP_DB_NAME:-magnanimous_sip}
      SIP_DB_USER: ${SIP_DB_USER:-magnanimous_sip}
      SIP_DB_PASSWORD: ${SIP_DB_PASSWORD}
      CARRIER_SIP_ENDPOINT: ${CARRIER_SIP_ENDPOINT:-pstn-trunk}
      CARRIER_DIAL_CONTEXT: ${CARRIER_DIAL_CONTEXT:-magnanimous-outbound}
      CARRIER_CALL_TIMEOUT_MS: ${CARRIER_CALL_TIMEOUT_MS:-60000}
      CARRIER_MONITOR_INTERVAL_SECONDS: ${CARRIER_MONITOR_INTERVAL_SECONDS:-2}
      CARRIER_MONITOR_MAX_POLLS: ${CARRIER_MONITOR_MAX_POLLS:-1800}

volumes:
  sip-db-data:
  asterisk-data:
  asterisk-spool:
  asterisk-log:

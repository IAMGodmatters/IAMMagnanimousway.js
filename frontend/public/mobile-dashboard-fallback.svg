<svg xmlns="http://www.w3.org/2000/svg" width="941" height="1672" viewBox="0 0 941 1672" role="img" aria-labelledby="title desc">
  <title id="title">I AM MAGNANIMOUS WAY™ mobile dashboard</title>
  <desc id="desc">Visible mobile navigation dashboard fallback for Magnanimous AI with sixteen platform modules and bottom navigation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020712"/>
      <stop offset="0.48" stop-color="#06101f"/>
      <stop offset="1" stop-color="#01040b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2440"/>
      <stop offset="0.55" stop-color="#07182d"/>
      <stop offset="1" stop-color="#04101e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63e6ff"/>
      <stop offset="0.5" stop-color="#78a6ff"/>
      <stop offset="1" stop-color="#bd7cff"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#dffcff" stop-opacity="0.96"/>
      <stop offset="0.16" stop-color="#69e5ff" stop-opacity="0.92"/>
      <stop offset="0.46" stop-color="#347cff" stop-opacity="0.62"/>
      <stop offset="0.73" stop-color="#6c48c8" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#081124" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style>
      .label{fill:#eefbff;font-family:Inter,Arial,sans-serif;font-weight:800}
      .muted{fill:#84a9bd;font-family:Inter,Arial,sans-serif;font-weight:600}
      .tiny{fill:#6edff8;font-family:Inter,Arial,sans-serif;font-weight:800;letter-spacing:2px}
      .card{fill:url(#panel);stroke:#174f72;stroke-width:2}
      .cardAccent{fill:none;stroke:url(#accent);stroke-width:2;opacity:.48}
      .mono{fill:#a9f4ff;font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:1px}
    </style>
  </defs>


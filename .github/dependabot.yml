version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "deps(frontend)"

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
      day: monday
      time: "03:40"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    labels: ["dependencies", "worker"]
    commit-message:
      prefix: "deps(worker)"

  - package-ecosystem: npm
    directory: /qa
    schedule:
      interval: weekly
      day: monday
      time: "03:50"
      timezone: Asia/Manila
    open-pull-requests-limit: 3
    labels: ["dependencies", "qa"]
    commit-message:
      prefix: "deps(qa)"

  - package-ecosystem: npm
    directory: /video-gateway
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 3
    labels: ["dependencies", "video"]
    commit-message:
      prefix: "deps(video)"

  - package-ecosystem: npm
    directory: /magnanimous-runtime
    schedule:
      interval: weekly
      day: monday
      time: "04:10"
      timezone: Asia/Manila
    open-pull-requests-limit: 3
    labels: ["dependencies", "runtime"]
    commit-message:
      prefix: "deps(runtime)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:20"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "deps(actions)"

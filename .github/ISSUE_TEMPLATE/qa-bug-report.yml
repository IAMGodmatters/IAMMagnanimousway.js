name: QA Bug Report
description: Report a reproducible problem found while testing I AM MAGNANIMOUS WAY™
title: "[QA] "
body:
  - type: dropdown
    id: area
    attributes:
      label: Platform area
      options:
        - MAGNANIMOUS / AI Chat
        - Research / Bible Study / Writing / Marketing / Business / Coding
        - Social / Video Script / Travel / Customer Service
        - Translator / language tools
        - Video / Agent Video / Cinema Engine
        - Contact Center / Phone / Receptionist / Auto Dialer
        - CRM / Leads / Business Email / BPO
        - Billing / Pricing / Subscription
        - Admin / Owner / Revenue / Ads
        - Login / Account / Security
        - Navigation / Mobile / Accessibility
        - Other
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Page or route
      placeholder: https://iammagnanimousway.com/ai-chat
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: iPhone Safari, Android Chrome, Windows Chrome, etc.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Number the exact actions from a fresh page load.
      placeholder: "1. Open ...\n2. Enter ...\n3. Press ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical - security/data loss/money/wrong external action
        - High - core function unusable
        - Medium - function works incorrectly or inconsistently
        - Low - visual/copy/minor usability issue
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I did not paste passwords, API keys, payment-card data, identity documents, or private customer data into this report.
          required: true
        - label: If this involved a call, email, SMS, payment, or external account action, I used an account/address/number I was authorized to test.
          required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add screenshots, console errors, network errors, or a link to the GitHub Actions QA artifact if available.

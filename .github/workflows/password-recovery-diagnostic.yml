name: Password Recovery Diagnostic

on:
  push:
    branches:
      - fix/password-reset-email-delivery-20260919
    paths:
      - '.github/workflows/password-recovery-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund
      - name: Query safe password recovery readiness
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'ACCOUNT_MATCH_COUNTS'
          npx wrangler d1 execute iam-magnanimous-db --remote --command="SELECT SUM(CASE WHEN lower(email)=lower('hardinlourijess@gmail.com') AND active=1 THEN 1 ELSE 0 END) AS gmail_active, SUM(CASE WHEN lower(email)=lower('godmattersinc@iammagnanimousway.com') AND active=1 THEN 1 ELSE 0 END) AS business_active, SUM(CASE WHEN lower(email)=lower('iam@inkboxmail.com') AND active=1 THEN 1 ELSE 0 END) AS inkbox_active FROM users;"
          echo 'RECOVERY_TRANSPORT_COUNTS'
          npx wrangler d1 execute iam-magnanimous-db --remote --command="SELECT SUM(CASE WHEN credential_key='INKBOX_API_KEY' THEN 1 ELSE 0 END) AS inkbox_key_rows, SUM(CASE WHEN credential_key='INKBOX_EMAIL_ADDRESS' THEN 1 ELSE 0 END) AS inkbox_mail_rows FROM platform_credentials;"
          echo 'OWNER_MAIL_CONNECTION_COUNTS'
          npx wrangler d1 execute iam-magnanimous-db --remote --command="SELECT COUNT(*) AS owner_mail_connections FROM integrations i JOIN tenants t ON t.id=i.tenant_id WHERE t.slug='owner' AND i.provider IN ('google','outlook');"
          echo 'LATEST_GMAIL_RESET_EVENT'
          npx wrangler d1 execute iam-magnanimous-db --remote --command="SELECT event,success,created_at FROM auth_events WHERE lower(email)=lower('hardinlourijess@gmail.com') ORDER BY created_at DESC LIMIT 3;"
          echo 'LATEST_GMAIL_RESET_DELIVERY'
          npx wrangler d1 execute iam-magnanimous-db --remote --command="SELECT r.delivery_status,r.delivery_provider,r.created_at,r.expires_at,r.used_at FROM password_reset_tokens r JOIN users u ON u.id=r.user_id AND u.tenant_id=r.tenant_id WHERE lower(u.email)=lower('hardinlourijess@gmail.com') ORDER BY r.created_at DESC LIMIT 3;"

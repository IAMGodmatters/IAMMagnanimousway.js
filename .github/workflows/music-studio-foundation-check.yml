name: music-studio-foundation-check
on:
  pull_request:
    paths: ['frontend/app/music-studio/**','docs/magnanimous-music-studio-blueprint.md','qa/scripts/music-studio-foundation-check.mjs']
  push:
    branches: [main]
    paths: ['frontend/app/music-studio/**','docs/magnanimous-music-studio-blueprint.md','qa/scripts/music-studio-foundation-check.mjs']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node qa/scripts/music-studio-foundation-check.mjs

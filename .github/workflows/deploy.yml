name: Build and Deploy I AM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  runtime-impact:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.impact.outputs.changed }}
    steps:
      - name: Checkout runtime impact range
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect production runtime impact
        id: impact
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual production deployment requested."
            exit 0
          fi

          parent="$(git rev-parse HEAD^)"
          git diff --name-only "$parent" HEAD >/tmp/magnanimous-deploy-changed-files.txt
          if grep -Eq '^(magnanimous-runtime/|worker/|frontend/|video-gateway/|api/|package\.json$|package-lock\.json$)' /tmp/magnanimous-deploy-changed-files.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Runtime-impacting files changed; production deployment required."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No production runtime files changed; skipping Worker/Railway deployment and D1 mutation work."
            cat /tmp/magnanimous-deploy-changed-files.txt
          fi

  deploy:
    needs: runtime-impact
    if: needs.runtime-impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 50

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Lock product and specialist QA contracts
        run: |
          node qa/scripts/product-contract-locks.mjs
          node qa/scripts/specialist-branch-lock.mjs

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Bundle Worker before database changes
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir /tmp/magnanimous-worker-bundle

      - name: Ensure persistent Worker session secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --format json > /tmp/magnanimous-worker-secrets.json
          if python - <<'PY'
          import json
          data=json.load(open('/tmp/magnanimous-worker-secrets.json'))
          names={str(x.get('name','')) for x in data if isinstance(x,dict)}
          raise SystemExit(0 if 'SESSION_SECRET' in names else 1)
          PY
          then
            echo "Persistent SESSION_SECRET is already configured on the Worker."
          else
            session_secret=$(openssl rand -hex 48)
            printf '%s' "$session_secret" | npx wrangler secret put SESSION_SECRET >/dev/null
            unset session_secret
            echo "Created persistent SESSION_SECRET on the Worker without exposing its value."
          fi

      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          migration_files_changed=0
          if git -C .. rev-parse HEAD^ >/dev/null 2>&1; then
            if ! git -C .. diff --quiet HEAD^ HEAD -- worker/migrations; then
              migration_files_changed=1
            fi
          else
            migration_files_changed=1
          fi

          attempt=1
          while true; do
            set +e
            output=$(printf 'y\n' | npx wrangler d1 migrations apply iam-magnanimous-db --remote 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$output"

            if [ "$rc" -eq 0 ]; then
              break
            fi

            if printf '%s' "$output" | grep -qi "exceeded D1's free tier daily row write limit"; then
              echo "::warning::D1 migration writes are temporarily blocked by the Cloudflare Free daily row-write limit. Verifying that all runtime-required bootstrap/auth tables already exist before deferring pending migrations."
              npx wrangler d1 execute iam-magnanimous-db --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('tenant_settings','ads','settings','security_rate_limits','auth_events','auth_config','auth_sessions') ORDER BY name;" > /tmp/d1-migration-quota-schema.json
              python - <<'PY'
          import json
          payload=json.load(open('/tmp/d1-migration-quota-schema.json'))
          names=set()
          def walk(x):
              if isinstance(x,dict):
                  if isinstance(x.get('name'),str): names.add(x['name'])
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(payload)
          required={'tenant_settings','ads','settings','security_rate_limits','auth_events'}
          missing=required-names
          assert not missing, f"Cannot defer pending runtime migrations; production is missing required tables: {sorted(missing)}"
          if 'auth_sessions' not in names:
              print("::warning::auth_sessions is still pending. Authentication will remain available through the hardened signed-session recovery rail until migration 0057 can be applied.")
          else:
              print("Opaque auth session storage is already available.")
          print("Pending runtime migrations safely deferred under confirmed D1 quota; required production tables already exist. auth_config may remain pending because SESSION_SECRET can satisfy the secure auth-secret contract.")
          PY
              echo "D1_MIGRATION_DEFERRED=1" >> "$GITHUB_ENV"
              break
            fi

            if printf '%s' "$output" | grep -Eqi "internal error.*7500|code[^0-9]*7500|Network connection lost|connection reset|temporarily unavailable|timed out|Not currently importing anything|Currently processing a long-running import"; then
              if [ "$attempt" -lt 4 ]; then
                echo "::warning::Transient Cloudflare D1 migration failure. Retrying migration application ($attempt/3)."
                sleep $((attempt * 8))
                attempt=$((attempt + 1))
                continue
              fi
              if [ "$migration_files_changed" -eq 0 ]; then
                echo "::warning::Cloudflare D1 remained transiently unavailable after bounded retries, but this commit does not change worker/migrations. Deferring the migration control-plane check and continuing deployment with the previously verified production schema."
                echo "D1_MIGRATION_DEFERRED=1" >> "$GITHUB_ENV"
                break
              fi
            fi

            exit "$rc"
          done

      - name: Ensure encrypted Stripe webhook bootstrap fallback
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          # If Actions has the real signing secret, the next step will sync it directly.
          # Otherwise preserve the first-party encrypted bootstrap path: never write
          # plaintext to git, logs, D1, or artifacts.
          if [ -n "${STRIPE_WEBHOOK_SECRET:-}" ]; then
            echo "Stripe webhook signing secret is available through protected Actions secrets."
            exit 0
          fi

          check_row() {
            npx wrangler d1 execute iam-magnanimous-db --remote --json --command               "SELECT credential_key, length(ciphertext_b64) AS ciphertext_length FROM bootstrap_secrets WHERE credential_key='STRIPE_WEBHOOK_SECRET';"               > /tmp/stripe-webhook-bootstrap-row.json
            python - <<'PY'
          import json
          payload=json.load(open('/tmp/stripe-webhook-bootstrap-row.json'))
          rows=[]
          def walk(x):
              if isinstance(x,dict):
                  if x.get('credential_key')=='STRIPE_WEBHOOK_SECRET':
                      rows.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(payload)
          ok=bool(rows and int(rows[-1].get('ciphertext_length') or 0) > 32)
          raise SystemExit(0 if ok else 1)
          PY
          }

          if check_row; then
            echo "Encrypted Stripe webhook bootstrap record is already present."
            exit 0
          fi

          echo "::warning::Protected Actions secret is empty and the encrypted Stripe webhook bootstrap row is missing. Restoring only the checked-in RSA-OAEP ciphertext fallback."
          set +e
          restore_output=$(npx wrangler d1 execute iam-magnanimous-db --remote --yes --file=migrations/0084_stripe_webhook_rekey_current_bootstrap.sql 2>&1)
          restore_rc=$?
          set -e
          printf '%s\n' "$restore_output"

          if [ "$restore_rc" -ne 0 ]; then
            if printf '%s' "$restore_output" | grep -qi "free tier daily row write limit"; then
              echo "::error::Cloudflare D1 write quota blocked restoration of the encrypted Stripe webhook bootstrap row."
            fi
            exit "$restore_rc"
          fi

          check_row || { echo "::error::Encrypted Stripe webhook bootstrap restoration did not persist."; exit 1; }
          echo "Encrypted Stripe webhook bootstrap record restored without exposing plaintext."

      - name: Sync optional protected Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TAVUS_API_KEY: ${{ secrets.TAVUS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          VOIP_PROVIDER_TOKEN: ${{ secrets.VOIP_PROVIDER_TOKEN }}
          VOIP_WEBHOOK_SECRET: ${{ secrets.VOIP_WEBHOOK_SECRET }}
          VIDEO_RENDERER_TOKEN: ${{ secrets.VIDEO_RENDERER_TOKEN }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          INTEGRATION_CREDENTIALS_KEY: ${{ secrets.INTEGRATION_CREDENTIALS_KEY }}
          INKBOX_API_KEY: ${{ secrets.INKBOX_API_KEY }}
          INKBOX_EMAIL_ADDRESS: ${{ secrets.INKBOX_EMAIL_ADDRESS }}
          INKBOX_BASE_URL: ${{ secrets.INKBOX_BASE_URL }}
        shell: bash
        run: |
          set -eo pipefail
          sync_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" >/dev/null
              echo "Synced protected Worker secret: $name"
            fi
          }
          sync_secret STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          sync_secret STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          sync_secret TWILIO_ACCOUNT_SID "$TWILIO_ACCOUNT_SID"
          sync_secret TWILIO_AUTH_TOKEN "$TWILIO_AUTH_TOKEN"
          sync_secret TWILIO_PHONE_NUMBER "$TWILIO_PHONE_NUMBER"
          sync_secret TAVUS_API_KEY "$TAVUS_API_KEY"
          sync_secret ELEVENLABS_API_KEY "$ELEVENLABS_API_KEY"
          sync_secret ELEVENLABS_VOICE_ID "$ELEVENLABS_VOICE_ID"
          sync_secret VOIP_PROVIDER_TOKEN "$VOIP_PROVIDER_TOKEN"
          sync_secret VOIP_WEBHOOK_SECRET "$VOIP_WEBHOOK_SECRET"
          sync_secret VIDEO_RENDERER_TOKEN "$VIDEO_RENDERER_TOKEN"
          sync_secret MUX_TOKEN_ID "$MUX_TOKEN_ID"
          sync_secret MUX_TOKEN_SECRET "$MUX_TOKEN_SECRET"
          sync_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          sync_secret GOOGLE_API_KEY "$GOOGLE_API_KEY"
          sync_secret GROQ_API_KEY "$GROQ_API_KEY"
          sync_secret OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          sync_secret HF_TOKEN "$HF_TOKEN"
          sync_secret MISTRAL_API_KEY "$MISTRAL_API_KEY"
          sync_secret INTEGRATION_CREDENTIALS_KEY "$INTEGRATION_CREDENTIALS_KEY"
          sync_secret INKBOX_API_KEY "$INKBOX_API_KEY"
          sync_secret INKBOX_EMAIL_ADDRESS "$INKBOX_EMAIL_ADDRESS"
          sync_secret INKBOX_BASE_URL "$INKBOX_BASE_URL"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            edge_bridge_token="$(python - <<'PY'
          import hashlib,os
          seed='magnanimous-edge-ai-bridge-v1\0'+os.environ['CLOUDFLARE_API_TOKEN']+'\0'+os.environ['CLOUDFLARE_ACCOUNT_ID']
          print(hashlib.sha256(seed.encode()).hexdigest())
          PY
          )"
            sync_secret MAGNANIMOUS_EDGE_AI_BRIDGE_TOKEN "$edge_bridge_token"
            unset edge_bridge_token
            echo "Synced protected private Edge AI bridge token without exposing its value."
          fi
          if [ -n "$INKBOX_API_KEY" ]; then
            echo "Password recovery communications credential is available for deployment."
          else
            echo "::warning::INKBOX_API_KEY is not configured in GitHub Actions; password recovery will rely on the encrypted Provider Vault or connected platform mailbox."
          fi

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Materialize full Magnanimous capability brain
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${D1_MIGRATION_DEFERRED:-0}" = "1" ]; then
            echo "::warning::D1 migration/control-plane work was already deferred earlier in this deployment. Skipping durable full-brain D1 materialization and continuing with the checked-in Magnanimous runtime manifest; deferred maintenance will reconcile the durable cache later."
            exit 0
          fi
          rm -rf /tmp/magnanimous-full-brain
          node qa/scripts/materialize-full-brain-d1.mjs /tmp/magnanimous-full-brain

          expected=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/magnanimous-full-brain/manifest-metadata.json'))
          print(d['manifest_count'])
          PY
          )
          digest=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/magnanimous-full-brain/manifest-metadata.json'))
          print(d['source_digest'])
          PY
          )
          realization_counts=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/magnanimous-full-brain/manifest-metadata.json'))
          print(','.join(str(d[k]) for k in ['native_ready','hybrid_ready','bridge_required','specified_only']))
          PY
          )

          # D1 is a durable cache/index for the checked-in brain manifest. Avoid
          # consuming row-write quota when production already has this exact digest.
          current_digest=""
          set +e
          (cd worker && timeout 90s npx wrangler d1 execute iam-magnanimous-db --remote --json --command "SELECT source_digest,status,manifest_count FROM magnanimous_capability_materialization_state WHERE id='full-brain';" > /tmp/magnanimous-full-brain/current-state.json 2>/tmp/magnanimous-full-brain/current-state.err)
          state_rc=$?
          set -e
          if [ "$state_rc" -eq 0 ]; then
            current_digest=$(python - <<'PY'
          import json
          try:
              payload=json.load(open('/tmp/magnanimous-full-brain/current-state.json'))
          except Exception:
              print('')
              raise SystemExit
          rows=[]
          def walk(x):
              if isinstance(x,dict):
                  if 'source_digest' in x:
                      rows.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(payload)
          row=rows[-1] if rows else {}
          print(row.get('source_digest') if row.get('status')=='complete' else '')
          PY
            )
          fi

          materialization_deferred=0

          # Prune stale rows from previous manifest identities even when the current
          # source digest already matches. This is intentionally limited to the
          # materializer-owned full-brain ledger/realization rows and absorb-* specs.
          echo "Applying current-manifest stale-row pruning"
          prune_attempt=1
          while true; do
            set +e
            prune_output=$(cd worker && timeout 90s npx wrangler d1 execute iam-magnanimous-db --remote --yes --file=/tmp/magnanimous-full-brain/000-prune-stale.sql 2>&1)
            prune_rc=$?
            set -e
            printf '%s\n' "$prune_output"
            if [ "$prune_rc" -eq 0 ]; then
              break
            fi
            if [ "$prune_rc" -eq 124 ]; then
              materialization_deferred=1
              echo "::warning::Cloudflare D1 stale-row pruning exceeded the 90-second command budget. Durable cleanup is deferred; deployment continues with the checked-in Magnanimous brain manifest."
              break
            fi
            if printf '%s' "$prune_output" | grep -qi "free tier daily row write limit"; then
              materialization_deferred=1
              echo "::warning::Cloudflare D1 daily row-write quota blocked stale-row pruning. The checked-in Magnanimous brain manifest remains authoritative; durable cleanup will retry after quota reset."
              break
            fi
            if printf '%s' "$prune_output" | grep -Eqi "Not currently importing anything|Currently processing a long-running import|Network connection lost|internal error.*7500|code[^0-9]*7500|connection reset|temporarily unavailable|timed out"; then
              if [ "$prune_attempt" -lt 4 ]; then
                echo "::warning::Transient Cloudflare D1 failure during stale-row pruning. Retrying idempotent prune ($prune_attempt/3)."
                sleep $((prune_attempt * 8))
                prune_attempt=$((prune_attempt + 1))
                continue
              fi
              materialization_deferred=1
              echo "::warning::Cloudflare D1 remained unavailable for stale-row pruning after bounded retries. Durable cleanup is deferred; Worker deployment will continue with the checked-in Magnanimous brain manifest."
              break
            fi
            exit "$prune_rc"
          done

          if [ "$materialization_deferred" -eq 0 ]; then
            if [ -n "$current_digest" ] && [ "$current_digest" = "$digest" ]; then
              echo "Production D1 already matches full-brain digest $digest; stale rows were pruned and unchanged materialization writes are skipped."
            else
              echo "Full-brain digest changed; applying only new or semantically changed D1 rows."
              for file in /tmp/magnanimous-full-brain/*.sql; do
                if [ "$(basename "$file")" = "000-prune-stale.sql" ]; then continue; fi
                echo "Applying $(basename "$file")"
                attempt=1
                while true; do
                  set +e
                  output=$(cd worker && timeout 90s npx wrangler d1 execute iam-magnanimous-db --remote --yes --file="$file" 2>&1)
                  rc=$?
                  set -e
                  printf '%s\n' "$output"
                  if [ "$rc" -eq 0 ]; then
                    break
                  fi
                  if [ "$rc" -eq 124 ]; then
                    materialization_deferred=1
                    echo "::warning::Cloudflare D1 materialization command exceeded the 90-second command budget. Durable cache reconciliation is deferred; deployment continues with the checked-in Magnanimous brain manifest."
                    break
                  fi
                  if printf '%s' "$output" | grep -qi "free tier daily row write limit"; then
                    materialization_deferred=1
                    echo "::warning::Cloudflare D1 daily row-write quota is exhausted. The checked-in Magnanimous brain manifest remains authoritative in the deployed Worker; durable D1 materialization is deferred until write capacity is available."
                    break
                  fi
                  if printf '%s' "$output" | grep -Eqi "Not currently importing anything|Currently processing a long-running import|Network connection lost|internal error.*7500|code[^0-9]*7500|connection reset|temporarily unavailable|timed out"; then
                    if [ "$attempt" -lt 4 ]; then
                      echo "::warning::Transient Cloudflare D1 failure while applying $(basename "$file"). Retrying the same idempotent materialization chunk ($attempt/3)."
                      sleep $((attempt * 8))
                      attempt=$((attempt + 1))
                      continue
                    fi
                    materialization_deferred=1
                    echo "::warning::Cloudflare D1 remained transiently unavailable after bounded retries. The checked-in Magnanimous brain manifest remains authoritative; durable D1 materialization is deferred and Worker deployment will continue."
                    break
                  fi
                  exit "$rc"
                done
                if [ "$materialization_deferred" -eq 1 ]; then
                  break
                fi
              done
            fi
          fi

          if [ "$materialization_deferred" -eq 0 ]; then
            (cd worker && timeout 90s npx wrangler d1 execute iam-magnanimous-db --remote --json --command "SELECT
              (SELECT COUNT(*) FROM magnanimous_connector_capability_absorption WHERE status='tool-foundry-specified') AS ledger_count,
              (SELECT COUNT(*) FROM magnanimous_native_tool_specs WHERE tenant_id='__magnanimous_global__' AND user_id='system:auto-qa') AS tool_spec_count,
              (SELECT COUNT(*) FROM magnanimous_capability_realizations) AS realization_count,
              (SELECT native_ready_count FROM magnanimous_capability_realization_state WHERE id='full-brain') AS native_ready_count,
              (SELECT hybrid_ready_count FROM magnanimous_capability_realization_state WHERE id='full-brain') AS hybrid_ready_count,
              (SELECT bridge_required_count FROM magnanimous_capability_realization_state WHERE id='full-brain') AS bridge_required_count,
              (SELECT specified_only_count FROM magnanimous_capability_realization_state WHERE id='full-brain') AS specified_only_count,
              (SELECT source_digest FROM magnanimous_capability_realization_state WHERE id='full-brain') AS realization_digest,
              (SELECT status FROM magnanimous_capability_realization_state WHERE id='full-brain') AS realization_status,
              magnanimous_capability_materialization_state.manifest_count AS manifest_count,
              magnanimous_capability_materialization_state.ledger_count AS recorded_ledger_count,
              magnanimous_capability_materialization_state.tool_spec_count AS recorded_tool_spec_count,
              magnanimous_capability_materialization_state.source_digest AS source_digest,
              magnanimous_capability_materialization_state.status AS status
              FROM magnanimous_capability_materialization_state WHERE id='full-brain';" > /tmp/magnanimous-full-brain/verify.json)

            EXPECTED="$expected" DIGEST="$digest" REALIZATION_COUNTS="$realization_counts" python - <<'PY'
          import json, os
          payload=json.load(open('/tmp/magnanimous-full-brain/verify.json'))
          rows=[]
          def walk(x):
              if isinstance(x,dict):
                  if 'manifest_count' in x and 'source_digest' in x:
                      rows.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(payload)
          assert rows, payload
          row=rows[-1]
          expected=int(os.environ['EXPECTED'])
          digest=os.environ['DIGEST']
          native_ready,hybrid_ready,bridge_required,specified_only=map(int,os.environ['REALIZATION_COUNTS'].split(','))
          assert int(row['manifest_count']) == expected, row
          assert int(row['ledger_count']) >= expected, row
          assert int(row['tool_spec_count']) >= expected, row
          assert int(row['recorded_ledger_count']) == expected, row
          assert int(row['recorded_tool_spec_count']) == expected, row
          assert int(row['realization_count']) == expected, row
          assert int(row['native_ready_count']) == native_ready, row
          assert int(row['hybrid_ready_count']) == hybrid_ready, row
          assert int(row['bridge_required_count']) == bridge_required, row
          assert int(row['specified_only_count']) == specified_only, row
          assert native_ready+hybrid_ready+bridge_required+specified_only == expected, row
          assert row['realization_digest'] == digest, row
          assert row['realization_status'] == 'complete', row
          assert row['source_digest'] == digest, row
          assert row['status'] == 'complete', row
          print(f"Full Magnanimous capability brain materialized: {expected} specifications; realization registry verified ({native_ready} native-ready, {hybrid_ready} hybrid-ready, {bridge_required} bridge-required, {specified_only} specified-only).")
          PY
          else
            echo "Durable D1 materialization verification deferred because write quota is exhausted; deployment continues with the checked-in runtime manifest. Production mutation smoke remains authoritative and is not bypassed."
          fi

      - name: Wait for standalone session plane revision
        id: runtime-plane
        env:
          STANDALONE_ORIGIN: https://magnanimous-production.up.railway.app
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_main() {
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          }

          runtime_target="$(git rev-list -1 "$GITHUB_SHA" -- magnanimous-runtime/ worker/ frontend/ video-gateway/ api/ package.json package-lock.json)"
          if [ -z "$runtime_target" ]; then
            runtime_target="$GITHUB_SHA"
          fi

          is_safe_main_lineage() {
            local candidate="$1" main_sha target_status main_status
            [ -n "$candidate" ] || return 1
            main_sha="$(current_main)"
            target_status="$(gh api "repos/$GITHUB_REPOSITORY/compare/${runtime_target}...${candidate}" --jq '.status' 2>/dev/null || true)"
            main_status="$(gh api "repos/$GITHUB_REPOSITORY/compare/${candidate}...${main_sha}" --jq '.status' 2>/dev/null || true)"
            [[ "$target_status" == "ahead" || "$target_status" == "identical" ]] &&
            [[ "$main_status" == "ahead" || "$main_status" == "identical" ]]
          }

          success=0
          live=""
          for attempt in $(seq 1 90); do
            if curl -fsS --connect-timeout 10 --max-time 30 "$STANDALONE_ORIGIN/__magnanimous_runtime/health" >/tmp/magnanimous-session-plane-health.json; then
              live="$(python -c 'import json; print(json.load(open("/tmp/magnanimous-session-plane-health.json")).get("deploy_revision",""))')"
              if is_safe_main_lineage "$live"; then
                success=1
                break
              fi
            fi
            echo "Waiting for Railway session plane to contain runtime target $runtime_target or a newer verified main descendant (live=${live:-unknown}, workflow_sha=$GITHUB_SHA, attempt $attempt/90)."
            sleep 10
          done

          [ "$success" = "1" ] || { echo "::error::Railway session plane did not catch up before production smoke."; exit 1; }
          echo "Shared session plane ready for smoke: workflow_sha=$GITHUB_SHA runtime_target=$runtime_target live=$live"
          echo "runtime_target=$live" >> "$GITHUB_OUTPUT"
          rm -f /tmp/magnanimous-session-plane-health.json
      - name: Production smoke test
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASE_URL: https://iammagnanimousway.com
          STANDALONE_ORIGIN: https://magnanimous-production.up.railway.app
          MAGNANIMOUS_SMOKE_RUNTIME_SHA: ${{ steps.runtime-plane.outputs.runtime_target }}
        shell: bash
        run: |
          set -eo pipefail

          curl() {
            command curl --connect-timeout 10 --max-time 120 "$@"
          }

          safe_get_status() {
            local output="$1" url="$2"; shift 2
            local status="" attempt
            for attempt in 1 2 3 4 5; do
              status="$(command curl -sS --connect-timeout 10 --max-time 120 -o "$output" -w '%{http_code}' "$url" "$@" || true)"
              case "$status" in
                200) break ;;
                000|502|503|504)
                  echo "Transient read-only smoke response HTTP ${status:-request-failed}; retrying ${attempt}/5." >&2
                  sleep 2
                  ;;
                *) break ;;
              esac
            done
            printf '%s' "$status"
          }

          safe_expected_status() {
            local output="$1" expected="$2"; shift 2
            local status="" attempt
            for attempt in 1 2 3 4 5; do
              status="$(command curl -sS --connect-timeout 10 --max-time 120 -o "$output" -w '%{http_code}' "$@" || true)"
              case "$status" in
                "$expected") break ;;
                000|502|503|504)
                  echo "Transient non-mutating validation smoke response HTTP ${status:-request-failed}; retrying ${attempt}/5." >&2
                  sleep 2
                  ;;
                *) break ;;
              esac
            done
            printf '%s' "$status"
          }

          safe_idempotent_put_status() {
            local output="$1" url="$2"; shift 2
            local status="" attempt
            for attempt in 1 2 3 4 5; do
              status="$(command curl -sS --connect-timeout 10 --max-time 120 -o "$output" -w '%{http_code}' -X PUT "$url" "$@" || true)"
              case "$status" in
                200) break ;;
                000|502|503|504)
                  echo "Transient idempotent PUT smoke response HTTP ${status:-request-failed}; retrying ${attempt}/5." >&2
                  sleep 2
                  ;;
                *) break ;;
              esac
            done
            printf '%s' "$status"
          }

          deployment_smoke_oidc() {
            local oidc_json
            oidc_json=$(command curl -fsS --connect-timeout 10 --max-time 30 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=magnanimous-deploy-smoke")
            python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$oidc_json"
          }

          native_smoke_control() {
            local action="$1" tenant="$2" output="$3"
            local oidc="" status="" attempt
            for attempt in 1 2 3 4; do
              oidc="$(deployment_smoke_oidc)"
              status="$(command curl -sS --connect-timeout 10 --max-time 60 -o "$output" -w '%{http_code}' \
                -X POST "$STANDALONE_ORIGIN/__magnanimous_runtime/smoke/tenant" \
                -H 'content-type: application/json' \
                -H "Authorization: Bearer $oidc" \
                --data "{\"action\":\"$action\",\"tenant_id\":\"$tenant\",\"workflow_sha\":\"$GITHUB_SHA\",\"runtime_sha\":\"$MAGNANIMOUS_SMOKE_RUNTIME_SHA\"}" || true)"
              case "$status" in
                200) break ;;
                000|502|503|504)
                  echo "Transient standalone smoke-control response HTTP ${status:-request-failed}; retrying ${attempt}/4." >&2
                  sleep 2
                  ;;
                *) break ;;
              esac
            done
            printf '%s' "$status"
          }

          check_get() {
            local name="$1" url="$2" output="$3"
            local status
            status=$(curl -sS -o "$output" -w '%{http_code}' "$url")
            if [ "$status" != "200" ]; then
              echo "$name returned HTTP $status"
              cat "$output" || true
              exit 1
            fi
          }

          check_protected_page() {
            local name="$1" url="$2" output="$3"
            local status
            status=$(curl -LsS -o "$output" -w '%{http_code}' "$url")
            if [ "$status" != "200" ]; then
              echo "$name did not resolve through its authentication boundary; final HTTP $status"
              cat "$output" || true
              exit 1
            fi
          }

          check_get "Health endpoint" "$BASE_URL/health" /tmp/health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          assert data.get('status') == 'ok', data
          PY

          edge_bridge_token="$(python - <<'PY'
          import hashlib,os
          seed='magnanimous-edge-ai-bridge-v1\0'+os.environ['CLOUDFLARE_API_TOKEN']+'\0'+os.environ['CLOUDFLARE_ACCOUNT_ID']
          print(hashlib.sha256(seed.encode()).hexdigest())
          PY
          )"
          edge_bridge_status=$(curl -sS -o /tmp/edge-ai-bridge.json -w '%{http_code}' -X POST "$BASE_URL/api/internal/edge-ai/run"             -H 'content-type: application/json'             -H "Authorization: Bearer $edge_bridge_token"             --data '{"model":"@cf/meta/llama-3.1-8b-instruct-fast","messages":[{"role":"user","content":"Reply briefly to confirm the private Magnanimous edge AI bridge is online."}],"max_tokens":64}')
          unset edge_bridge_token
          if [ "$edge_bridge_status" != "200" ]; then echo "Private Edge AI bridge returned HTTP $edge_bridge_status"; cat /tmp/edge-ai-bridge.json || true; exit 1; fi
          python - <<'PY'
          import json
          data=json.load(open('/tmp/edge-ai-bridge.json'))
          assert data.get('ok') is True, data
          assert data.get('bridge_version') == '2026-09-25.2', data
          assert str(data.get('response') or '').strip(), data
          print('Private Edge AI bridge live inference passed at version 2026-09-25.2.')
          PY

          # These are intentionally protected pages. Following the redirect verifies
          # that the production route exists without weakening its authentication gate.
          check_protected_page "QA Training Lab page" "$BASE_URL/qa-ai-academy" /tmp/qa-training.html
          check_protected_page "Owner QA Approval page" "$BASE_URL/owner-ai-training-review" /tmp/owner-qa-review.html

          check_get "Plans endpoint" "$BASE_URL/api/plans" /tmp/plans.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/plans.json'))
          plans=data.get('plans') or []
          assert any(p.get('id') == 'free' and p.get('price_usd') == 0 for p in plans), data
          assert any(p.get('id') == 'plus' and p.get('price_usd') == 19.99 and p.get('cadence') == 'month' for p in plans), data
          assert any(p.get('id') == 'scale' and p.get('price_usd') == 199 and p.get('cadence') == 'year' for p in plans), data
          configured=data.get('tier_checkout_configured') or {}
          assert configured.get('plus') is True and configured.get('scale') is True, data
          assert any(p.get('id') == 'agency' and p.get('price_usd') == 299 and p.get('checkout_configured') is True for p in plans), data
          assert any(p.get('id') == 'agency_pro' and p.get('price_usd') == 499 and p.get('checkout_configured') is True for p in plans), data
          fallbacks=data.get('agency_payment_link_fallbacks') or {}
          assert fallbacks.get('agency') is True and fallbacks.get('agency_pro') is True, data
          print('Stripe Unlimited, Annual, Agency and Agency Pro checkout are configured.')
          PY

          check_get "Agent Mesh catalog" "$BASE_URL/api/agents" /tmp/agents.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/agents.json'))
          assert data.get('free_first') is True, data
          assert data.get('openai_used') is False, data
          assert len(data.get('agents') or []) >= 36, data
          ladder=data.get('agentic_capability_ladder') or []
          assert [x.get('level') for x in ladder] == [1,2,3,4,5,6], ladder
          agents={x.get('id'):x for x in data.get('agents') or []}
          for agent_id,level in {'foundation':1,'appsmith':2,'agentforge':3,'governor':4,'architect':5,'transform':6}.items():
              assert agent_id in agents, (agent_id,agents.keys())
              assert ((agents[agent_id].get('branch') or {}).get('capability_ladder') or {}).get('level') == level, agents[agent_id]
          assert data.get('qa_training_submission') is True, data
          assert data.get('owner_approval_required_for_global_learning') is True, data
          assert data.get('provider_details_private') is True, data
          providers=data.get('providers') or []
          assert len(providers) == 1, data
          provider=providers[0]
          assert provider.get('id') == 'auto', data
          assert provider.get('name') == 'Magnanimous AI', data
          assert provider.get('configured') is True, data
          assert provider.get('type') == 'magnanimous-private-routing', data
          provider_text=json.dumps(providers).lower()
          for forbidden in ('openai','anthropic','claude','gemini','groq','mistral','openrouter','cerebras','hugging face','cloudflare'):
              assert forbidden not in provider_text, (forbidden, data)
          assert data.get('talking_avatar',{}).get('browser_voice') is True, data
          print('Agent Mesh exposes Magnanimous private routing without execution-provider identities.')
          PY

          check_get "Private provider catalog" "$BASE_URL/api/providers" /tmp/providers.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/providers.json'))
          assert data.get('provider_details_private') is True, data
          providers=data.get('providers') or []
          assert len(providers) == 1, data
          provider=providers[0]
          assert provider.get('id') == 'auto', data
          assert provider.get('name') == 'Magnanimous AI', data
          assert provider.get('configured') is True, data
          assert provider.get('type') == 'magnanimous-private-routing', data
          provider_text=json.dumps(providers).lower()
          for forbidden in ('openai','anthropic','claude','gemini','groq','mistral','openrouter','cerebras','hugging face','cloudflare'):
              assert forbidden not in provider_text, (forbidden, data)
          print('Public provider catalog keeps execution-provider identities private.')
          PY

          check_get "Monetization endpoint" "$BASE_URL/api/monetization/config" /tmp/monetization.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/monetization.json'))
          assert 'adsense_configured' in data, data
          assert 'adsense_client_id' in data, data
          assert 'adsense_home_slot' in data, data
          assert data.get('sponsored_placements_endpoint') == '/api/ads?placement=home', data
          assert 'policy' in data, data
          PY

          check_get "Secure bootstrap public key" "$BASE_URL/api/bootstrap/public-key" /tmp/bootstrap-key.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/bootstrap-key.json'))
          assert data.get('algorithm') == 'RSA-OAEP-2048-SHA256', data
          assert data.get('public_spki_b64'), data
          PY

          webhook_status=$(curl -sS -o /tmp/webhook-invalid.json -w '%{http_code}' -X POST "$BASE_URL/api/billing/webhook" -H 'content-type: application/json' --data '{}')
          if [ "$webhook_status" != "401" ]; then
            echo "Stripe webhook bootstrap check expected HTTP 401 for an unsigned request, got $webhook_status"
            cat /tmp/webhook-invalid.json || true
            exit 1
          fi
          echo "Encrypted Stripe webhook credential is loaded and signature verification is active."

          email="deploy-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          smoke_password="Smoke-Test-Only-2026!"
          tenant_id=""
          cleanup() {
            local exit_code=$?
            if [ -n "${tenant_id:-}" ]; then
              if [[ ! "$tenant_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
                echo "::error::Refusing smoke cleanup for invalid tenant UUID: $tenant_id"
                return 1
              fi
              local cleanup_failed=0
              local native_cleanup_status
              native_cleanup_status="$(native_smoke_control cleanup "$tenant_id" /tmp/deploy-smoke-native-cleanup.json || true)"
              if [ "$native_cleanup_status" != "200" ]; then
                echo "::error::Standalone smoke-test cleanup returned HTTP ${native_cleanup_status:-request-failed}."
                cat /tmp/deploy-smoke-native-cleanup.json 2>/dev/null || true
                cleanup_failed=1
              else
                echo "Cleaned standalone deployment smoke-test tenant $tenant_id."
              fi
              local cleanup_statements=(
                "DELETE FROM auth_sessions WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agent_branch_training_submissions WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agent_branch_knowledge WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agent_mesh_messages WHERE tenant_id='${tenant_id}';"
                "DELETE FROM white_label_brain_signals WHERE tenant_id='${tenant_id}';"
                "DELETE FROM white_label_brain_memory WHERE tenant_id='${tenant_id}';"
                "DELETE FROM magnanimous_outcomes WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agency_client_apps WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agency_automation_runs WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agency_automations WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agency_affiliate_referrals WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agency_affiliate_programs WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agency_community_spaces WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agency_portal_pages WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agency_learning_assets WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agency_contracts WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agency_projects WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agency_catalog_items WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agency_usage_rebill WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agency_reputation_items WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agency_funnels WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agency_bookings WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agency_client_settings WHERE tenant_id='${tenant_id}';"
                "DELETE FROM unified_inbox_audit WHERE tenant_id='${tenant_id}';"
                "DELETE FROM unified_inbox_messages WHERE tenant_id='${tenant_id}';"
                "DELETE FROM unified_inbox_threads WHERE tenant_id='${tenant_id}';"
                "DELETE FROM media_library_assets WHERE tenant_id='${tenant_id}';"
                "DELETE FROM magnanimous_local_bridge_tasks WHERE tenant_id='${tenant_id}';"
                "DELETE FROM magnanimous_local_bridge_devices WHERE tenant_id='${tenant_id}';"
                "DELETE FROM magnanimous_local_bridge_pairings WHERE tenant_id='${tenant_id}';"
                "DELETE FROM data_studio_workbooks WHERE tenant_id='${tenant_id}';"
                "DELETE FROM magnanimous_business_ai_jobs WHERE tenant_id='${tenant_id}';"
                "DELETE FROM magnanimous_work_steps WHERE tenant_id='${tenant_id}';"
                "DELETE FROM magnanimous_work_items WHERE tenant_id='${tenant_id}';"
                "DELETE FROM bpo_audit_events WHERE tenant_id='${tenant_id}';"
                "DELETE FROM bpo_work_items WHERE tenant_id='${tenant_id}';"
                "DELETE FROM bpo_programs WHERE tenant_id='${tenant_id}';"
                "DELETE FROM bpo_clients WHERE tenant_id='${tenant_id}';"
                "DELETE FROM crm_activities WHERE tenant_id='${tenant_id}';"
                "DELETE FROM crm_opportunities WHERE tenant_id='${tenant_id}';"
                "DELETE FROM crm_contacts WHERE tenant_id='${tenant_id}';"
                "DELETE FROM billing_usage_guard WHERE tenant_id='${tenant_id}';"
                "DELETE FROM billing_management_requests WHERE tenant_id='${tenant_id}';"
                "DELETE FROM voice_agent_turns WHERE tenant_id='${tenant_id}';"
                "DELETE FROM voice_do_not_call WHERE tenant_id='${tenant_id}';"
                "DELETE FROM voice_agents WHERE tenant_id='${tenant_id}';"
                "DELETE FROM consent_records WHERE user_id IN (SELECT id FROM users WHERE tenant_id='${tenant_id}');"
                "DELETE FROM tenant_settings WHERE tenant_id='${tenant_id}';"
                "DELETE FROM billing_subscriptions WHERE tenant_id='${tenant_id}';"
                "DELETE FROM users WHERE tenant_id='${tenant_id}';"
                "DELETE FROM tenants WHERE id='${tenant_id}';"
              )
              for statement in "${cleanup_statements[@]}"; do
                if ! npx wrangler d1 execute iam-magnanimous-db --remote --command="$statement" >/tmp/deploy-smoke-cleanup.log 2>&1; then
                  if grep -qi "no such table" /tmp/deploy-smoke-cleanup.log; then
                    echo "Cleanup skipped an unused table that was never created."
                    continue
                  fi
                  echo "::error::Smoke-test cleanup failed: $statement"
                  cat /tmp/deploy-smoke-cleanup.log || true
                  cleanup_failed=1
                fi
              done
              if [ "$cleanup_failed" -ne 0 ]; then return 1; fi
              echo "Cleaned deployment smoke-test tenant $tenant_id."
            fi
            return "$exit_code"
          }
          trap cleanup EXIT

          python - "$email" "$smoke_password" > /tmp/signup-payload.json <<'PY'
          import json,sys
          email,password=sys.argv[1:3]
          print(json.dumps({'name':'Deployment Smoke Test','workspace':'Deployment Smoke Test','email':email,'password':password,'accountProcessingConsent':True,'termsAccepted':True,'marketingConsent':False}))
          PY

          status=$(curl -sS -o /tmp/signup.json -w '%{http_code}' -X POST "$BASE_URL/api/auth/signup" -H 'content-type: application/json' --data-binary @/tmp/signup-payload.json)
          if [ "$status" != "201" ]; then
            quota_code=$(python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/signup.json'))
              print(d.get('code') or '')
          except Exception:
              print('')
          PY
            )
            if [ "$status" = "503" ] && { [ "$quota_code" = "D1_DAILY_ROW_WRITE_LIMIT" ] || [ "$quota_code" = "D1_DAILY_ROW_READ_LIMIT" ]; }; then
              echo "::warning::Production auth mutation smoke deferred because Cloudflare D1 reported $quota_code. This is an external daily Free-plan limit, not a passing signup result."
              echo "D1_AUTH_SMOKE_DEFERRED=1" >> "$GITHUB_ENV"
              cat /tmp/signup.json || true
              check_get "Health endpoint under D1 quota" "$BASE_URL/health" /tmp/health-quota.json
              check_get "Magnanimous public health under D1 quota" "$BASE_URL/api/magnanimous/health" /tmp/magnanimous-quota.json
              exit 0
            fi
            echo "Signup smoke test returned HTTP $status"
            cat /tmp/signup.json || true
            exit 1
          fi

          readarray -t signup_values < <(python - <<'PY'
          import json,time
          data=json.load(open('/tmp/signup.json'))
          user=data.get('user') or {}
          token=data.get('token') or ''
          assert user.get('tenant_id'), data
          assert user.get('role') == 'owner', data
          assert token.startswith('ms1_'), data
          assert '|' not in token, data
          assert int(data.get('session_expires_at') or 0) > int(time.time()), data
          print(user['tenant_id'])
          print(token)
          PY
          )
          tenant_id="${signup_values[0]}"
          token="${signup_values[1]}"

          refresh_smoke_session() {
            python - "$email" "$smoke_password" > /tmp/login-payload.json <<'PY'
          import json,sys
          email,password=sys.argv[1:3]
          print(json.dumps({'email':email,'password':password}))
          PY
            local login_status
            login_status=$(curl -sS -o /tmp/login-refresh.json -w '%{http_code}' -X POST "$BASE_URL/api/auth/login" -H 'content-type: application/json' --data-binary @/tmp/login-payload.json)
            if [ "$login_status" != "200" ]; then
              echo "Smoke session refresh returned HTTP $login_status"
              cat /tmp/login-refresh.json || true
              return 1
            fi
            readarray -t refresh_values < <(python - "$tenant_id" <<'PY'
          import json,sys,time
          expected_tenant=sys.argv[1]
          data=json.load(open('/tmp/login-refresh.json'))
          user=data.get('user') or {}
          token=data.get('token') or ''
          assert user.get('tenant_id') == expected_tenant, data
          assert token.startswith('ms1_'), data
          assert '|' not in token, data
          assert int(data.get('session_expires_at') or 0) > int(time.time()), data
          print(user['tenant_id'])
          print(token)
          PY
            )
            token="${refresh_values[1]}"
            local verify_status
            verify_status=$(safe_get_status /tmp/me-refresh.json "$BASE_URL/api/auth/me" -H "Authorization: Bearer $token")
            if [ "$verify_status" != "200" ]; then
              echo "Refreshed smoke session verification returned HTTP $verify_status"
              cat /tmp/me-refresh.json || true
              return 1
            fi
            echo "Refreshed deployment smoke session for tenant $tenant_id."
          }

          status=$(safe_get_status /tmp/me.json "$BASE_URL/api/auth/me" -H "Authorization: Bearer $token")
          if [ "$status" != "200" ]; then echo "Authenticated account check returned HTTP $status"; cat /tmp/me.json || true; exit 1; fi

          status=$(safe_get_status /tmp/connector-absorption.json "$BASE_URL/api/magnanimous/tool-foundry/absorption?goal=email%20social%20commerce" -H "Authorization: Bearer $token")
          if [ "$status" != "200" ]; then echo "Connector capability absorption endpoint returned HTTP $status"; cat /tmp/connector-absorption.json || true; exit 1; fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/connector-absorption.json'))
          s=d.get('summary') or {}
          coverage=s.get('direct_connector_coverage') or {}
          assert d.get('identity') == 'Magnanimous AI', d
          assert d.get('mode') == 'connector-capability-absorption', d
          assert int(s.get('connector_benchmarks') or 0) >= 68, s
          assert int(s.get('direct_platform_connectors') or 0) == 13, s
          assert int(s.get('capability_specs') or 0) >= 294, s
          assert int(s.get('visible_plugin_namespaces') or 0) >= 109, s
          assert int(s.get('visible_plugin_tool_contracts') or 0) >= 2259, s
          assert int(s.get('installed_plugin_skill_namespaces') or 0) >= 109, s
          assert int(s.get('installed_plugin_skills') or 0) >= 867, s
          assert int(s.get('full_brain_capability_contracts') or 0) >= 3420, s
          assert s.get('plugin_authorization_state') == 'not-assumed', s
          assert coverage.get('covered') == 13 and coverage.get('total') == 13, coverage
          assert coverage.get('missing') == [], coverage
          assert s.get('status') == 'catalog-complete', s
          ranked=d.get('ranked') or []
          assert ranked, d
          assert all(x.get('absorption_status') == 'brain-spec-absorbed' for x in ranked), ranked
          assert all(x.get('implementation_status') == 'specified-not-assumed-native' for x in ranked), ranked
          assert all(x.get('native_target') for x in ranked), ranked

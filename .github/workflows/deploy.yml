name: Build and Deploy I AM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend
        working-directory: frontend
        run: npm install

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lock product and specialist QA contracts
        run: |
          node qa/scripts/product-contract-locks.mjs
          node qa/scripts/specialist-branch-lock.mjs

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply iam-magnanimous-db --remote

      - name: Sync optional protected Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TAVUS_API_KEY: ${{ secrets.TAVUS_API_KEY }}
          VOIP_PROVIDER_TOKEN: ${{ secrets.VOIP_PROVIDER_TOKEN }}
          VOIP_WEBHOOK_SECRET: ${{ secrets.VOIP_WEBHOOK_SECRET }}
          VIDEO_RENDERER_TOKEN: ${{ secrets.VIDEO_RENDERER_TOKEN }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          INTEGRATION_CREDENTIALS_KEY: ${{ secrets.INTEGRATION_CREDENTIALS_KEY }}
        shell: bash
        run: |
          set -eo pipefail
          sync_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" >/dev/null
              echo "Synced protected Worker secret: $name"
            fi
          }
          sync_secret STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          sync_secret STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          sync_secret TWILIO_ACCOUNT_SID "$TWILIO_ACCOUNT_SID"
          sync_secret TWILIO_AUTH_TOKEN "$TWILIO_AUTH_TOKEN"
          sync_secret TWILIO_PHONE_NUMBER "$TWILIO_PHONE_NUMBER"
          sync_secret TAVUS_API_KEY "$TAVUS_API_KEY"
          sync_secret VOIP_PROVIDER_TOKEN "$VOIP_PROVIDER_TOKEN"
          sync_secret VOIP_WEBHOOK_SECRET "$VOIP_WEBHOOK_SECRET"
          sync_secret VIDEO_RENDERER_TOKEN "$VIDEO_RENDERER_TOKEN"
          sync_secret MUX_TOKEN_ID "$MUX_TOKEN_ID"
          sync_secret MUX_TOKEN_SECRET "$MUX_TOKEN_SECRET"
          sync_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          sync_secret GOOGLE_API_KEY "$GOOGLE_API_KEY"
          sync_secret GROQ_API_KEY "$GROQ_API_KEY"
          sync_secret OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          sync_secret HF_TOKEN "$HF_TOKEN"
          sync_secret MISTRAL_API_KEY "$MISTRAL_API_KEY"
          sync_secret INTEGRATION_CREDENTIALS_KEY "$INTEGRATION_CREDENTIALS_KEY"

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Production smoke test
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASE_URL: https://iammagnanimousway.com
        shell: bash
        run: |
          set -eo pipefail

          curl() {
            command curl --connect-timeout 10 --max-time 120 "$@"
          }

          check_get() {
            local name="$1" url="$2" output="$3"
            local status
            status=$(curl -sS -o "$output" -w '%{http_code}' "$url")
            if [ "$status" != "200" ]; then
              echo "$name returned HTTP $status"
              cat "$output" || true
              exit 1
            fi
          }

          check_protected_page() {
            local name="$1" url="$2" output="$3"
            local status
            status=$(curl -LsS -o "$output" -w '%{http_code}' "$url")
            if [ "$status" != "200" ]; then
              echo "$name did not resolve through its authentication boundary; final HTTP $status"
              cat "$output" || true
              exit 1
            fi
          }

          check_get "Health endpoint" "$BASE_URL/health" /tmp/health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          assert data.get('status') == 'ok', data
          PY

          # These are intentionally protected pages. Following the redirect verifies
          # that the production route exists without weakening its authentication gate.
          check_protected_page "QA Training Lab page" "$BASE_URL/qa-ai-academy" /tmp/qa-training.html
          check_protected_page "Owner QA Approval page" "$BASE_URL/owner-ai-training-review" /tmp/owner-qa-review.html

          check_get "Plans endpoint" "$BASE_URL/api/plans" /tmp/plans.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/plans.json'))
          plans=data.get('plans') or []
          assert any(p.get('id') == 'free' and p.get('price_usd') == 0 for p in plans), data
          assert any(p.get('id') == 'business' and p.get('price_usd') == 49 for p in plans), data
          assert data.get('business_checkout_configured') is True, data
          print('Stripe Full Business checkout is configured.')
          PY

          check_get "Agent Mesh catalog" "$BASE_URL/api/agents" /tmp/agents.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/agents.json'))
          assert data.get('free_first') is True, data
          assert data.get('openai_used') is False, data
          assert len(data.get('agents') or []) >= 30, data
          assert data.get('qa_training_submission') is True, data
          assert data.get('owner_approval_required_for_global_learning') is True, data
          providers=data.get('providers') or []
          assert any(p.get('id') == 'cloudflare-ai' and p.get('configured') is True for p in providers), data
          assert all(p.get('id') != 'openai' for p in providers), data
          assert data.get('talking_avatar',{}).get('browser_voice') is True, data
          PY

          check_get "Monetization endpoint" "$BASE_URL/api/monetization/config" /tmp/monetization.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/monetization.json'))
          assert 'adsense_configured' in data, data
          assert 'adsense_client_id' in data, data
          assert 'adsense_home_slot' in data, data
          assert data.get('sponsored_placements_endpoint') == '/api/ads?placement=home', data
          assert 'policy' in data, data
          PY

          check_get "Secure bootstrap public key" "$BASE_URL/api/bootstrap/public-key" /tmp/bootstrap-key.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/bootstrap-key.json'))
          assert data.get('algorithm') == 'RSA-OAEP-2048-SHA256', data
          assert data.get('public_spki_b64'), data
          PY

          webhook_status=$(curl -sS -o /tmp/webhook-invalid.json -w '%{http_code}' -X POST "$BASE_URL/api/billing/webhook" -H 'content-type: application/json' --data '{}')
          if [ "$webhook_status" != "401" ]; then
            echo "Stripe webhook bootstrap check expected HTTP 401 for an unsigned request, got $webhook_status"
            cat /tmp/webhook-invalid.json || true
            exit 1
          fi
          echo "Encrypted Stripe webhook credential is loaded and signature verification is active."

          email="deploy-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          tenant_id=""
          cleanup() {
            local exit_code=$?
            if [ -n "${tenant_id:-}" ]; then
              if [[ ! "$tenant_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
                echo "::error::Refusing smoke cleanup for invalid tenant UUID: $tenant_id"
                return 1
              fi
              local cleanup_failed=0
              local cleanup_statements=(
                "DELETE FROM agent_branch_training_submissions WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agent_branch_knowledge WHERE tenant_id='${tenant_id}';"
                "DELETE FROM agent_mesh_messages WHERE tenant_id='${tenant_id}';"
                "DELETE FROM billing_management_requests WHERE tenant_id='${tenant_id}';"
                "DELETE FROM voice_agent_turns WHERE tenant_id='${tenant_id}';"
                "DELETE FROM voice_do_not_call WHERE tenant_id='${tenant_id}';"
                "DELETE FROM voice_agents WHERE tenant_id='${tenant_id}';"
                "DELETE FROM consent_records WHERE user_id IN (SELECT id FROM users WHERE tenant_id='${tenant_id}');"
                "DELETE FROM tenant_settings WHERE tenant_id='${tenant_id}';"
                "DELETE FROM billing_subscriptions WHERE tenant_id='${tenant_id}';"
                "DELETE FROM users WHERE tenant_id='${tenant_id}';"
                "DELETE FROM tenants WHERE id='${tenant_id}';"
              )
              for statement in "${cleanup_statements[@]}"; do
                if ! npx wrangler d1 execute iam-magnanimous-db --remote --command="$statement" >/tmp/deploy-smoke-cleanup.log 2>&1; then
                  echo "::error::Smoke-test cleanup failed: $statement"
                  cat /tmp/deploy-smoke-cleanup.log || true
                  cleanup_failed=1
                fi
              done
              if [ "$cleanup_failed" -ne 0 ]; then return 1; fi
              echo "Cleaned deployment smoke-test tenant $tenant_id."
            fi
            return "$exit_code"
          }
          trap cleanup EXIT

          python - "$email" > /tmp/signup-payload.json <<'PY'
          import json,sys
          email=sys.argv[1]
          print(json.dumps({'name':'Deployment Smoke Test','workspace':'Deployment Smoke Test','email':email,'password':'Smoke-Test-Only-2026!','accountProcessingConsent':True,'termsAccepted':True,'marketingConsent':False}))
          PY

          status=$(curl -sS -o /tmp/signup.json -w '%{http_code}' -X POST "$BASE_URL/api/auth/signup" -H 'content-type: application/json' --data-binary @/tmp/signup-payload.json)
          if [ "$status" != "201" ]; then echo "Signup smoke test returned HTTP $status"; cat /tmp/signup.json || true; exit 1; fi

          readarray -t signup_values < <(python - <<'PY'
          import json
          data=json.load(open('/tmp/signup.json'))
          user=data.get('user') or {}
          assert user.get('tenant_id'), data
          assert data.get('token'), data
          print(user['tenant_id'])
          print(data['token'])
          PY
          )
          tenant_id="${signup_values[0]}"
          token="${signup_values[1]}"

          status=$(curl -sS -o /tmp/me.json -w '%{http_code}' "$BASE_URL/api/auth/me" -H "Authorization: Bearer $token")
          if [ "$status" != "200" ]; then echo "Authenticated account check returned HTTP $status"; cat /tmp/me.json || true; exit 1; fi

          admin_status=$(curl -sS -o /tmp/admin-denied.json -w '%{http_code}' "$BASE_URL/api/admin/settings" -H "Authorization: Bearer $token")
          if [ "$admin_status" != "403" ]; then echo "Customer account global-admin isolation expected HTTP 403, got $admin_status"; cat /tmp/admin-denied.json || true; exit 1; fi

          credential_status=$(curl -sS -o /tmp/credentials-denied.json -w '%{http_code}' "$BASE_URL/api/integrations/platform-credentials" -H "Authorization: Bearer $token")
          if [ "$credential_status" != "403" ]; then echo "Customer platform-credential isolation expected HTTP 403, got $credential_status"; cat /tmp/credentials-denied.json || true; exit 1; fi
          echo "Customer workspaces are isolated from global platform controls."

          status=$(curl -sS -o /tmp/agent-chat.json -w '%{http_code}' -X POST "$BASE_URL/api/agents/chat" -H 'content-type: application/json' -H "Authorization: Bearer $token" --data '{"agent_id":"bobby","provider":"cloudflare-ai","message":"Give one short sentence confirming the native I AM Agent Mesh is online."}')
          if [ "$status" != "200" ]; then echo "Agent Mesh chat returned HTTP $status"; cat /tmp/agent-chat.json || true; exit 1; fi
          python - <<'PY'
          import json
          data=json.load(open('/tmp/agent-chat.json'))
          assert data.get('output'), data
          assert data.get('shared_memory') is True, data
          assert data.get('agent',{}).get('id') == 'bobby', data
          assert data.get('branch_identity') is True, data
          assert 'provider' not in data and 'provider_name' not in data and 'model' not in data, data
          PY

          status=$(curl -sS -o /tmp/qa-submit.json -w '%{http_code}' -X POST "$BASE_URL/api/agents/branch/submissions" -H 'content-type: application/json' -H "Authorization: Bearer $token" --data '{"agent_id":"quality","title":"Deployment QA challenge","content":"A strong QA coach should separate evidence from assumptions and give observable coaching points.","challenge_prompt":"Score a difficult customer call and identify the top coaching behavior.","expected_outcome":"A direct score rationale and observable coaching recommendation."}')
          if [ "$status" != "201" ]; then echo "QA training submission returned HTTP $status"; cat /tmp/qa-submit.json || true; exit 1; fi
          qa_id=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/qa-submit.json'))
          assert d.get('status') == 'pending', d
          assert d.get('requires_owner_approval') is True, d
          print(d['id'])
          PY
          )
          review_status=$(curl -sS -o /tmp/qa-review-denied.json -w '%{http_code}' -X POST "$BASE_URL/api/agents/branch/submissions/review" -H 'content-type: application/json' -H "Authorization: Bearer $token" --data "{\"id\":$qa_id,\"action\":\"approve\"}")
          if [ "$review_status" != "403" ]; then echo "QA global approval must be platform-owner-only; got HTTP $review_status"; cat /tmp/qa-review-denied.json || true; exit 1; fi
          echo "QA contributors can submit training, but cannot publish global specialist knowledge."

          status=$(curl -sS -o /tmp/specialist-handoff.json -w '%{http_code}' -X POST "$BASE_URL/api/chat" -H 'content-type: application/json' -H "Authorization: Bearer $token" --data '{"provider":"cloudflare-ai","message":"Create a social content post announcing a new product in a confident friendly voice.","use_knowledge":false,"use_tools":false,"learn_links":false,"specialist_routing":true}')
          if [ "$status" != "200" ]; then echo "Magnanimous specialist handoff returned HTTP $status"; cat /tmp/specialist-handoff.json || true; exit 1; fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/specialist-handoff.json'))
          assert d.get('specialist_handoff') is True, d
          assert d.get('specialist',{}).get('id') == 'dina', d
          assert d.get('output','').startswith('Hello, I am Dina.'), d
          assert 'provider' not in d and 'provider_name' not in d and 'model' not in d, d
          PY

          status=$(curl -sS -o /tmp/checkout.json -w '%{http_code}' -X POST "$BASE_URL/api/billing/checkout" -H 'content-type: application/json' -H "Authorization: Bearer $token" --data '{}')
          if [ "$status" != "200" ]; then echo "Payment Link checkout returned HTTP $status"; cat /tmp/checkout.json || true; exit 1; fi
          python - "$tenant_id" <<'PY'
          import json,sys,urllib.parse
          tenant=sys.argv[1];data=json.load(open('/tmp/checkout.json'));url=data.get('url','')
          assert url.startswith('https://buy.stripe.com/'), data
          query=urllib.parse.parse_qs(urllib.parse.urlparse(url).query)
          assert query.get('client_reference_id') == [tenant], data
          assert data.get('mode') == 'payment_link', data
          PY

          status=$(curl -sS -o /tmp/billing-request.json -w '%{http_code}' -X POST "$BASE_URL/api/billing/management-request" -H 'content-type: application/json' -H "Authorization: Bearer $token" --data '{"request_type":"billing_question","message":"Deployment smoke test billing request."}')
          if [ "$status" != "201" ]; then echo "Billing management request returned HTTP $status"; cat /tmp/billing-request.json || true; exit 1; fi

          status=$(curl -sS -o /tmp/voice-agent.json -w '%{http_code}' "$BASE_URL/api/voice-agent/config" -H "Authorization: Bearer $token")
          if [ "$status" != "200" ]; then echo "AI Receptionist config returned HTTP $status"; cat /tmp/voice-agent.json || true; exit 1; fi
          python - <<'PY'
          import json
          data=json.load(open('/tmp/voice-agent.json'))
          assert data.get('free_browser_calling') is True, data
          assert data.get('ai_engine') is True, data
          assert 'twilio_configured' in data, data
          assert 'tavus_configured' in data, data
          PY

          check_get "Magnanimous AI health endpoint" "$BASE_URL/api/magnanimous/health" /tmp/magnanimous.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/magnanimous.json'))
          assert data.get('ok') is True, data
          assert data.get('magnanimous') == 'online', data
          assert data.get('operator') == 'Magnanimous AI', data
          assert data.get('workers_ai_bound') is True, data
          PY

          echo "Production health, QA contribution with owner-only approval, automatic named specialist handoff, provider privacy, native Agent Mesh, Magnanimous AI, AI Receptionist, billing, monetization, signup, sessions, and platform-owner isolation passed."

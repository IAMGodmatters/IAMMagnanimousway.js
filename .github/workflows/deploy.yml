name: Build and Deploy I AM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend
        working-directory: frontend
        run: npm install

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply iam-magnanimous-db --remote

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Production smoke test
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASE_URL: https://iam-magnanimous.iam-magnanimous.workers.dev
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS "$BASE_URL/health" > /tmp/health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          assert data.get('status') == 'ok', data
          PY

          curl -fsS "$BASE_URL/api/plans" > /tmp/plans.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/plans.json'))
          plans=data.get('plans') or []
          assert any(p.get('id') == 'free' and p.get('price_usd') == 0 for p in plans), data
          assert any(p.get('id') == 'business' and p.get('price_usd') == 49 for p in plans), data
          assert data.get('business_checkout_configured') is True, 'Stripe checkout is not fully configured in the Worker environment'
          PY

          email="deploy-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          tenant_id=""
          cleanup() {
            if [ -n "${tenant_id:-}" ]; then
              npx wrangler d1 execute iam-magnanimous-db --remote --command="DELETE FROM consent_records WHERE user_id IN (SELECT id FROM users WHERE tenant_id='${tenant_id}'); DELETE FROM tenant_settings WHERE tenant_id='${tenant_id}'; DELETE FROM billing_subscriptions WHERE tenant_id='${tenant_id}'; DELETE FROM users WHERE tenant_id='${tenant_id}'; DELETE FROM tenants WHERE id='${tenant_id}';" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          python - "$email" > /tmp/signup-payload.json <<'PY'
          import json,sys
          email=sys.argv[1]
          print(json.dumps({
            'name':'Deployment Smoke Test',
            'workspace':'Deployment Smoke Test',
            'email':email,
            'password':'Smoke-Test-Only-2026!',
            'accountProcessingConsent':True,
            'termsAccepted':True,
            'marketingConsent':False
          }))
          PY

          status=$(curl -sS -o /tmp/signup.json -w '%{http_code}' -X POST "$BASE_URL/api/auth/signup" -H 'content-type: application/json' --data-binary @/tmp/signup-payload.json)
          if [ "$status" != "201" ]; then
            cat /tmp/signup.json
            echo "Signup smoke test returned HTTP $status"
            exit 1
          fi

          tenant_id=$(python - <<'PY'
          import json
          data=json.load(open('/tmp/signup.json'))
          user=data.get('user') or {}
          assert user.get('role') == 'owner', data
          assert user.get('tenant_id'), data
          assert data.get('token'), data
          print(user['tenant_id'])
          PY
          )

          echo "Production health, Free/$49 billing configuration, signup, owner role, session creation, and consent recording passed."

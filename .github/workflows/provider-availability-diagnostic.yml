name: Provider Availability Diagnostic

on:
  push:
    branches:
      - diag/provider-availability
    paths:
      - .github/workflows/provider-availability-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install
      - name: Report configured free-first provider credential names only
        working-directory: worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          KEYS="'GOOGLE_API_KEY','GROQ_API_KEY','OPENROUTER_API_KEY','MISTRAL_API_KEY','NVIDIA_API_KEY','HF_TOKEN','CEREBRAS_API_KEY'"
          npx wrangler d1 execute iam-magnanimous-db --remote --json --command="SELECT credential_key, updated_at FROM platform_credentials WHERE credential_key IN (${KEYS}) ORDER BY credential_key;" > /tmp/provider-keys.json
          npx wrangler d1 execute iam-magnanimous-db --remote --json --command="SELECT credential_key, created_at FROM bootstrap_secrets WHERE credential_key IN (${KEYS}) ORDER BY credential_key;" > /tmp/bootstrap-keys.json
          python - <<'PY'
          import json
          def keys(path):
              data=json.load(open(path)); found=[]
              def walk(x):
                  if isinstance(x,dict):
                      k=x.get('credential_key')
                      if k and k not in found: found.append(k)
                      for v in x.values(): walk(v)
                  elif isinstance(x,list):
                      for v in x: walk(v)
              walk(data)
              return found
          vault=keys('/tmp/provider-keys.json')
          bootstrap=keys('/tmp/bootstrap-keys.json')
          combined=[]
          for k in vault+bootstrap:
              if k not in combined: combined.append(k)
          print('VAULT_FREE_FIRST_KEYS='+','.join(vault))
          print('BOOTSTRAP_FREE_FIRST_KEYS='+','.join(bootstrap))
          print('COMBINED_FREE_FIRST_KEYS='+','.join(combined))
          print('COMBINED_FREE_FIRST_COUNT='+str(len(combined)))
          PY

name: Deep Platform Control Lock

on:
  pull_request:
  push:
    branches: [main, codex/full-platform-lockdown]

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify deep interaction contracts
        working-directory: frontend
        run: node scripts/deep-interaction-lock.mjs

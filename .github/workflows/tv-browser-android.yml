name: Magnanimous TV Browser Android APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-tv-browser/**'
      - 'frontend/app/tv-remote/**'
      - 'worker/src/tv-companion-runtime.js'
      - 'worker/src/router-entrypoint.js'
      - 'worker/migrations/0108_tv_companion.sql'
      - 'qa/scripts/tv-companion-lock.mjs'
      - '.github/workflows/tv-browser-android.yml'
permissions:
  contents: read
jobs:
  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node qa/scripts/tv-companion-lock.mjs
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build TV debug APK
        run: gradle -p android-tv-browser :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: magnanimous-tv-browser-debug-apk
          path: android-tv-browser/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Sync Twilio Voice Configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Sync protected Twilio Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
          TWILIO_TWIML_APP_SID: ${{ secrets.TWILIO_TWIML_APP_SID }}
        shell: bash
        run: |
          set -euo pipefail
          sync_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" >/dev/null
              echo "Synced protected Worker secret: $name"
            else
              echo "Missing GitHub secret: $name"
            fi
          }
          sync_secret TWILIO_ACCOUNT_SID "$TWILIO_ACCOUNT_SID"
          sync_secret TWILIO_AUTH_TOKEN "$TWILIO_AUTH_TOKEN"
          sync_secret TWILIO_PHONE_NUMBER "$TWILIO_PHONE_NUMBER"
          sync_secret TWILIO_API_KEY_SID "$TWILIO_API_KEY_SID"
          sync_secret TWILIO_API_KEY_SECRET "$TWILIO_API_KEY_SECRET"
          sync_secret TWILIO_TWIML_APP_SID "$TWILIO_TWIML_APP_SID"

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

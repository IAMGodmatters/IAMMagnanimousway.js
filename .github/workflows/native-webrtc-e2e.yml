name: Native WebRTC Browser Media E2E

on:
  push:
    branches: ['**']
    paths:
      - 'telecom-core/**'
      - '.github/workflows/native-webrtc-e2e.yml'
  pull_request:
    paths:
      - 'telecom-core/**'
      - '.github/workflows/native-webrtc-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-webrtc-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-media:
    name: Real Chromium registration and two-way media
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install browser probe dependencies
        working-directory: telecom-core/webrtc-e2e
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: telecom-core/webrtc-e2e
        run: npx playwright install --with-deps chromium

      - name: Generate ephemeral test TLS certificate and audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p telecom-core/certs /tmp/magnanimous-webrtc-e2e
          openssl req -x509 -nodes -newkey rsa:2048             -keyout telecom-core/certs/privkey.pem             -out telecom-core/certs/fullchain.pem             -days 1             -subj '/CN=localhost'             -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          chmod 0644 telecom-core/certs/privkey.pem telecom-core/certs/fullchain.pem
          python3 - <<'PY'
          import math, struct, wave
          path='/tmp/magnanimous-webrtc-e2e/tone.wav'
          rate=48000
          seconds=60
          frequency=440.0
          amplitude=0.18
          with wave.open(path,'wb') as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)
              for n in range(rate*seconds):
                  sample=int(32767*amplitude*math.sin(2*math.pi*frequency*n/rate))
                  wav.writeframesraw(struct.pack('<h',sample))
          print(path)
          PY

      - name: Build native Asterisk WebRTC core
        run: docker build -t magnanimous-webrtc-e2e:ci telecom-core/asterisk

      - name: Build Telecom Core API
        run: docker build -t magnanimous-telecom-api:webrtc-ci telecom-core/control-api

      - name: Start native Asterisk WebRTC core
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name magnanimous-webrtc-e2e --network host             -v "$GITHUB_WORKSPACE/telecom-core/certs:/certs:ro"             -e ASTERISK_ARI_USER=ci-ari             -e ASTERISK_ARI_PASSWORD='ci-ari-password-3fe92bf4'             -e ASTERISK_WEBRTC_ENABLED=true             -e ASTERISK_HTTPS_PORT=8089             -e ASTERISK_TLS_CERT_FILE=/certs/fullchain.pem             -e ASTERISK_TLS_KEY_FILE=/certs/privkey.pem             -e MAGNANIMOUS_SIP_DOMAIN=webrtc.test             -e MAGNANIMOUS_WEBRTC_EXTENSION=1100             -e MAGNANIMOUS_WEBRTC_ECHO_EXTENSION=6000             -e MAGNANIMOUS_STASIS_DIAGNOSTIC_EXTENSION=6001             -e ASTERISK_STASIS_APP=magnanimous-call-control             -e MAGNANIMOUS_WEBRTC_PASSWORD='ci-webrtc-password-8b1a2fd7'             -e MAGNANIMOUS_AI_EXTENSION=9000             -e MAGNANIMOUS_AI_PASSWORD='ci-ai-password-18e3a499'             -e MAGNANIMOUS_ADMIN_EXTENSION=1000             -e MAGNANIMOUS_ADMIN_PASSWORD='ci-admin-password-52d8941c'             magnanimous-webrtc-e2e:ci
          for attempt in $(seq 1 60); do
            if printf '' | openssl s_client -connect 127.0.0.1:8089 -servername localhost >/tmp/magnanimous-webrtc-e2e/tls.txt 2>&1 && \
               docker exec magnanimous-webrtc-e2e asterisk -rx 'http show status' >/tmp/magnanimous-webrtc-e2e/httpstatus.txt 2>/dev/null && \
               grep -q '/ws => Asterisk HTTP WebSocket' /tmp/magnanimous-webrtc-e2e/httpstatus.txt && \
               docker exec magnanimous-webrtc-e2e asterisk -rx 'pjsip show endpoint 1100' >/tmp/magnanimous-webrtc-e2e/endpoint.txt 2>/dev/null && \
               grep -Eq 'webrtc[[:space:]]*: yes' /tmp/magnanimous-webrtc-e2e/endpoint.txt; then
              echo 'Asterisk TLS/WSS/WebRTC endpoint is ready.'
              cat /tmp/magnanimous-webrtc-e2e/httpstatus.txt
              cat /tmp/magnanimous-webrtc-e2e/endpoint.txt
              exit 0
            fi
            sleep 2
          done
          docker logs magnanimous-webrtc-e2e || true
          exit 1

      - name: Start Telecom Core API for ephemeral browser credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name magnanimous-webrtc-db \
            -e POSTGRES_DB=magnanimous_sip \
            -e POSTGRES_USER=magnanimous_sip \
            -e POSTGRES_PASSWORD='ci-sip-db-password-0edc88df' \
            -p 127.0.0.1:55432:5432 \
            -v "$GITHUB_WORKSPACE/telecom-core/sip-core/db/init.sql:/docker-entrypoint-initdb.d/001-magnanimous-sip.sql:ro" \
            postgres:16-bookworm
          for attempt in $(seq 1 60); do
            if docker exec magnanimous-webrtc-db pg_isready -U magnanimous_sip -d magnanimous_sip >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker logs magnanimous-webrtc-db || true
              exit 1
            fi
            sleep 1
          done
          docker run -d --name magnanimous-webrtc-api --network host             -e TELECOM_API_TOKEN='ci-telecom-token-6f1e9c2d'             -e TELECOM_WEBHOOK_SECRET='ci-webhook-secret'             -e ASTERISK_ARI_URL=http://127.0.0.1:8088/ari             -e ASTERISK_ARI_USER=ci-ari             -e ASTERISK_ARI_PASSWORD='ci-ari-password-3fe92bf4'             -e ASTERISK_WEBRTC_ENABLED=true             -e ASTERISK_WEBRTC_PUBLIC_URL=wss://localhost:8089/ws             -e ASTERISK_WEBRTC_DYNAMIC_SESSIONS_ENABLED=true             -e ASTERISK_STASIS_ENABLED=true             -e ASTERISK_STASIS_APP=magnanimous-call-control             -e ASTERISK_STASIS_RECONNECT_SECONDS=0.5             -e ASTERISK_STASIS_CHANNEL_WAIT_SECONDS=2             -e ASTERISK_WEBRTC_SESSION_TTL_SECONDS=900             -e MAGNANIMOUS_SIP_DOMAIN=webrtc.test             -e SIP_DB_HOST=127.0.0.1             -e SIP_DB_PORT=55432             -e SIP_DB_NAME=magnanimous_sip             -e SIP_DB_USER=magnanimous_sip             -e SIP_DB_PASSWORD='ci-sip-db-password-0edc88df'             magnanimous-telecom-api:webrtc-ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/magnanimous-webrtc-e2e/api-health.json; then
              exit 0
            fi
            sleep 1
          done
          docker logs magnanimous-webrtc-api || true
          exit 1

      - name: Issue ephemeral native browser credential
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST             -H 'Authorization: Bearer ci-telecom-token-6f1e9c2d'             http://127.0.0.1:8080/v1/webrtc/sessions             > /tmp/magnanimous-webrtc-e2e/session.json
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('/tmp/magnanimous-webrtc-e2e/session.json','utf8'));
          for (const [k,v] of Object.entries({
            WEBRTC_EXTENSION:d.username,
            WEBRTC_PASSWORD:d.password,
            WEBRTC_DOMAIN:d.domain,
            WEBRTC_WSS_URL:d.wss_url,
            WEBRTC_SESSION_ID:d.session_id
          })) fs.appendFileSync(process.env.GITHUB_ENV,`${k}=${v}\n`);
          if (d.pstn_direct !== false) throw new Error('Ephemeral browser session must not permit direct PSTN dialing');
          if (!Array.isArray(d.allowed_call_scope) || !d.allowed_call_scope.includes('diagnostic-echo')) throw new Error('Echo diagnostic scope missing');
          if (!d.allowed_call_scope.includes('diagnostic-stasis')) throw new Error('Stasis diagnostic scope missing');
          NODE

      - name: Build native browser probe
        working-directory: telecom-core/webrtc-e2e
        run: npm run build

      - name: Start local probe page
        shell: bash
        run: |
          python3 -m http.server 4173 --directory telecom-core/webrtc-e2e/dist >/tmp/magnanimous-webrtc-e2e/web.log 2>&1 &
          echo $! >/tmp/magnanimous-webrtc-e2e/web.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/magnanimous-webrtc-e2e/web.log || true
          exit 1

      - name: Prove real browser registration and bidirectional audio
        working-directory: telecom-core/webrtc-e2e
        env:
          WEBRTC_TEST_PAGE: http://127.0.0.1:4173/
          WEBRTC_ECHO_EXTENSION: '6000'
          FAKE_AUDIO_WAV: /tmp/magnanimous-webrtc-e2e/tone.wav
          ASTERISK_CONTAINER: magnanimous-webrtc-e2e
          WEBRTC_ALLOW_INSECURE_TLS: 'true'
          WEBRTC_SERVER_ASSERT_MODE: local-docker
        run: npm run probe

      - name: Prove real browser channel enters private Stasis app
        shell: bash
        working-directory: telecom-core/webrtc-e2e
        env:
          WEBRTC_TEST_PAGE: http://127.0.0.1:4173/
          WEBRTC_ECHO_EXTENSION: '6001'
          WEBRTC_REQUIRE_MEDIA: 'false'
          WEBRTC_HOLD_MS: '10000'
          FAKE_AUDIO_WAV: /tmp/magnanimous-webrtc-e2e/tone.wav
          ASTERISK_CONTAINER: magnanimous-webrtc-e2e
          WEBRTC_ALLOW_INSECURE_TLS: 'true'
          WEBRTC_SERVER_ASSERT_MODE: local-docker
        run: |
          set -euo pipefail
          npm run probe > /tmp/magnanimous-webrtc-e2e/stasis-browser-probe.log 2>&1 &
          probe_pid=$!
          ok=false
          for attempt in $(seq 1 40); do
            if curl -fsS -H 'Authorization: Bearer ci-telecom-token-6f1e9c2d' http://127.0.0.1:8080/v1/stasis > /tmp/magnanimous-webrtc-e2e/stasis-status.json; then
              if node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('/tmp/magnanimous-webrtc-e2e/stasis-status.json','utf8'));
          if (d.identity !== 'Magnanimous Telecom') process.exit(1);
          if (d.configured !== true || d.connected !== true) process.exit(1);
          if (d.persistent_state_ready !== true || d.restart_recovery_enabled !== true) process.exit(1);
          if (Number(d.tracked_channels || 0) < 1 || Number(d.event_count || 0) < 1) process.exit(1);
          if (d.public_ari_exposed !== false) process.exit(1);
          NODE
              then
                ok=true
                break
              fi
            fi
            sleep 0.5
          done
          wait "$probe_pid"
          cat /tmp/magnanimous-webrtc-e2e/stasis-browser-probe.log
          cat /tmp/magnanimous-webrtc-e2e/stasis-status.json
          [ "$ok" = true ] || { echo 'Real browser channel did not enter the private Magnanimous Stasis app.' >&2; exit 1; }

      - name: Revoke ephemeral native browser credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WEBRTC_SESSION_ID:-}"
          curl -fsS -X DELETE \
            -H 'Authorization: Bearer ci-telecom-token-6f1e9c2d' \
            "http://127.0.0.1:8080/v1/webrtc/sessions/${WEBRTC_SESSION_ID}" \
            > /tmp/magnanimous-webrtc-e2e/session-delete.json
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('/tmp/magnanimous-webrtc-e2e/session-delete.json','utf8'));
          if (!d.ok || !d.deleted || d.session_id !== process.env.WEBRTC_SESSION_ID) {
            throw new Error('Telecom Core did not confirm ephemeral session deletion');
          }
          NODE

      - name: Verify Asterisk removed ephemeral endpoint
        shell: bash
        run: |
          set -euo pipefail
          output="$(docker exec magnanimous-webrtc-e2e asterisk -rx "pjsip show endpoint ${WEBRTC_EXTENSION}" 2>&1 || true)"
          printf '%s\n' "$output" | tee /tmp/magnanimous-webrtc-e2e/asterisk-endpoint-after-delete.txt
          if printf '%s\n' "$output" | grep -Eq "Endpoint:[[:space:]]+${WEBRTC_EXTENSION}"; then
            echo 'Ephemeral WebRTC endpoint still exists after revocation.' >&2
            exit 1
          fi

      - name: Capture Asterisk WebRTC evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/magnanimous-webrtc-e2e
          docker exec magnanimous-webrtc-e2e asterisk -rx 'http show status' > /tmp/magnanimous-webrtc-e2e/asterisk-http.txt 2>&1 || true
          if [ -n "${WEBRTC_EXTENSION:-}" ]; then
            docker exec magnanimous-webrtc-e2e asterisk -rx "pjsip show endpoint ${WEBRTC_EXTENSION}" > /tmp/magnanimous-webrtc-e2e/asterisk-endpoint-after-delete.txt 2>&1 || true
          fi
          docker exec magnanimous-webrtc-e2e asterisk -rx 'pjsip show contacts' > /tmp/magnanimous-webrtc-e2e/asterisk-contacts.txt 2>&1 || true
          docker logs magnanimous-webrtc-e2e > /tmp/magnanimous-webrtc-e2e/asterisk.log 2>&1 || true
          docker logs magnanimous-webrtc-api > /tmp/magnanimous-webrtc-e2e/control-api.log 2>&1 || true
          docker logs magnanimous-webrtc-db > /tmp/magnanimous-webrtc-e2e/postgres.log 2>&1 || true

      - name: Upload WebRTC proof evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: magnanimous-native-webrtc-e2e-${{ github.run_number }}
          path: /tmp/magnanimous-webrtc-e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop WebRTC test services
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/magnanimous-webrtc-e2e/web.pid ]; then kill "$(cat /tmp/magnanimous-webrtc-e2e/web.pid)" 2>/dev/null || true; fi
          docker rm -f magnanimous-webrtc-api >/dev/null 2>&1 || true
          docker rm -f magnanimous-webrtc-db >/dev/null 2>&1 || true
          docker rm -f magnanimous-webrtc-e2e >/dev/null 2>&1 || true

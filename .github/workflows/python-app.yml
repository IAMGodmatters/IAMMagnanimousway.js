# Python validation workflow
name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Validate Python syntax
        run: python -m compileall -q backend
      - name: Lint Python
        run: flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests when present
        run: |
          if find . -path './.git' -prune -o -type f -name 'test_*.py' -print -quit | grep -q .; then
            pytest
          else
            echo "No pytest test files present; syntax validation passed."
          fi

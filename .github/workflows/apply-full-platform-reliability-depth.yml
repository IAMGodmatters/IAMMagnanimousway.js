name: Apply Full Platform Reliability Depth

on:
  push:
    branches: [fix/full-platform-reliability-depth]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/full-platform-reliability-depth
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply deterministic repair
        run: node scripts/apply-full-platform-reliability-depth.mjs
      - name: Remove one-time transformer
        run: rm scripts/apply-full-platform-reliability-depth.mjs .github/workflows/apply-full-platform-reliability-depth.yml
      - name: Commit repaired sources
        run: |
          git config user.name "Magnanimous Reliability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Magnanimous free-plan depth storage HTTP and Next security"
          git push origin HEAD:fix/full-platform-reliability-depth

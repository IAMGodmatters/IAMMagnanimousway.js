name: Finish Magnanimous DNS Integration

on:
  push:
    branches: [codex/magnanimous-dns-finish]
    paths:
      - 'scripts/finish-dns-integration.mjs'
      - '.github/workflows/finish-dns-integration.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: codex/magnanimous-dns-finish
          fetch-depth: 0

      - name: Apply DNS completion patch
        run: node scripts/finish-dns-integration.mjs

      - name: Verify patched JavaScript and DNS contracts
        run: |
          node --check worker/src/magnanimous-dns-runtime.js
          node --check worker/src/magnanimous-porkbun-dns-runtime.js
          node --check worker/src/provider-runtime-env.js
          node --check worker/src/platform-credentials.js
          node --check worker/src/magnanimous-brain-runtime.js
          node qa/scripts/dns-intelligence-lock.mjs

      - name: Commit patched integration
        run: |
          if git diff --quiet; then
            echo 'No DNS completion changes were necessary.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish Magnanimous DNS registrar integration'
          git push origin HEAD:codex/magnanimous-dns-finish

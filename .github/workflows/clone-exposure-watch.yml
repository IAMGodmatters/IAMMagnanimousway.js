name: Clone Exposure Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check public clone/reuse signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node qa/scripts/clone-exposure-watch.mjs

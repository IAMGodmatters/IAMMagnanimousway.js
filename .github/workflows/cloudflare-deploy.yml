name: I AM Platform — Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build static frontend
        working-directory: frontend
        run: npm run build

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Validate Cloudflare deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Apply remote D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply iam-magnanimous-db --remote

      - name: Deploy Worker and static frontend
        working-directory: worker
        run: npx wrangler deploy --yes

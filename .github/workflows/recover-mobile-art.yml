name: Repair Mobile Artwork Asset

on:
  push:
    branches: [fix/mobile-asset-recovery-20261015]
    paths:
      - '.github/workflows/recover-mobile-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-mobile-art:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-asset-recovery-20261015
          fetch-depth: 0
      - name: Re-encode existing approved mobile artwork as real WebP
        shell: bash
        run: |
          set -euo pipefail
          src='frontend/public/mobile-dashboard-approved.webp'
          test -s "$src"
          echo "Source identification:"
          file "$src" || true
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=nw=1 "$src"
          ffmpeg -hide_banner -loglevel error -y -i "$src" -frames:v 1 -c:v libwebp -quality 95 /tmp/mobile-dashboard-approved.webp
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=nw=1 /tmp/mobile-dashboard-approved.webp
          test "$(stat -c %s /tmp/mobile-dashboard-approved.webp)" -gt 10000
          mv /tmp/mobile-dashboard-approved.webp "$src"
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const path='frontend/public/mobile-dashboard-approved.webp';
          const hash=crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex').toUpperCase();
          const lock='qa/scripts/home-3d-module-marks-lock.mjs';
          let text=fs.readFileSync(lock,'utf8');
          text=text.replace(/const expectedMobileHash='[A-F0-9]+';/,`const expectedMobileHash='${hash}';`);
          fs.writeFileSync(lock,text);
          console.log(`Re-encoded WebP SHA256 ${hash}`);
          NODE
          node qa/scripts/home-3d-module-marks-lock.mjs
      - name: Commit repaired asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/mobile-dashboard-approved.webp qa/scripts/home-3d-module-marks-lock.mjs
          if git diff --cached --quiet; then
            echo 'Asset was already browser-safe; no change needed.'
            exit 0
          fi
          git commit -m 'Repair mobile artwork browser encoding'
          git push origin HEAD:fix/mobile-asset-recovery-20261015

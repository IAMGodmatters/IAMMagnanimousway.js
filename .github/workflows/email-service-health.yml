name: Email Service Health

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Inspect latest owner email delivery failure
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute iam-magnanimous-db --remote --json --command \
            "SELECT status,provider,last_error,updated_at FROM magnanimous_mail_outbox WHERE kind='owner-login-code' ORDER BY updated_at DESC LIMIT 1;" \
            > /tmp/mail-health.json
          python - <<'PY'
          import json,re
          p=json.load(open('/tmp/mail-health.json'))
          rows=[]
          def walk(x):
              if isinstance(x,dict):
                  if 'last_error' in x and 'status' in x: rows.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(p)
          row=rows[-1] if rows else {}
          err=re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+','[redacted-email]',str(row.get('last_error') or ''))
          print('mail_status='+str(row.get('status') or 'none'))
          print('mail_provider='+str(row.get('provider') or 'none'))
          print('mail_error='+err[:500])
          if 'NO_SENDER' in err:
              print('::warning::No connected Gmail/Outlook sender is available yet. Owner email-code login will use the password fallback until a sender is connected.')
          PY

      - name: Free-first email sending posture
        if: ${{ vars.ENABLE_CLOUDFLARE_EMAIL_SENDING != 'true' }}
        shell: bash
        run: |
          echo 'Cloudflare Email Sending domain onboarding is intentionally skipped.'
          echo 'This deployment stays free-first and uses connected Gmail/Outlook delivery plus the owner password fallback.'
          echo 'Set repository variable ENABLE_CLOUDFLARE_EMAIL_SENDING=true only after a paid Cloudflare Email Sending entitlement is intentionally enabled.'

      - name: Onboard I AM Magnanimous Way sending domain
        if: ${{ vars.ENABLE_CLOUDFLARE_EMAIL_SENDING == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          domain='iammagnanimousway.com'
          zone_code=$(curl -sS -G -o /tmp/cf-zone.json -w '%{http_code}' \
            'https://api.cloudflare.com/client/v4/zones' \
            --data-urlencode "name=$domain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "zone_lookup_http=$zone_code"
          python - <<'PY' > /tmp/zone-id
          import json
          d=json.load(open('/tmp/cf-zone.json'))
          rows=d.get('result') or []
          if rows: print(rows[0].get('id',''),end='')
          PY
          zone_id="$(cat /tmp/zone-id)"
          if [ -z "$zone_id" ]; then
            python - <<'PY'
          import json
          d=json.load(open('/tmp/cf-zone.json'))
          print('zone_lookup_success='+('1' if d.get('success') else '0'))
          for e in d.get('errors') or []:
              print('zone_lookup_error='+str(e.get('code'))+':'+str(e.get('message'))[:300])
          PY
            exit 1
          fi

          list_code=$(curl -sS -o /tmp/cf-sending-domains.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/email/sending/subdomains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "sending_domain_list_http=$list_code"
          DOMAIN="$domain" python - <<'PY' > /tmp/sending-domain-state
          import json,os
          domain=os.environ['DOMAIN'].lower()
          d=json.load(open('/tmp/cf-sending-domains.json'))
          rows=d.get('result') or []
          match=next((x for x in rows if str(x.get('name') or '').lower()==domain),None)
          print('api_success=1' if d.get('success') else 'api_success=0')
          print('present=1' if match else 'present=0')
          print('enabled=1' if match and match.get('enabled') else 'enabled=0')
          for e in d.get('errors') or []:
              print('list_error='+str(e.get('code'))+':'+str(e.get('message'))[:300])
          PY
          cat /tmp/sending-domain-state
          present=$(grep '^present=' /tmp/sending-domain-state | cut -d= -f2)
          enabled=$(grep '^enabled=' /tmp/sending-domain-state | cut -d= -f2)
          if [ "$present" = "1" ] && [ "$enabled" = "1" ]; then
            echo 'I AM Magnanimous Way sending domain is already enabled.'
            exit 0
          fi

          printf '{"name":"%s"}' "$domain" > /tmp/create-sending-domain.json
          create_code=$(curl -sS -o /tmp/cf-sending-domain-create.json -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/zones/${zone_id}/email/sending/subdomains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/create-sending-domain.json)
          echo "sending_domain_create_http=$create_code"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/cf-sending-domain-create.json'))
          r=d.get('result') or {}
          print('sending_domain_create_success='+('1' if d.get('success') else '0'))
          print('sending_domain_enabled='+('1' if r.get('enabled') else '0'))
          for e in d.get('errors') or []:
              print('sending_domain_create_error='+str(e.get('code'))+':'+str(e.get('message'))[:300])
          if not d.get('success'):
              raise SystemExit(1)
          PY

      - name: Ensure owner mailbox is a Cloudflare destination
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute iam-magnanimous-db --remote --json --command \
            "SELECT u.email FROM users u JOIN tenants t ON t.owner_user_id=u.id WHERE t.slug='owner' AND u.role='owner' AND u.active=1 LIMIT 1;" \
            > /tmp/owner-row.json
          python - <<'PY' > /tmp/owner-email
          import json
          p=json.load(open('/tmp/owner-row.json'))
          vals=[]
          def walk(x):
              if isinstance(x,dict):
                  if isinstance(x.get('email'),str): vals.append(x['email'])
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(p)
          if vals: print(vals[-1].strip().lower(),end='')
          PY
          owner_email="$(cat /tmp/owner-email)"
          [ -n "$owner_email" ] || { echo '::error::Owner email could not be resolved from the owner tenant.'; exit 1; }
          echo "::add-mask::$owner_email"

          code=$(curl -sS -o /tmp/cf-addresses.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/email/routing/addresses?per_page=50" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "address_list_http=$code"

          OWNER_EMAIL="$owner_email" python - <<'PY' > /tmp/address-state
          import json,os
          owner=os.environ['OWNER_EMAIL'].strip().lower()
          data=json.load(open('/tmp/cf-addresses.json'))
          matches=[x for x in (data.get('result') or []) if str(x.get('email') or '').strip().lower()==owner]
          present=bool(matches)
          verified=bool(matches and matches[-1].get('verified'))
          print('present=1' if present else 'present=0')
          print('verified=1' if verified else 'verified=0')
          print('api_success=1' if data.get('success') else 'api_success=0')
          for e in data.get('errors') or []:
              print('address_list_error='+str(e.get('code'))+':'+str(e.get('message'))[:300])
          if not data.get('success'):
              raise SystemExit(1)
          PY
          cat /tmp/address-state
          present=$(grep '^present=' /tmp/address-state | cut -d= -f2)
          verified=$(grep '^verified=' /tmp/address-state | cut -d= -f2)

          if [ "$present" != "1" ]; then
            echo 'Owner destination is missing; creating a Cloudflare destination verification request.'
            OWNER_EMAIL="$owner_email" python - <<'PY' > /tmp/create-body.json
          import json,os
          print(json.dumps({'email':os.environ['OWNER_EMAIL']}))
          PY
            create_code=$(curl -sS -o /tmp/cf-address-create.json -w '%{http_code}' \
              -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/email/routing/addresses" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/create-body.json)
            echo "address_create_http=$create_code"
            python - <<'PY'
          import json,re
          d=json.load(open('/tmp/cf-address-create.json'))
          print('address_create_success='+('1' if d.get('success') else '0'))
          for e in d.get('errors') or []:
              msg=re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+','[redacted-email]',str(e.get('message') or ''))
              print('address_create_error='+str(e.get('code'))+':'+msg[:300])
          if not d.get('success'):
              raise SystemExit(1)
          PY
          elif [ "$verified" != "1" ]; then
            echo '::warning::Owner destination exists but is not verified. Cloudflare requires mailbox verification before free Worker delivery.'
          else
            echo 'Owner destination is verified in Cloudflare.'
          fi

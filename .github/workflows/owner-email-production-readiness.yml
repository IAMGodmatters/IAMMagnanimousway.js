name: Owner Email Production Readiness

on:
  workflow_run:
    workflows: ["Build and Deploy I AM"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-owner-email-readiness:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify non-secret owner email readiness
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --connect-timeout 10 --max-time 60 -o /tmp/owner-email-readiness.json -w '%{http_code}' \
            -X POST https://iammagnanimousway.com/api/admin/email-code/request \
            -H 'Content-Type: application/json' \
            --data '{}')"
          python - "$status" <<'PY'
          import json,sys
          status=sys.argv[1]
          data=json.load(open('/tmp/owner-email-readiness.json'))
          code=data.get('code')
          if status == '400' and code == 'OWNER_EMAIL_REQUIRED':
              print('Production owner email login transport is ready; no email was sent and no credential was exposed.')
              raise SystemExit(0)
          if status == '503' and code == 'OWNER_EMAIL_TRANSPORT_UNAVAILABLE' and data.get('password_fallback') is True:
              print('Production owner email transport is intentionally unavailable; verified password fallback remains available and no email was sent.')
              raise SystemExit(0)
          raise SystemExit('Owner authentication readiness failed without sending an email. HTTP '+status+' code='+str(code or 'none'))
          PY

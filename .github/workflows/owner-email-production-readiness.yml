name: Owner Email Production Readiness

on:
  workflow_run:
    workflows: ["Build and Deploy I AM"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-owner-email-readiness:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify non-secret owner email readiness
        shell: bash
        run: |
          set -euo pipefail
          health_status="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/owner-email-health.json -w '%{http_code}' https://iammagnanimousway.com/health)"
          [ "$health_status" = "200" ] || { echo "::error::Production health expected HTTP 200, got $health_status"; cat /tmp/owner-email-health.json || true; exit 1; }
          status="$(curl -sS --connect-timeout 10 --max-time 60 -o /tmp/owner-email-readiness.json -w '%{http_code}' \
            -X POST https://iammagnanimousway.com/api/admin/email-code/request \
            -H 'Content-Type: application/json' \
            --data '{}')"
          python - "$health_status" "$status" <<'PY'
          import json,sys
          health_status, status=sys.argv[1:3]
          health=json.load(open('/tmp/owner-email-health.json'))
          data=json.load(open('/tmp/owner-email-readiness.json'))
          ready=health.get('owner_email_login_transport_ready') is True
          code=data.get('code')
          if ready and status == '400' and code == 'OWNER_EMAIL_REQUIRED':
              print('Production owner email readiness is true and the request route agrees; no email was sent and no credential was exposed.')
              raise SystemExit(0)
          if not ready and status == '503' and code == 'OWNER_EMAIL_TRANSPORT_UNAVAILABLE' and data.get('password_fallback') is True:
              print('Production owner email readiness is false and the request route agrees; password fallback remains available and no email was sent.')
              raise SystemExit(0)
          raise SystemExit('Owner email readiness and request route disagree or failed. Health HTTP '+health_status+', request HTTP '+status+', ready='+str(ready)+', code='+str(code or 'none'))
          PY

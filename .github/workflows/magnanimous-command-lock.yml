name: Magnanimous Command Lock

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-command-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify Magnanimous command lock
        run: node scripts/verify-magnanimous-command-lock.mjs

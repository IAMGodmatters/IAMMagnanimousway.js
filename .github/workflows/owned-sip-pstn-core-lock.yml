name: Magnanimous Owned SIP PSTN Core Lock

on:
  push:
    paths:
      - 'telecom-core/**'
      - 'qa/scripts/magnanimous-owned-sip-pstn-lock.mjs'
      - '.github/workflows/owned-sip-pstn-core-lock.yml'
  pull_request:
    paths:
      - 'telecom-core/**'
      - 'qa/scripts/magnanimous-owned-sip-pstn-lock.mjs'
      - '.github/workflows/owned-sip-pstn-core-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owned-sip-pstn-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify owned SIP PSTN architecture contracts
        run: node qa/scripts/magnanimous-owned-sip-pstn-lock.mjs

      - name: Validate Telecom compose model
        env:
          MAGNANIMOUS_SIP_DOMAIN: sip.example.invalid
          SIP_DB_PASSWORD: ci-sip-db-password
          TELECOM_API_TOKEN: ci-telecom-token
          TELECOM_WEBHOOK_SECRET: ci-webhook-secret
          ASTERISK_ARI_USER: ci-ari
          ASTERISK_ARI_PASSWORD: ci-ari-password
          MAGNANIMOUS_AI_PASSWORD: ci-ai-password
          MAGNANIMOUS_ADMIN_PASSWORD: ci-admin-password
        run: docker compose -f telecom-core/docker-compose.yml config -q

      - name: Build owned SIP registrar image
        run: docker build -t magnanimous-sip-core:ci telecom-core/sip-core

      - name: Install Telecom control API dependencies
        run: python -m pip install -r telecom-core/control-api/requirements.txt

      - name: Compile Telecom control API
        run: python -m compileall -q telecom-core/control-api/app telecom-core/control-api/tests

      - name: Run Telecom service tests
        run: python -m unittest discover -s telecom-core/control-api/tests -p 'test_*.py'

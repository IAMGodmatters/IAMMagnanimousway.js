name: Magnanimous Cloud Exit Lock

on:
  pull_request:
    paths:
      - 'magnanimous-runtime/**'
      - 'worker/src/magnanimous-infrastructure-core.js'
      - 'worker/src/security-entrypoint.js'
      - 'worker/src/visual-runtime.js'
      - 'frontend/app/owner-infrastructure/**'
      - 'frontend/app/owner-center/page.tsx'
      - 'qa/scripts/magnanimous-cloud-exit-lock.mjs'
      - 'qa/scripts/magnanimous-cloud-independence-readiness.mjs'
      - '.github/workflows/magnanimous-cloud-exit-lock.yml'
      - '.github/workflows/magnanimous-standalone-release.yml'
      - 'worker/migrations/**'
  push:
    branches: [main]
    paths:
      - 'magnanimous-runtime/**'
      - 'worker/src/magnanimous-infrastructure-core.js'
      - 'worker/src/security-entrypoint.js'
      - 'worker/src/visual-runtime.js'
      - 'frontend/app/owner-infrastructure/**'
      - 'frontend/app/owner-center/page.tsx'
      - 'qa/scripts/magnanimous-cloud-exit-lock.mjs'
      - 'qa/scripts/magnanimous-cloud-independence-readiness.mjs'
      - '.github/workflows/magnanimous-cloud-exit-lock.yml'
      - '.github/workflows/magnanimous-standalone-release.yml'
      - 'worker/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepare isolated CI runtime configuration
        run: |
          cp magnanimous-runtime/.env.example magnanimous-runtime/.env
          cat >> magnanimous-runtime/.env <<'EOF'
          MAGNANIMOUS_INTERNAL_SERVICE_TOKEN=ci-magnanimous-internal-service-token-2026
          MAGNANIMOUS_SECRETS_KEY=ci-magnanimous-secrets-key-2026
          SESSION_SECRET=ci-magnanimous-session-secret-2026
          INTEGRATION_CREDENTIALS_KEY=ci-magnanimous-credential-key-2026
          MAGNANIMOUS_ACME_EMAIL=ci@example.invalid
          EOF
      - name: Validate standalone Docker topology
        run: docker compose -f magnanimous-runtime/docker-compose.yml config >/dev/null
      - name: Verify Magnanimous standalone infrastructure
        run: node qa/scripts/magnanimous-cloud-exit-lock.mjs
      - name: Build standalone runtime and isolated services
        run: docker compose -f magnanimous-runtime/docker-compose.yml build magnanimous sandbox browser browser-egress media
      - name: Smoke standalone runtime and isolated services
        run: |
          docker compose -f magnanimous-runtime/docker-compose.yml up -d sandbox browser-egress browser media magnanimous
          docker compose -f magnanimous-runtime/docker-compose.yml exec -T browser node - <<'NODE'
          const egress=await fetch('http://browser-egress:8794/health',{signal:AbortSignal.timeout(5000)});
          if(!egress.ok)throw new Error('Browser cannot reach the Magnanimous egress control path.');
          let escaped=false;
          try{
            const response=await fetch('https://example.com',{signal:AbortSignal.timeout(5000)});
            escaped=response.ok;
          }catch{}
          if(escaped)throw new Error('Browser container unexpectedly has direct public egress.');
          console.log('Browser direct-public-egress isolation PASS');
          NODE
          docker compose -f magnanimous-runtime/docker-compose.yml exec -T magnanimous node - <<'NODE'
          const token=process.env.MAGNANIMOUS_INTERNAL_SERVICE_TOKEN;
          const sleep=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));
          const readiness=[
            ['http://127.0.0.1:8788/__magnanimous_runtime/health',{}],
            ['http://sandbox:8791/health',{}],
            ['http://browser:8792/health',{headers:{'x-magnanimous-service-token':token}}],
            ['http://media:8793/health',{}]
          ];
          for(let attempt=0;attempt<30;attempt++){
            let ready=true;
            for(const [url,init] of readiness){
              try{const r=await fetch(url,init);if(!r.ok){ready=false;break}}catch{ready=false;break}
            }
            if(ready)break;
            if(attempt===29)throw new Error('Standalone Magnanimous services did not become ready.');
            await sleep(1000);
          }
          const checked=async(url,init={})=>{
            const r=await fetch(url,init);
            const text=await r.text();
            if(!r.ok)throw new Error(url+' -> '+r.status+' '+text.slice(0,500));
            return text;
          };
          await checked('http://127.0.0.1:8788/__magnanimous_runtime/health');
          await checked('http://127.0.0.1:8788/__magnanimous_runtime/services',{headers:{'x-magnanimous-service-token':token}});
          await checked('http://sandbox:8791/exec',{
            method:'POST',
            headers:{'content-type':'application/json','x-magnanimous-service-token':token},
            body:JSON.stringify({argv:['node','-e',"console.log('magnanimous-sandbox-ok')"]})
          });
          const browser=JSON.parse(await checked('http://browser:8792/render',{
            method:'POST',
            headers:{'content-type':'application/json','x-magnanimous-service-token':token},
            body:JSON.stringify({url:'https://example.com',mode:'dom',timeout_ms:45000})
          }));
          if(!String(browser.html||'').toLowerCase().includes('example domain')){
            console.error('Unexpected browser DOM:',String(browser.html||'').slice(0,1200));
            throw new Error('Magnanimous browser renderer returned unexpected DOM.');
          }
          const screenshot=JSON.parse(await checked('http://browser:8792/render',{
            method:'POST',
            headers:{'content-type':'application/json','x-magnanimous-service-token':token},
            body:JSON.stringify({url:'https://example.com',mode:'screenshot',timeout_ms:45000})
          }));
          if(!screenshot.base64||Number(screenshot.bytes||0)<1||screenshot.content_type!=='image/png'){
            throw new Error('Magnanimous Chromium snapshot render produced no PNG output.');
          }
          let privateBlocked=false;
          try{
            await checked('http://browser:8792/render',{
              method:'POST',
              headers:{'content-type':'application/json','x-magnanimous-service-token':token},
              body:JSON.stringify({url:'http://127.0.0.1:8788/__magnanimous_runtime/health',mode:'dom',timeout_ms:10000})
            });
          }catch(error){privateBlocked=String(error.message||error).includes('400')}
          if(!privateBlocked)throw new Error('Magnanimous browser private-network target was not blocked.');
          const png='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGP4z8DwHwAFAAH/iZk9HQAAAABJRU5ErkJggg==';
          const media=JSON.parse(await checked('http://media:8793/transform',{
            method:'POST',
            headers:{'content-type':'application/json','x-magnanimous-service-token':token},
            body:JSON.stringify({base64:png,format:'png',width:2,height:2})
          }));
          if(!media.base64||media.bytes<1)throw new Error('Magnanimous media transform produced no output.');
          console.log('Standalone Magnanimous runtime + sandbox + browser + media smoke PASS');
          NODE
      - name: Stop isolated CI services
        if: always()
        run: docker compose -f magnanimous-runtime/docker-compose.yml down -v --remove-orphans

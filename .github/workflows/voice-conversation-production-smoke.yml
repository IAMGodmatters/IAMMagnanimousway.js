name: Voice Conversation Production Smoke

on:
  workflow_run:
    workflows: ["Build and Deploy I AM"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  production-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      QA_BASE_URL: https://iammagnanimousway.com
    steps:
      - name: Confirm triggering deployment reached production
        id: deployment
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request

          repo = os.environ['REPOSITORY']
          run_id = os.environ['TRIGGER_RUN_ID']
          token = os.environ['GH_TOKEN']
          trigger_conclusion = os.environ.get('TRIGGER_CONCLUSION', '')
          trigger_sha = os.environ.get('TRIGGER_HEAD_SHA', '').strip()

          if trigger_conclusion != 'success':
              raise SystemExit(
                  f'Triggering deployment workflow did not succeed: conclusion={trigger_conclusion!r}'
              )
          if len(trigger_sha) != 40:
              raise SystemExit(f'Triggering deployment SHA is invalid: {trigger_sha!r}')

          url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'magnanimous-voice-production-smoke',
          }

          deploy_job_conclusion = None
          deploy_step_conclusion = None
          for attempt in range(1, 13):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)

              deploy_jobs = [job for job in payload.get('jobs', []) if job.get('name') == 'deploy']
              if deploy_jobs:
                  deploy_job = deploy_jobs[0]
                  deploy_job_conclusion = deploy_job.get('conclusion')

                  if deploy_job_conclusion == 'skipped':
                      deploy_step_conclusion = 'skipped'
                      break

                  steps = {step.get('name'): step for step in deploy_job.get('steps', [])}
                  deployed_step = steps.get('Deploy Worker') or {}
                  deploy_step_conclusion = deployed_step.get('conclusion')
                  if deploy_step_conclusion in {'success', 'skipped', 'failure', 'cancelled'}:
                      break

              print(
                  f'Deployment metadata is not finalized yet '
                  f'(attempt {attempt}/12, job={deploy_job_conclusion!r}, '
                  f'deploy_step={deploy_step_conclusion!r}); retrying.'
              )
              time.sleep(5)

          if deploy_step_conclusion == 'success':
              deployed = 'true'
              print(
                  f'Production deploy step succeeded in workflow run {run_id}. '
                  'Continuing with live voice verification.'
              )
          elif deploy_step_conclusion == 'skipped':
              deployed = 'false'
              print(
                  f'Production deploy job/step was skipped in workflow run {run_id}; '
                  'this release did not change the production runtime, so live voice smoke is not required.'
              )
          else:
              raise SystemExit(
                  f'Production deployment did not reach a valid terminal state; '
                  f'job={deploy_job_conclusion!r}, deploy_step={deploy_step_conclusion!r}'
              )

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'deployed={deployed}\n')
              fh.write(f'deployed_sha={trigger_sha}\n')
          PY

      - name: Checkout deployed revision
        if: github.event_name == 'workflow_dispatch' || steps.deployment.outputs.deployed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && steps.deployment.outputs.deployed_sha || 'main' }}

      - name: Setup Node
        if: github.event_name == 'workflow_dispatch' || steps.deployment.outputs.deployed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa/package.json

      - name: Install QA dependencies
        if: github.event_name == 'workflow_dispatch' || steps.deployment.outputs.deployed == 'true'
        working-directory: qa
        run: npm install --no-audit --no-fund

      - name: Install Chromium and WebKit
        if: github.event_name == 'workflow_dispatch' || steps.deployment.outputs.deployed == 'true'
        working-directory: qa
        run: npx playwright install --with-deps chromium webkit

      - name: Verify deployed spoken voice conversation
        if: github.event_name == 'workflow_dispatch' || steps.deployment.outputs.deployed == 'true'
        working-directory: qa
        run: npx playwright test --config=playwright.voice.config.ts

      - name: Upload voice QA evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: voice-conversation-production-smoke-${{ github.run_number }}
          path: |
            qa/voice-playwright-report/
            qa/voice-test-results/
          if-no-files-found: ignore
          retention-days: 14

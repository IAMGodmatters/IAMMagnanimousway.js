name: Voice Conversation Production Smoke

on:
  workflow_run:
    workflows: ["Build and Deploy I AM"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  production-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      QA_BASE_URL: https://iammagnanimousway.com
    steps:
      - name: Confirm triggering deployment reached production
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          repo = os.environ['REPOSITORY']
          run_id = os.environ['TRIGGER_RUN_ID']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100'
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'magnanimous-voice-production-smoke',
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)

          deploy_jobs = [job for job in payload.get('jobs', []) if job.get('name') == 'deploy']
          assert deploy_jobs, f'No deploy job found for workflow run {run_id}'
          steps = {step.get('name'): step for step in deploy_jobs[0].get('steps', [])}
          deployed = steps.get('Deploy Worker') or {}
          assert deployed.get('conclusion') == 'success', (
              f"Production deployment did not complete successfully; Deploy Worker conclusion={deployed.get('conclusion')!r}"
          )
          print(f'Production deploy step succeeded in workflow run {run_id}. Continuing with live voice verification.')
          PY

      - name: Checkout deployed main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa/package.json

      - name: Install QA dependencies
        working-directory: qa
        run: npm install --no-audit --no-fund

      - name: Install Chromium and WebKit
        working-directory: qa
        run: npx playwright install --with-deps chromium webkit

      - name: Verify deployed spoken voice conversation
        working-directory: qa
        run: npx playwright test --config=playwright.voice.config.ts

      - name: Upload voice QA evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: voice-conversation-production-smoke-${{ github.run_number }}
          path: |
            qa/voice-playwright-report/
            qa/voice-test-results/
          if-no-files-found: ignore
          retention-days: 14

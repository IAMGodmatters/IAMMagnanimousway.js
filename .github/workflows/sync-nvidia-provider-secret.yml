name: Sync NVIDIA Provider Secret

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Sync NVIDIA API key when configured
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        shell: bash
        run: |
          set -eo pipefail
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "NVIDIA_API_KEY is not configured in GitHub secrets; leaving the existing Cloudflare secret unchanged."
            exit 0
          fi
          printf '%s' "$NVIDIA_API_KEY" | npx wrangler secret put NVIDIA_API_KEY >/dev/null
          echo "Synced protected Worker secret: NVIDIA_API_KEY"

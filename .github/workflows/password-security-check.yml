name: Password Security Verification

on:
  push:
    branches: ['**']
    paths:
      - 'worker/src/password-security.js'
      - 'worker/src/password-recovery.js'
      - 'worker/src/security-hardening.js'
      - 'worker/src/admin-compat-entrypoint.js'
      - 'worker/migrations/0069_password_recovery.sql'
      - 'frontend/app/template.tsx'
      - 'frontend/app/password-recovery-overlay.tsx'
      - 'frontend/app/forgot-password/page.tsx'
      - 'frontend/app/forgot-password/page.tsx'
      - 'worker/wrangler.jsonc'
      - 'worker/package.json'
      - 'worker/package-lock.json'
      - 'qa/scripts/password-security-lock.mjs'
      - 'qa/scripts/password-recovery-lock.mjs'
      - 'qa/fixtures/password-kdf-worker.js'
      - 'qa/fixtures/password-kdf-wrangler.jsonc'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/password-security-check.yml'
  pull_request:
    paths:
      - 'worker/src/password-security.js'
      - 'worker/src/password-recovery.js'
      - 'worker/src/security-hardening.js'
      - 'worker/src/admin-compat-entrypoint.js'
      - 'worker/migrations/0069_password_recovery.sql'
      - 'frontend/app/template.tsx'
      - 'frontend/app/password-recovery-overlay.tsx'
      - 'worker/wrangler.jsonc'
      - 'worker/package.json'
      - 'worker/package-lock.json'
      - 'qa/scripts/password-security-lock.mjs'
      - 'qa/scripts/password-recovery-lock.mjs'
      - 'qa/fixtures/password-kdf-worker.js'
      - 'qa/fixtures/password-kdf-wrangler.jsonc'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/password-security-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Check password modules syntax
        run: |
          node --check worker/src/password-security.js
          node --check worker/src/password-recovery.js
          node --check worker/src/security-hardening.js
      - name: Verify password recovery contract
        run: node qa/scripts/password-recovery-lock.mjs
      - name: Exercise scrypt and legacy verification in Node
        run: node qa/scripts/password-security-lock.mjs
      - name: Install Worker runtime dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund
      - name: Exercise scrypt in the Cloudflare workerd runtime
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --config ../qa/fixtures/password-kdf-wrangler.jsonc --port 8799 --ip 127.0.0.1 > /tmp/password-kdf-workerd.log 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          status=''
          for _ in $(seq 1 30); do
            status=$(curl -sS -o /tmp/password-kdf-workerd.json -w '%{http_code}' http://127.0.0.1:8799/ || true)
            if [ "$status" = '200' ]; then break; fi
            if [ "$status" = '500' ]; then
              cat /tmp/password-kdf-workerd.json || true
              cat /tmp/password-kdf-workerd.log || true
              exit 1
            fi
            sleep 1
          done
          if [ "$status" != '200' ]; then
            echo "workerd KDF smoke did not become healthy; last HTTP status: $status"
            cat /tmp/password-kdf-workerd.json || true
            cat /tmp/password-kdf-workerd.log || true
            exit 1
          fi
          python - <<'PY'
          import json
          data=json.load(open('/tmp/password-kdf-workerd.json'))
          assert data.get('ok') is True, data
          assert data.get('algorithm') == 'scrypt-v1', data
          assert data.get('n') == 32768, data
          assert data.get('r') == 8, data
          assert data.get('p') == 2, data
          print('Cloudflare workerd scrypt password KDF smoke passed.')
          PY
      - name: Verify Worker Node crypto compatibility date
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('worker/wrangler.jsonc', 'utf8');
          const match = text.match(/"compatibility_date"\s*:\s*"(\d{4}-\d{2}-\d{2})"/);
          if (!match) throw new Error('Worker compatibility_date is missing.');
          if (match[1] < '2026-08-04') throw new Error(`Worker compatibility_date ${match[1]} predates default node:crypto support.`);
          console.log(`Worker compatibility date ${match[1]} supports native node:crypto.`);
          NODE

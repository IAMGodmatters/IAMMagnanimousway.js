name: Password Security Verification

on:
  push:
    branches: ['**']
    paths:
      - 'worker/src/password-security.js'
      - 'worker/src/admin-compat-entrypoint.js'
      - 'worker/wrangler.jsonc'
      - 'qa/scripts/password-security-lock.mjs'
      - '.github/workflows/password-security-check.yml'
  pull_request:
    paths:
      - 'worker/src/password-security.js'
      - 'worker/src/admin-compat-entrypoint.js'
      - 'worker/wrangler.jsonc'
      - 'qa/scripts/password-security-lock.mjs'
      - '.github/workflows/password-security-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check password security module syntax
        run: node --check worker/src/password-security.js
      - name: Exercise PBKDF2 and legacy verification
        run: node qa/scripts/password-security-lock.mjs
      - name: Verify Worker Node crypto compatibility date
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('worker/wrangler.jsonc', 'utf8');
          const match = text.match(/"compatibility_date"\s*:\s*"(\d{4}-\d{2}-\d{2})"/);
          if (!match) throw new Error('Worker compatibility_date is missing.');
          if (match[1] < '2026-08-04') throw new Error(`Worker compatibility_date ${match[1]} predates default node:crypto support.`);
          console.log(`Worker compatibility date ${match[1]} supports native node:crypto.`);
          NODE

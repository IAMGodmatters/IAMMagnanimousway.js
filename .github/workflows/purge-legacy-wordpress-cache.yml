name: Purge Legacy WordPress Cache

on:
  push:
    branches: [main]
    paths:
      - 'worker/src/security-entrypoint.js'
      - 'worker/wrangler.jsonc'
      - 'frontend/public/sitemap.xml'
      - '.github/workflows/purge-legacy-wordpress-cache.yml'
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge canonical and legacy WordPress URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"

          curl -fsS -G 'https://api.cloudflare.com/client/v4/zones' \
            --data-urlencode 'name=iammagnanimousway.com' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' > /tmp/zone.json

          zone_id=$(python - <<'PY'
          import json
          data=json.load(open('/tmp/zone.json'))
          assert data.get('success') is True, data
          result=data.get('result') or []
          assert result and result[0].get('id'), data
          print(result[0]['id'])
          PY
          )

          python - <<'PY' > /tmp/purge.json
          import json
          base='iammagnanimousway.com'
          files=[
            f'https://{base}/',f'http://{base}/',
            f'https://www.{base}/',f'http://www.{base}/',
            f'https://{base}/wp-admin/',f'https://{base}/wp-login.php',
            f'https://{base}/wp-json/',f'https://{base}/xmlrpc.php',
            f'https://www.{base}/wp-admin/',f'https://www.{base}/wp-login.php',
            f'https://www.{base}/wp-json/',f'https://www.{base}/xmlrpc.php'
          ]
          print(json.dumps({'files':files}))
          PY

          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/purge.json > /tmp/purge-result.json

          python - <<'PY'
          import json
          data=json.load(open('/tmp/purge-result.json'))
          assert data.get('success') is True, data
          print('Legacy WordPress/root cache purge: PASS')
          PY

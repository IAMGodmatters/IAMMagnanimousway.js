name: Free-first runtime plane export v6

on:
  push:
    branches: [fix/free-first-runtime-plane-20261007]
    paths:
      - .github/workflows/free-first-runtime-plane-export-v6.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json

      - name: Apply the verified migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source_path=Path('.github/workflows/free-first-runtime-plane-bootstrap.yml')
          workflow=source_path.read_text()
          marker="          python - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY",start)
          code=textwrap.dedent(workflow[start:end])

          old_call="s=replace_once(s,old,new,'D1 free-first authority lock')"
          repaired="""target=\"\"\"add('Cloudflare production config points API traffic at the Magnanimous standalone origin',wrangler.includes('\\\"MAGNANIMOUS_STANDALONE_API_ORIGIN\\\": \\\"https://magnanimous-production.up.railway.app\\\"'));\"\"\"\nif target not in s: raise SystemExit('missing expected source for D1 free-first authority lock')\ns=s.replace(target,new,1)"""
          if old_call not in code:
              raise SystemExit('D1 repair target missing from bootstrap source')
          code=code.replace(old_call,repaired,1)

          bad="reels.includes(\"x-magnanimous-surface','reels\"))],"
          good="reels.includes(\"x-magnanimous-surface','reels\")],"
          if bad not in code:
              raise SystemExit('QA syntax repair target missing from bootstrap source')
          code=code.replace(bad,good,1)

          exec(compile(code,'free-first-runtime-plane-migration','exec'),{})
          PY

      - name: Normalize generated QA lock formatting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('qa/scripts/free-first-runtime-plane-lock.mjs')
          text=p.read_text()
          p.write_text('\n'.join(line.rstrip() for line in text.splitlines()) + '\n')
          PY

      - name: Verify free-first runtime contracts
        run: |
          set -euo pipefail
          node qa/scripts/free-first-runtime-plane-lock.mjs
          node qa/scripts/d1-quota-resilience-lock.mjs
          node qa/scripts/magnanimous-native-first-lock.mjs
          node qa/scripts/railway-descendant-safe-deploy-lock.mjs
          node qa/scripts/product-contract-locks.mjs

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Verify Worker bundle
        working-directory: worker
        run: |
          npm ci --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/magnanimous-worker-free-first

      - name: Package the exact verified patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/free-first-patch/.github/workflows
          cp frontend/app/reels/page.tsx /tmp/free-first-patch/frontend-app-reels-page.tsx
          cp qa/scripts/d1-quota-resilience-lock.mjs /tmp/free-first-patch/d1-quota-resilience-lock.mjs
          cp qa/scripts/magnanimous-native-first-lock.mjs /tmp/free-first-patch/magnanimous-native-first-lock.mjs
          cp qa/scripts/product-contract-locks.mjs /tmp/free-first-patch/product-contract-locks.mjs
          cp qa/scripts/free-first-runtime-plane-lock.mjs /tmp/free-first-patch/free-first-runtime-plane-lock.mjs
          cp worker/src/free-first-runtime-plane.js /tmp/free-first-patch/free-first-runtime-plane.js
          cp worker/src/index.js /tmp/free-first-patch/worker-index.js
          cp worker/src/magnanimous-single-brain-contract.js /tmp/free-first-patch/magnanimous-single-brain-contract.js
          cp .github/workflows/deploy.yml /tmp/free-first-patch/.github/workflows/deploy.yml
          cp .github/workflows/magnanimous-railway-deploy.yml /tmp/free-first-patch/.github/workflows/magnanimous-railway-deploy.yml
          git diff --name-only > /tmp/free-first-patch/MANIFEST.txt
          git diff --check
          cat /tmp/free-first-patch/MANIFEST.txt

      - name: Upload exact verified patch
        uses: actions/upload-artifact@v4
        with:
          name: free-first-runtime-plane-verified-patch
          path: /tmp/free-first-patch
          if-no-files-found: error
          retention-days: 7

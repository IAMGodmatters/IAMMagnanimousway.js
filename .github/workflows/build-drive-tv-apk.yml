name: Build Magnanimous Drive TV APK
on:
  push:
    branches:
      - drive-tv-android-build-20261023
    paths:
      - 'tv-app/**'
      - '.github/workflows/build-drive-tv-apk.yml'
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build owner APK
        working-directory: tv-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Re-sign compatibility APK with legacy v1 and modern v2
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APK=tv-app/app/build/outputs/apk/debug/app-debug.apk
          FINAL=tv-app/app/build/outputs/apk/debug/app-compatible.apk
          # Ephemeral personal-test signing key; this APK is not a production release.
          TESTKEY="$RUNNER_TEMP/magnanimous-tv-test.jks"
          keytool -genkeypair -noprompt -keystore "$TESTKEY" \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Magnanimous Drive TV Debug,O=Magnanimous,C=US"
          test -s "$TESTKEY"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$TESTKEY" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --out "$FINAL" "$APK"
          mv "$FINAL" "$APK"
      - name: Verify signed TV launchable APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APK=tv-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/magnanimous-apk-info.txt
          grep -q "package: name='com.magnanimous.drivetv'" /tmp/magnanimous-apk-info.txt
          grep -q "leanback-launchable-activity:" /tmp/magnanimous-apk-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/magnanimous-apk-signature.txt
          # Verification at minSdk 26 may report v1=false because modern Android skips legacy JAR verification.
          # Verify the legacy signature as if installed on API 23, and require v1 signed JAR entries.
          jar tf "$APK" | grep -Eq '^META-INF/[^/]+\\.RSA
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/magnanimous-apk-signature.txt
          grep -q "sdkVersion:'26'" /tmp/magnanimous-apk-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MagnanimousDriveTV-owner-APK
          path: tv-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --min-sdk-version 23 --verbose "$APK" | tee /tmp/magnanimous-legacy-signature.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/magnanimous-legacy-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/magnanimous-apk-signature.txt
          grep -q "sdkVersion:'26'" /tmp/magnanimous-apk-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MagnanimousDriveTV-owner-APK
          path: tv-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build Magnanimous Drive TV APK
on:
  push:
    branches:
      - drive-tv-android-build-20261023
    paths:
      - 'tv-app/**'
      - '.github/workflows/build-drive-tv-apk.yml'
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build owner APK
        working-directory: tv-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify signed TV launchable APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APK=tv-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/magnanimous-apk-info.txt
          grep -q "package: name='com.magnanimous.drivetv'" /tmp/magnanimous-apk-info.txt
          grep -q "leanback-launchable-activity:" /tmp/magnanimous-apk-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/magnanimous-apk-signature.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/magnanimous-apk-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/magnanimous-apk-signature.txt
          grep -q "sdkVersion:'26'" /tmp/magnanimous-apk-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MagnanimousDriveTV-owner-APK
          path: tv-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

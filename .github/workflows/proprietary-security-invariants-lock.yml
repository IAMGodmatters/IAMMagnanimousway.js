name: Proprietary Security Invariants Lock

on:
  workflow_dispatch:
  schedule:
    - cron: '53 6 * * *'
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: proprietary-security-invariants-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enforce permanent proprietary security invariants
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node qa/scripts/proprietary-security-invariants-lock.mjs

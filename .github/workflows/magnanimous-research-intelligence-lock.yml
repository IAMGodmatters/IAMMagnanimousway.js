name: Magnanimous Research Intelligence Lock

on:
  push:
    branches: [main]
    paths:
      - 'worker/src/magnanimous-research-intelligence.js'
      - 'qa/scripts/magnanimous-research-intelligence-lock.mjs'
      - '.github/workflows/magnanimous-research-intelligence-lock.yml'
  pull_request:
    paths:
      - 'worker/src/magnanimous-research-intelligence.js'
      - 'qa/scripts/magnanimous-research-intelligence-lock.mjs'
      - '.github/workflows/magnanimous-research-intelligence-lock.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node qa/scripts/magnanimous-research-intelligence-lock.mjs

name: Add NVIDIA Frontier Mesh

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/add-nvidia-frontier-mesh.mjs'
      - 'scripts/add-magnanimous-agent-skills.mjs'
      - 'worker/src/magnanimous-agent-skills.js'
      - 'qa/scripts/magnanimous-agent-skills-lock.mjs'
      - '.github/workflows/add-nvidia-frontier-mesh.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/add-nvidia-frontier-mesh.mjs'
      - 'scripts/add-magnanimous-agent-skills.mjs'
      - 'worker/src/magnanimous-agent-skills.js'
      - 'qa/scripts/magnanimous-agent-skills-lock.mjs'
      - '.github/workflows/add-nvidia-frontier-mesh.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply additive NVIDIA routing and remembrance invariant
        shell: bash
        run: |
          set +e
          node scripts/add-nvidia-frontier-mesh.mjs
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo 'NVIDIA patcher reported anchor drift; verifying that the complete NVIDIA frontier mesh is already present.'
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const checks=[
            ['worker/src/provider-entrypoint.js',["id: 'nvidia-kimi'","id: 'nvidia-deepseek-pro'","id: 'nvidia-deepseek-flash'",'durable remembrance layer']],
            ['worker/src/provider-runtime-env.js',["'NVIDIA_API_KEY'"]],
            ['worker/src/platform-credentials.js',["key:'NVIDIA_API_KEY'",'nvidia-nim']],
            ['worker/src/magnanimous-brain-runtime.js',['durable source of remembrance']],
            ['.env.example',['NVIDIA_API_KEY=','NVIDIA_KIMI_MODEL=','NVIDIA_DEEPSEEK_PRO_MODEL=','NVIDIA_DEEPSEEK_FLASH_MODEL=']]
          ];
          const missing=[];
          for(const [file,needles] of checks){
            const text=fs.readFileSync(file,'utf8');
            for(const needle of needles)if(!text.includes(needle))missing.push(`${file}: ${needle}`);
          }
          if(missing.length){
            console.error('NVIDIA frontier mesh is incomplete after patcher failure:\n'+missing.join('\n'));
            process.exit(1);
          }
          console.log('NVIDIA frontier mesh already satisfies the required invariants; continuing safely.');
          NODE
          fi
      - name: Apply Magnanimous Agent Skills compatibility layer
        run: node scripts/add-magnanimous-agent-skills.mjs
      - name: Validate changed JavaScript
        run: |
          node --check worker/src/provider-entrypoint.js
          node --check worker/src/provider-runtime-env.js
          node --check worker/src/platform-credentials.js
          node --check worker/src/magnanimous-brain-runtime.js
          node --check worker/src/magnanimous-agent-skills.js
          node --check worker/src/magnanimous-capability-mesh.js
          node --check scripts/add-magnanimous-agent-skills.mjs
          node --check qa/scripts/magnanimous-agent-skills-lock.mjs
      - name: Run Agent Skills regression lock
        run: node qa/scripts/magnanimous-agent-skills-lock.mjs
      - name: Build frontend assets for Worker validation
        working-directory: frontend
        run: |
          npm install
          npm run typecheck
          npm run build
      - name: Validate Worker bundle
        working-directory: worker
        run: |
          npm install
          npx wrangler deploy --dry-run
      - name: Commit validated source changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/src/provider-entrypoint.js worker/src/provider-runtime-env.js worker/src/platform-credentials.js worker/src/magnanimous-brain-runtime.js worker/src/magnanimous-capability-mesh.js .env.example
          git commit -m 'Apply frontier mesh and Agent Skills integration'
          git push

name: Wire native browser receipts once

on:
  push:
    branches:
      - feature/unfenced-capability-absorption-2026-10-05

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unfenced-capability-absorption-2026-10-05
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wire receipt ledger into Local Bridge browser results
        shell: python
        run: |
          from pathlib import Path

          path=Path('worker/src/magnanimous-local-bridge-runtime.js')
          s=path.read_text()

          def once(old,new,label):
              global s
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'missing patch anchor: {label}')
              s=s.replace(old,new,1)

          once(
            "import { requirePlatformOwner } from './platform-owner-guard.js';",
            "import { requirePlatformOwner } from './platform-owner-guard.js';\nimport { createBrowserTaskReceipt, getBrowserTaskReceipt, verifyBrowserReceiptChain } from './magnanimous-browser-receipts.js';",
            'receipt import'
          )

          old="""   const status=ok?'completed':'failed',result=body.result??{},error=clip(body.error,5000);\n   await env.DB.prepare(\"UPDATE magnanimous_local_bridge_tasks SET status=?,result_json=?,error_text=?,completed_at=? WHERE id=?\").bind(status,JSON.stringify(result).slice(0,500000),error,ts,taskId).run();\n   if(String(task.action||'').startsWith('browser_'))await deliverNativeWebWebhook(task,status,result,error);\n   return json({ok:true,task_id:taskId,status});"""
          new="""   const status=ok?'completed':'failed',result=body.result??{},error=clip(body.error,5000),isBrowser=String(task.action||'').startsWith('browser_');\n   await env.DB.prepare(\"UPDATE magnanimous_local_bridge_tasks SET status=?,result_json=?,error_text=?,completed_at=? WHERE id=?\").bind(status,JSON.stringify(result).slice(0,500000),error,ts,taskId).run();\n   let receipt=null,receiptError='';\n   if(isBrowser){\n    try{receipt=await createBrowserTaskReceipt(env,task,{status,result,error,completed_at:ts})}catch(receiptFailure){receiptError=clip(receiptFailure?.message||receiptFailure,1000)}\n   }\n   let deliveredResult=result;\n   if(receipt&&result&&typeof result==='object'&&!Array.isArray(result)){\n    deliveredResult={...result,magnanimous_receipt:receipt};\n    await env.DB.prepare('UPDATE magnanimous_local_bridge_tasks SET result_json=? WHERE id=?').bind(JSON.stringify(deliveredResult).slice(0,500000),taskId).run();\n   }\n   if(isBrowser)await deliverNativeWebWebhook(task,status,deliveredResult,error);\n   return json({ok:true,task_id:taskId,status,receipt,receipt_error:receiptError||undefined});"""
          once(old,new,'browser result receipt')

          anchor=""" const taskMatch=path.match(/^\\/api\\/magnanimous\\/local-bridge\\/tasks\\/([^/]+)$/);"""
          routes=""" const receiptMatch=path.match(/^\\/api\\/magnanimous\\/local-bridge\\/tasks\\/([^/]+)\\/receipt$/);\n if(request.method==='GET'&&receiptMatch){\n  const tenantId=String(user.tenant_id),taskId=clip(receiptMatch[1],120);\n  const receipt=await getBrowserTaskReceipt(env,tenantId,taskId);\n  if(!receipt)return json({detail:'Browser receipt not found.'},404);\n  return json({ok:true,receipt});\n }\n if(request.method==='GET'&&path==='/api/magnanimous/local-bridge/browser-receipts/verify'){\n  const limit=Math.max(1,Math.min(Number(url.searchParams.get('limit')||200),1000));\n  const device_id=clip(url.searchParams.get('device_id'),160);\n  return json(await verifyBrowserReceiptChain(env,String(user.tenant_id),{device_id,limit}));\n }\n const taskMatch=path.match(/^\\/api\\/magnanimous\\/local-bridge\\/tasks\\/([^/]+)$/);"""
          once(anchor,routes,'receipt routes')
          path.write_text(s)

          qa=Path('qa/scripts/magnanimous-unfenced-capability-lock.mjs')
          q=qa.read_text()
          if "node:fs" not in q:
              q="import fs from 'node:fs';\n"+q
          marker="const summary=getUnfencedAbsorptionSummary();"
          additions="""const summary=getUnfencedAbsorptionSummary();\nconst bridgeSource=fs.readFileSync(new URL('../../worker/src/magnanimous-local-bridge-runtime.js',import.meta.url),'utf8');\nconst receiptSource=fs.readFileSync(new URL('../../worker/src/magnanimous-browser-receipts.js',import.meta.url),'utf8');"""
          if additions not in q:
              if marker not in q: raise SystemExit('missing QA summary anchor')
              q=q.replace(marker,additions,1)
          qa_anchor="assert.equal(summary.public_docs_private_preview,true);"
          qa_add="""assert.equal(summary.public_docs_private_preview,true);\nassert.match(bridgeSource,/createBrowserTaskReceipt/,'browser completion path must emit a tamper-evident receipt');\nassert.match(bridgeSource,/browser-receipts\\/verify/,'owner must have a receipt-chain verification route');\nassert.match(receiptSource,/previous_chain_hash/,'receipt ledger must preserve hash-chain linkage');\nassert.match(receiptSource,/HMAC-SHA-256/,'receipt ledger must support keyed signatures without hard-coding a key');\nassert.match(receiptSource,/MAGNANIMOUS_RECEIPT_SIGNING_KEY/,'receipt signing must use a separately configured secret binding');"""
          if qa_add not in q:
              if qa_anchor not in q: raise SystemExit('missing QA receipt anchor')
              q=q.replace(qa_anchor,qa_add,1)
          qa.write_text(q)

          reg=Path('worker/src/magnanimous-unfenced-capability-registry.js')
          r=reg.read_text()
          r=r.replace(
            "'Hash-chained signed receipts are a benchmark contract until wired into the live browser action-result path and verified end to end.'",
            "'Tamper-evident per-device hash-chained browser receipts are wired. HMAC signing becomes active only when MAGNANIMOUS_RECEIPT_SIGNING_KEY is configured as a secret binding.'"
          )
          reg.write_text(r)

          doc=Path('docs/UNFENCED-CAPABILITY-ABSORPTION-2026-10-05.md')
          d=doc.read_text()
          d=d.replace(
            "The public receipt pattern is absorbed as a target contract. Magnanimous already owns evidence and audit surfaces, but a cryptographically linked receipt must not be called live until it is wired into actual browser action results and independently verified end to end.",
            "Magnanimous now writes a tamper-evident per-device hash-chained receipt for completed or failed Native Web browser tasks. The receipt stores hashes rather than duplicating fetched page content, can be retrieved by task, and has an owner-only verification route. Optional HMAC-SHA-256 signing activates only when `MAGNANIMOUS_RECEIPT_SIGNING_KEY` is configured as a secret binding; without that key the chain remains hash-linked but is truthfully reported as unsigned."
          )
          doc.write_text(d)

          wf=Path('.github/workflows/_wire-browser-receipts-once.yml')
          if wf.exists(): wf.unlink()
      - name: Run focused locks
        run: |
          node qa/scripts/magnanimous-unfenced-capability-lock.mjs
          node qa/scripts/magnanimous-native-web-lock.mjs
          node qa/scripts/magnanimous-gemini-capability-lock.mjs
      - name: Commit receipt wiring
        run: |
          git config user.name "magnanimous-capability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker/src/magnanimous-local-bridge-runtime.js worker/src/magnanimous-browser-receipts.js worker/src/magnanimous-unfenced-capability-registry.js qa/scripts/magnanimous-unfenced-capability-lock.mjs docs/UNFENCED-CAPABILITY-ABSORPTION-2026-10-05.md .github/workflows/_wire-browser-receipts-once.yml
          if git diff --cached --quiet; then
            echo "No receipt wiring changes required"
            exit 0
          fi
          git commit -m "Add tamper-evident native browser receipts"
          git push origin HEAD:feature/unfenced-capability-absorption-2026-10-05

name: Lock Public Surface

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lock-public-surface.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-public-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enforce Teach and Shop public-only surface
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f'Expected source not found while updating {label}')

          layout = Path('frontend/app/layout.tsx')
          text = layout.read_text()
          text = replace_once(
              text,
              "var publicPaths=['/solutions','/business-plan','/guide','/login','/signup','/owner-login','/privacy','/terms','/pricing','/reviews','/free-tools','/ai-apps','/advertise','/security','/shop','/magnanimous'];",
              "var publicPaths=['/teach','/shop','/login','/signup','/owner-login'];\n      function isPublicPath(path){return publicPaths.indexOf(path)!==-1||path.indexOf('/teach/')===0||path.indexOf('/shop/')===0;}",
              'layout public route allowlist',
          )
          text = replace_once(
              text,
              "if(publicPaths.indexOf(currentPath)!==-1||standalone)document.documentElement.setAttribute('data-iam-public','true');",
              "if(isPublicPath(currentPath))document.documentElement.setAttribute('data-iam-public','true');",
              'layout public document flag',
          )
          recovery = "        var recovery=document.querySelector('[data-iam-route-recovery=\"true\"]');\n        if(recovery){document.documentElement.setAttribute('data-iam-public','true');return;}\n"
          text = text.replace(recovery, '', 1)
          text = replace_once(
              text,
              "if(p==='/'){if(!customer&&!owner)location.replace('/solutions');return;}",
              "if(p==='/'){if(!customer&&!owner)location.replace('/login?returnTo=%2F');return;}",
              'root authentication redirect',
          )
          text = replace_once(
              text,
              "if(standalone||publicPaths.indexOf(p)!==-1)return;",
              "if(isPublicPath(p))return;",
              'protected-route guard',
          )
          text = replace_once(
              text,
              "if(publicPaths.indexOf(currentPath)!==-1||standalone)return;",
              "if(isPublicPath(currentPath)||standalone)return;",
              'customer UI public-route check',
          )
          layout.write_text(text)

          template = Path('frontend/app/template.tsx')
          template_text = template.read_text()
          template_text = replace_once(
              template_text,
              "const publicPaths=new Set(['/solutions','/business-plan','/guide','/login','/signup','/owner-login','/privacy','/terms','/pricing','/reviews','/free-tools','/ai-apps','/advertise','/security','/white-label']);",
              "const publicPaths=new Set(['/teach','/shop','/login','/signup','/owner-login']);",
              'template public route allowlist',
          )
          template_text = replace_once(
              template_text,
              " const isPublic=publicPaths.has(path);",
              " const isPublic=publicPaths.has(path)||path.startsWith('/teach/')||path.startsWith('/shop/');",
              'template public route matching',
          )
          template.write_text(template_text)

          audit = Path('frontend/scripts/interaction-audit.mjs')
          audit_text = audit.read_text()
          audit_text = replace_once(
              audit_text,
              "if(publicPathsMatch&&!/[\"']\\/magnanimous[\"']/.test(publicPathsMatch[1]))failures.push('app/layout.tsx: /magnanimous must remain publicly accessible');",
              "if(publicPathsMatch&&/[\"']\\/magnanimous[\"']/.test(publicPathsMatch[1]))failures.push('app/layout.tsx: /magnanimous must remain behind the customer sign-in boundary');",
              'Magnanimous interaction access contract',
          )
          audit_text = audit_text.replace(
              "Standalone Magnanimous AI contract passed: public route, metadata, guest boundary, chat runtime, isolated interface, and no-ad shell are intact.",
              "Standalone Magnanimous AI contract passed: protected route, metadata, guest boundary, chat runtime, isolated interface, and no-ad shell are intact.",
          )
          audit.write_text(audit_text)

          product = Path('qa/scripts/product-contract-locks.mjs')
          product_text = product.read_text()
          product_text = replace_once(
              product_text,
              "includes(layout, \"var publicPaths=['/solutions'\", 'platform: explicit public/protected route boundary remains present');",
              "includes(layout, \"var publicPaths=['/teach','/shop','/login','/signup','/owner-login'];\", 'platform: strict Teach + Shop public boundary remains present');",
              'product public boundary contract',
          )
          product_text = replace_once(
              product_text,
              "includes(layout, \"'/magnanimous'\", 'platform: standalone entry remains public without becoming the whole platform');",
              "notMatches(layout.match(/var publicPaths=\\[[^;]+;/)?.[0] || '', /['\"]\\/magnanimous['\"]/, 'platform: standalone Magnanimous entry remains protected behind sign-in');",
              'product Magnanimous access contract',
          )
          product.write_text(product_text)

          lock = Path('qa/scripts/public-surface-lock.mjs')
          lock.write_text("""import fs from 'node:fs';\nconst source=fs.readFileSync('frontend/app/layout.tsx','utf8');\nconst allowlist=source.match(/var publicPaths=\\[[^;]+;/)?.[0]||'';\nconst required=[\n  \"var publicPaths=['/teach','/shop','/login','/signup','/owner-login'];\",\n  \"function isPublicPath(path){return publicPaths.indexOf(path)!==-1||path.indexOf('/teach/')===0||path.indexOf('/shop/')===0;}\",\n  \"if(p==='/'){if(!customer&&!owner)location.replace('/login?returnTo=%2F');return;}\",\n  \"if(isPublicPath(p))return;\"\n];\nfor(const item of required){if(!source.includes(item))throw new Error('Public surface lock missing: '+item)}\nfor(const forbidden of ['/solutions','/business-plan','/guide','/privacy','/terms','/pricing','/reviews','/free-tools','/ai-apps','/advertise','/security','/white-label','/magnanimous','/bible-study']){\n  if(allowlist.includes(\"'\"+forbidden+\"'\"))throw new Error('Protected route leaked into public allowlist: '+forbidden);\n}\nif(source.includes('if(standalone||publicPaths.indexOf(p)!==-1)return;'))throw new Error('Standalone Magnanimous bypass must stay protected');\nif(source.includes('data-iam-route-recovery=\\\"true\\\"]'))throw new Error('Generic recovery bypass must not bypass authentication');\nconsole.log('Public surface lock: PASS — Teach + Shop are public; auth pages remain reachable; all other routes require sign-in.');\n""")

          pkg_path = Path('frontend/package.json')
          pkg = json.loads(pkg_path.read_text())
          cmd = pkg['scripts']['platform-contract-audit']
          additions = [
              'node ../qa/scripts/product-contract-locks.mjs',
              'node ../qa/scripts/public-surface-lock.mjs',
          ]
          for addition in additions:
              if addition not in cmd:
                  cmd += ' && ' + addition
          pkg['scripts']['platform-contract-audit'] = cmd
          pkg_path.write_text(json.dumps(pkg, separators=(',', ':')))
          PY
      - name: Validate strict public gate
        run: |
          cd frontend
          npm install
          npm run typecheck
          npm run build
      - name: Commit validated gate
        run: |
          if git diff --quiet; then
            echo 'Public surface already locked.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/app/layout.tsx frontend/app/template.tsx frontend/scripts/interaction-audit.mjs frontend/package.json qa/scripts/product-contract-locks.mjs qa/scripts/public-surface-lock.mjs
          git commit -m 'Lock public access to Teach and Shop'
          git push

name: Python Dependency Security Repair Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'telecom-core/control-api/requirements.txt'
      - 'video-renderer/requirements.txt'
      - '.github/workflows/python-dependency-security-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: telecom-core/control-api
            python: '3.13'
          - service: video-renderer
            python: '3.12'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned service dependencies
        run: python -m pip install --no-cache-dir -r ${{ matrix.service }}/requirements.txt
      - name: Assert dependency compatibility
        run: |
          python -m pip check
          python - <<'PY'
          import importlib.metadata as m
          for name, floor in (('starlette','1.3.1'),('anyio','4.14.2'),('idna','3.15'),('certifi','2026.10.19'),('h11','0.16.0')):
              assert m.version(name) == floor, (name,m.version(name),floor)
          from fastapi import FastAPI
          app = FastAPI()
          assert app is not None
          print('Patched dependency set imports and pins verified.')
          PY
      - name: Run service regression tests
        env:
          SERVICE: ${{ matrix.service }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SERVICE" = "telecom-core/control-api" ]; then
            python -m compileall -q telecom-core/control-api/app
            python -m unittest discover -s telecom-core/control-api/tests -p 'test_*.py'
          else
            python -m compileall -q video-renderer
            (cd video-renderer && python -m unittest discover -s . -p 'test_*.py')
          fi
      - name: Download verified open-source OSV scanner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 20 --max-time 180 \
            https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 \
            -o "${RUNNER_TEMP}/osv-scanner"
          printf '%s  %s\n' 'ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108' "${RUNNER_TEMP}/osv-scanner" | sha256sum --check
          chmod 700 "${RUNNER_TEMP}/osv-scanner"
      - name: Check service advisories
        env:
          SERVICE: ${{ matrix.service }}
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/osv-scanner" scan --format table --lockfile="requirements.txt:${SERVICE}/requirements.txt"

name: Magnanimous Satellite Lock
on:
  pull_request:
    paths:
      - 'telecom-core/satellite/**'
      - 'telecom-core/tests/test_satellite_policy.py'
      - 'qa/scripts/magnanimous-satellite-lock.mjs'
      - '.github/workflows/magnanimous-satellite-lock.yml'
  push:
    branches: [main]
    paths:
      - 'telecom-core/satellite/**'
      - 'telecom-core/tests/test_satellite_policy.py'
      - 'qa/scripts/magnanimous-satellite-lock.mjs'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node qa/scripts/magnanimous-satellite-lock.mjs
      - run: pip install pytest
      - run: cd telecom-core && python -m pytest -q tests/test_satellite_policy.py

name: Sync Managed Email Auth Secret

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Sync protected managed-auth secret when present
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${COMPOSIO_API_KEY:-}" ]; then
            echo "COMPOSIO_API_KEY is not set in GitHub Actions; encrypted Owner Integrations vault remains available."
            exit 0
          fi
          printf '%s' "$COMPOSIO_API_KEY" | npx wrangler secret put COMPOSIO_API_KEY >/dev/null
          echo "Synced protected Worker secret: COMPOSIO_API_KEY"

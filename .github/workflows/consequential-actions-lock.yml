name: Consequential Actions Lock

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consequential-actions-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify self-service consequential-action protections
        run: |
          node qa/scripts/consequential-actions-lock.mjs
          node qa/scripts/connected-assistant-ui-lock.mjs
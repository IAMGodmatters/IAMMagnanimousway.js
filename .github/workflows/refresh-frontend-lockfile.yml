name: Refresh Frontend Lockfile

on:
  push:
    branches:
      - fix/platform-reliability-depth-storage
    paths:
      - frontend/package.json
      - .github/workflows/refresh-frontend-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/platform-reliability-depth-storage
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh exact lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify critical production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical
      - name: Commit refreshed lockfile when needed
        shell: bash
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo 'Frontend lockfile already exact.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git commit -m 'Refresh frontend lockfile for Next.js security patch'
          git push origin HEAD:fix/platform-reliability-depth-storage

name: NCS2 Edge AI Wiring

on:
  push:
    branches:
      - feature/ncs2-edge-ai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ncs2-edge-ai-wiring
  cancel-in-progress: false

jobs:
  wire-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/ncs2-edge-ai
          fetch-depth: 0

      - name: Apply deterministic NCS2 wiring
        run: python qa/scripts/apply-ncs2-edge-wiring.py

      - name: Python syntax checks
        run: python -m py_compile local-bridge/bridge_agent.py local-bridge/ncs2_edge.py qa/scripts/apply-ncs2-edge-wiring.py

      - name: Local Bridge regression lock
        run: node qa/scripts/magnanimous-local-bridge-lock.mjs

      - name: Capability Mesh regression lock
        run: node qa/scripts/magnanimous-capability-mesh-lock.mjs

      - name: NCS2 edge regression lock
        run: node qa/scripts/magnanimous-ncs2-edge-lock.mjs

      - name: Commit verified wiring when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "NCS2 wiring already applied; nothing to commit."
            exit 0
          fi
          git config user.name "Magnanimous CI"
          git config user.email "actions@users.noreply.github.com"
          git add local-bridge/bridge_agent.py local-bridge/install.ps1 worker/src/magnanimous-local-bridge-runtime.js worker/src/magnanimous-capability-mesh.js worker/src/provider-entrypoint.js worker/src/magnanimous-universal-capabilities.js
          git commit -m "feat: wire NCS2 edge AI into Magnanimous"
          git push origin HEAD:feature/ncs2-edge-ai

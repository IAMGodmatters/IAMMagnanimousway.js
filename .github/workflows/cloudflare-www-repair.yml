name: Repair WWW Branded Domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-www-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-www:
    runs-on: ubuntu-latest
    env:
      CF_API: https://api.cloudflare.com/client/v4
      SERVICE: iam-magnanimous
      ZONE_ID: 521b7cf033672b35b3ddcf6bfca74cec
      ZONE_NAME: iammagnanimousway.com
      WWW: www.iammagnanimousway.com
    steps:
      - name: Inspect exact www DNS records
        id: inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/www-dns.json -w '%{http_code}' \
            "$CF_API/zones/$ZONE_ID/dns_records?name=$WWW&per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          cat /tmp/www-dns.json
          if [ "$code" = "200" ]; then
            echo 'dns_read=true' >> "$GITHUB_OUTPUT"
          else
            echo 'dns_read=false' >> "$GITHUB_OUTPUT"
            echo "Cloudflare DNS listing is unavailable to this token (HTTP $code)."
          fi

      - name: Remove only conflicting www web records
        if: steps.inspect.outputs.dns_read == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/delete-ids.txt
          import json
          data=json.load(open('/tmp/www-dns.json'))
          for r in data.get('result') or []:
              if r.get('name') == 'www.iammagnanimousway.com' and r.get('type') in {'A','AAAA','CNAME'}:
                  print(r['id'])
          PY
          if [ ! -s /tmp/delete-ids.txt ]; then
            echo 'No A/AAAA/CNAME record found at exact www hostname.'
            exit 0
          fi
          while read -r id; do
            code=$(curl -sS -o /tmp/delete.json -w '%{http_code}' \
              -X DELETE "$CF_API/zones/$ZONE_ID/dns_records/$id" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            cat /tmp/delete.json
            python - "$code" <<'PY'
          import json,sys
          code=int(sys.argv[1]); data=json.load(open('/tmp/delete.json'))
          if code >= 400 or not data.get('success'):
              raise SystemExit(f"DNS delete not permitted or failed HTTP {code}: {data.get('errors')}")
          PY
          done < /tmp/delete-ids.txt

      - name: Attach www custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          body=$(python - <<'PY'
          import json,os
          print(json.dumps({
            'hostname': os.environ['WWW'],
            'service': os.environ['SERVICE'],
            'zone_name': os.environ['ZONE_NAME']
          }))
          PY
          )
          code=$(curl -sS -o /tmp/www-attach.json -w '%{http_code}' \
            -X PUT "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data "$body")
          cat /tmp/www-attach.json
          python - "$code" <<'PY'
          import json,sys
          code=int(sys.argv[1]); data=json.load(open('/tmp/www-attach.json'))
          if code >= 400 or not data.get('success'):
              raise SystemExit(f"www attach failed HTTP {code}: {data.get('errors')}")
          result=data.get('result') or {}
          assert result.get('hostname') == 'www.iammagnanimousway.com', result
          assert result.get('service') == 'iam-magnanimous', result
          print('www custom domain attached.')
          PY

      - name: Verify www canonical redirect
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            headers=$(mktemp)
            status=$(curl -sS --connect-timeout 10 --max-time 25 -o /dev/null -D "$headers" -w '%{http_code}' "https://$WWW/reviews/?from=www" || true)
            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); print $2; exit}' "$headers")
            if [ "$status" = "308" ] && [ "$location" = "https://iammagnanimousway.com/reviews/?from=www" ]; then
              echo 'www redirects canonically to the branded apex domain.'
              exit 0
            fi
            echo "www not ready yet (attempt $attempt, HTTP $status, location $location)."
            sleep 10
          done
          exit 1

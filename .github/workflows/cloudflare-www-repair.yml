name: WWW Canonical Domain Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-www-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-www:
    runs-on: ubuntu-latest
    env:
      WWW: www.iammagnanimousway.com
      APEX: iammagnanimousway.com
    steps:
      - name: Verify public DNS resolves through Cloudflare
        run: |
          set -euo pipefail
          a_records=$(dig +short A "$WWW" | tr '\n' ' ')
          [ -n "$a_records" ] || { echo 'www has no public A resolution.'; exit 1; }
          echo "www public A resolution: $a_records"

      - name: Verify www redirects to canonical apex
        run: |
          set -euo pipefail
          for path in '/' '/reviews/' '/free-tools/'; do
            headers=$(mktemp)
            status=$(curl -sS --connect-timeout 10 --max-time 25 -o /dev/null -D "$headers" -w '%{http_code}' "https://$WWW$path" || true)
            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); print $2; exit}' "$headers")
            case "$status" in
              301|302|307|308) ;;
              *) echo "Expected redirect for https://$WWW$path, got HTTP $status"; exit 1 ;;
            esac
            expected="https://$APEX$path"
            [ "$location" = "$expected" ] || { echo "Expected $expected, got $location"; exit 1; }
            echo "Verified https://$WWW$path -> $location ($status)"
          done
          echo 'www is correctly canonicalized to the branded apex domain.'

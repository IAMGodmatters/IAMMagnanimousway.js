name: Magnanimous Native-First Brain Lock

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-first-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify native-first brain and God Coding contracts
        run: node qa/scripts/magnanimous-native-first-lock.mjs
      - name: Verify OGENIC GOD TOOLKIT absorption
        run: node qa/scripts/magnanimous-ogenic-god-toolkit-lock.mjs
      - name: Verify Magnanimous Local Bridge
        run: node qa/scripts/magnanimous-local-bridge-lock.mjs
      - name: Verify Magnanimous Native Web Agent
        run: node qa/scripts/magnanimous-native-web-lock.mjs
      - name: Syntax check Native Web Worker runtime
        run: node --check worker/src/magnanimous-native-web-runtime.js
      - name: Syntax check Local Bridge Python agent
        run: python -m py_compile local-bridge/bridge_agent.py
      - name: Syntax check Local Bridge PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'local-bridge/install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Syntax check Local Bridge PowerShell uninstaller
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'local-bridge/uninstall.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Syntax check native-first Worker runtime
        run: node --check worker/src/magnanimous-native-first.js
      - name: Syntax check OGENIC GOD TOOLKIT runtime
        run: node --check worker/src/magnanimous-ogenic-god-toolkit.js

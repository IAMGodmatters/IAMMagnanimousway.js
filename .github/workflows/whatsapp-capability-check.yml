name: Magnanimous WhatsApp Capability Verification

on:
  push:
    branches: [main]
    paths:
      - 'whatsapp-core/**'
      - 'worker/src/magnanimous-whatsapp-capability-registry.js'
      - 'worker/src/magnanimous-whatsapp-runtime.js'
      - 'worker/src/entrypoint.js'
      - 'worker/migrations/0050_magnanimous_whatsapp_control.sql'
      - '.github/workflows/whatsapp-capability-check.yml'
  pull_request:
    paths:
      - 'whatsapp-core/**'
      - 'worker/src/magnanimous-whatsapp-capability-registry.js'
      - 'worker/src/magnanimous-whatsapp-runtime.js'
      - 'worker/src/entrypoint.js'
      - 'worker/migrations/0050_magnanimous_whatsapp_control.sql'
      - '.github/workflows/whatsapp-capability-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate WhatsApp runtimes
        run: |
          node --check worker/src/magnanimous-whatsapp-capability-registry.js
          node --check worker/src/magnanimous-whatsapp-runtime.js
          node --check worker/src/entrypoint.js
      - name: Validate Magnanimous identity and provider boundary
        run: |
          grep -q "identity:'Magnanimous AI WhatsApp Control'" worker/src/magnanimous-whatsapp-capability-registry.js
          grep -q "brain_identity:'Magnanimous AI'" worker/src/magnanimous-whatsapp-capability-registry.js
          grep -q 'provider_internal_only:true' worker/src/magnanimous-whatsapp-capability-registry.js
          grep -q 'provider_brand_override_allowed:false' worker/src/magnanimous-whatsapp-capability-registry.js
          grep -q 'second_write_path_allowed:false' worker/src/magnanimous-whatsapp-capability-registry.js
      - name: Validate absorbed capability families
        run: |
          grep -q "id:'cloud-api'" worker/src/magnanimous-whatsapp-capability-registry.js
          grep -q "id:'message-templates'" worker/src/magnanimous-whatsapp-capability-registry.js
          grep -q "id:'webhooks'" worker/src/magnanimous-whatsapp-capability-registry.js
          grep -q "id:'flows'" worker/src/magnanimous-whatsapp-capability-registry.js
          grep -q "id:'commerce-settings'" worker/src/magnanimous-whatsapp-capability-registry.js
          grep -q "id:'qr-codes'" worker/src/magnanimous-whatsapp-capability-registry.js
          grep -q "id:'embedded-signup'" worker/src/magnanimous-whatsapp-capability-registry.js
          grep -q "id:'regional-payments'" worker/src/magnanimous-whatsapp-capability-registry.js
          grep -q "id:'business-calling'" worker/src/magnanimous-whatsapp-capability-registry.js
          grep -q "id:'consent-policy'" worker/src/magnanimous-whatsapp-capability-registry.js
      - name: Validate normalized state migration
        run: |
          python3 - <<'PY'
          import pathlib, sqlite3
          sql=pathlib.Path('worker/migrations/0050_magnanimous_whatsapp_control.sql').read_text()
          db=sqlite3.connect(':memory:')
          db.executescript(sql)
          expected={
            'magnanimous_whatsapp_accounts','magnanimous_whatsapp_phone_assets','magnanimous_whatsapp_templates',
            'magnanimous_whatsapp_flows','magnanimous_whatsapp_message_state','magnanimous_whatsapp_webhook_events',
            'magnanimous_whatsapp_consent','magnanimous_whatsapp_quality_snapshots','magnanimous_whatsapp_commerce_state'
          }
          actual={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing=expected-actual
          assert not missing, f'missing tables: {sorted(missing)}'
          PY
      - name: Validate privacy and consequential locks
        run: |
          grep -q 'raw_message_bodies_stored_by_control_plane:false' worker/src/magnanimous-whatsapp-runtime.js
          grep -q 'raw_media_stored_by_control_plane:false' worker/src/magnanimous-whatsapp-runtime.js
          grep -q 'direct_payment_execution_enabled:false' worker/src/magnanimous-whatsapp-runtime.js
          grep -q 'direct_call_execution_enabled:false' worker/src/magnanimous-whatsapp-runtime.js
          grep -q "action_router:'/api/assistant-integrations/actions'" worker/src/magnanimous-whatsapp-runtime.js
          grep -q 'does not create a second write path' whatsapp-core/ABSORPTION.md
          grep -qi 'no provider access tokens, raw message bodies, media bytes, payment credentials or raw identity documents' worker/migrations/0050_magnanimous_whatsapp_control.sql
      - name: Validate current-platform documentation
        run: |
          grep -qi 'Cloud API' whatsapp-core/ABSORPTION.md
          grep -qi 'Business Management' whatsapp-core/ABSORPTION.md
          grep -qi 'Flows' whatsapp-core/ABSORPTION.md
          grep -qi 'Embedded Signup' whatsapp-core/ABSORPTION.md
          grep -qi 'On-Premises API is deprecated' whatsapp-core/ABSORPTION.md

name: Magnanimous Production Data Stage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/magnanimous-production-data-stage.yml'
      - 'magnanimous-runtime/scripts/export-d1-logical.mjs'
      - 'magnanimous-runtime/src/migration-stage.mjs'
      - 'magnanimous-runtime/src/server.mjs'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: magnanimous-production-data-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STANDALONE_ORIGIN: https://magnanimous-production.up.railway.app
      OIDC_AUDIENCE: magnanimous-production-data-stage
      MAGNANIMOUS_D1_PAGE_SIZE: "1000"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build FTS-safe logical production snapshot
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          (cd worker && npm ci --no-audit --no-fund)
          rm -f /tmp/d1-production-logical.sqlite /tmp/d1-production-summary.json
          node magnanimous-runtime/scripts/export-d1-logical.mjs             /tmp/d1-production-logical.sqlite             /tmp/d1-production-summary.json
          test -s /tmp/d1-production-logical.sqlite
          test -s /tmp/d1-production-summary.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/d1-production-summary.json'))
          assert d.get('integrity') == 'ok', d
          assert d.get('foreign_key_violations') == 0, d
          assert d.get('table_count',0) > 0, d
          assert d.get('sqlite_sha256'), d
          print(f"Logical production snapshot ready across {d['table_count']} logical tables; {d['sqlite_bytes']} bytes.")
          PY

      - name: Stage snapshot on standalone origin using GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          bytes="$(wc -c < /tmp/d1-production-logical.sqlite)"
          if [ "$bytes" -gt 100000000 ]; then
            echo "::error::Logical production snapshot is larger than the current 100 MB signed staging limit."
            exit 1
          fi
          success=0
          for attempt in $(seq 1 36); do
            oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
            oidc_token="$(printf '%s' "$oidc_json" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            status="$(curl -sS --connect-timeout 10 --max-time 180               -o /tmp/stage-response.json -w '%{http_code}'               -X POST               -H "Authorization: Bearer $oidc_token"               -H "Content-Type: application/vnd.sqlite3"               --data-binary @/tmp/d1-production-logical.sqlite               "$STANDALONE_ORIGIN/__magnanimous_runtime/migration/stage-d1" || true)"
            if [ "$status" = "200" ]; then
              success=1
              break
            fi
            echo "Standalone migration endpoint not ready yet (HTTP $status, attempt $attempt/36)."
            sleep 10
          done
          if [ "$success" != "1" ]; then
            echo "::error::Standalone migration staging did not succeed."
            cat /tmp/stage-response.json 2>/dev/null || true
            exit 1
          fi

      - name: Verify staged database parity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          source=json.load(open('/tmp/d1-production-summary.json'))
          target=json.load(open('/tmp/stage-response.json'))
          assert target.get('ok') is True, target
          assert target.get('integrity') == 'ok', target
          assert target.get('foreign_key_violations') == 0, target
          assert target.get('sqlite_sha256') == source.get('sqlite_sha256'), 'SQLite snapshot digest mismatch'
          assert target.get('schema_sha256') == source.get('schema_sha256'), 'Schema digest mismatch'
          assert target.get('table_count') == source.get('table_count'), 'Logical table-count mismatch'
          assert target.get('table_counts') == source.get('table_counts'), 'Per-table row-count mismatch'
          print(f"Magnanimous production D1 staging parity PASS across {source['table_count']} logical tables.")
          PY

      - name: Remove transient production snapshot
        if: always()
        shell: bash
        run: |
          set +e
          for file in /tmp/d1-production-logical.sqlite /tmp/d1-production-summary.json /tmp/stage-response.json; do
            if [ -f "$file" ]; then
              size="$(stat -c%s "$file" 2>/dev/null || echo 0)"
              if [ "$size" -gt 0 ]; then
                dd if=/dev/zero of="$file" bs=1M count=$(( (size + 1048575) / 1048576 )) conv=notrunc status=none 2>/dev/null || true
              fi
              rm -f "$file"
            fi
          done
          echo "Transient production snapshot files destroyed."

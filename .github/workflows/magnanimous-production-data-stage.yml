name: Magnanimous Production Data Stage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/magnanimous-production-data-stage.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: magnanimous-production-data-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STANDALONE_ORIGIN: https://magnanimous-production.up.railway.app
      OIDC_AUDIENCE: magnanimous-production-data-stage
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Export current production D1
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          rm -f /tmp/d1-production-export.sql
          npx wrangler d1 export iam-magnanimous-db --remote --output=/tmp/d1-production-export.sql
          test -s /tmp/d1-production-export.sql
          bytes="$(wc -c < /tmp/d1-production-export.sql)"
          echo "Production D1 export captured securely ($bytes bytes)."

      - name: Build local parity reference
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/d1-source.sqlite /tmp/d1-source-summary.json
          MAGNANIMOUS_ALLOW_IMPORT=YES_I_UNDERSTAND             node magnanimous-runtime/scripts/import-d1-export.mjs /tmp/d1-production-export.sql /tmp/d1-source.sqlite >/tmp/import-result.json
          node --input-type=module <<'NODE' >/tmp/d1-source-summary.json
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {DatabaseSync} from 'node:sqlite';
          const db=new DatabaseSync('/tmp/d1-source.sqlite',{readOnly:true});
          const qname=(name)=>'"'+String(name).replaceAll('"','""')+'"';
          const rows=db.prepare("SELECT name,sql FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name").all();
          const table_counts={};
          const schema=[];
          for(const row of rows){
            table_counts[row.name]=Number(db.prepare('SELECT COUNT(*) n FROM '+qname(row.name)).get()?.n||0);
            schema.push([row.name,String(row.sql||'')]);
          }
          const integrity=String(db.prepare('PRAGMA integrity_check').get()?.integrity_check||'');
          db.close();
          const sql=fs.readFileSync('/tmp/d1-production-export.sql');
          process.stdout.write(JSON.stringify({
            integrity,
            table_count:rows.length,
            table_counts,
            schema_sha256:crypto.createHash('sha256').update(JSON.stringify(schema)).digest('hex'),
            sql_sha256:crypto.createHash('sha256').update(sql).digest('hex')
          }));
          NODE
          node -e "const x=require('/tmp/d1-source-summary.json');if(x.integrity!=='ok')process.exit(1);console.log('Local D1 parity reference PASS across '+x.table_count+' tables.');"

      - name: Stage export on standalone origin using GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 36); do
            oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
            oidc_token="$(printf '%s' "$oidc_json" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            status="$(curl -sS --connect-timeout 10 --max-time 180               -o /tmp/stage-response.json -w '%{http_code}'               -X POST               -H "Authorization: Bearer $oidc_token"               -H "Content-Type: application/sql"               --data-binary @/tmp/d1-production-export.sql               "$STANDALONE_ORIGIN/__magnanimous_runtime/migration/stage-d1" || true)"
            if [ "$status" = "200" ]; then
              success=1
              break
            fi
            echo "Standalone migration endpoint not ready yet (HTTP $status, attempt $attempt/36)."
            sleep 10
          done
          if [ "$success" != "1" ]; then
            echo "::error::Standalone migration staging did not succeed."
            cat /tmp/stage-response.json 2>/dev/null || true
            exit 1
          fi

      - name: Verify staged database parity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          source=json.load(open('/tmp/d1-source-summary.json'))
          target=json.load(open('/tmp/stage-response.json'))
          assert target.get('ok') is True, target
          assert target.get('integrity') == 'ok', target
          assert target.get('sql_sha256') == source.get('sql_sha256'), 'D1 export digest mismatch'
          assert target.get('schema_sha256') == source.get('schema_sha256'), 'Schema digest mismatch'
          assert target.get('table_count') == source.get('table_count'), 'Table-count mismatch'
          assert target.get('table_counts') == source.get('table_counts'), 'Per-table row-count mismatch'
          print(f"Magnanimous production D1 staging parity PASS across {source['table_count']} tables.")
          PY

      - name: Remove transient production export
        if: always()
        shell: bash
        run: |
          rm -f /tmp/d1-production-export.sql /tmp/d1-source.sqlite /tmp/d1-source-summary.json /tmp/stage-response.json /tmp/import-result.json

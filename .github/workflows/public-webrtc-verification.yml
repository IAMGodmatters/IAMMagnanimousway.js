name: Public Telecom WebRTC Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-telecom-webrtc-verification
  cancel-in-progress: false

jobs:
  external-browser-media:
    name: External Chromium to public Asterisk WSS/RTP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEBRTC_WSS_URL: ${{ vars.TELECOM_PUBLIC_WSS_URL }}
      WEBRTC_DOMAIN: ${{ vars.TELECOM_PUBLIC_SIP_DOMAIN }}
      WEBRTC_EXTENSION: ${{ vars.TELECOM_PUBLIC_WEBRTC_EXTENSION }}
      WEBRTC_ECHO_EXTENSION: ${{ vars.TELECOM_PUBLIC_ECHO_EXTENSION }}
      WEBRTC_PASSWORD: ${{ secrets.TELECOM_PUBLIC_WEBRTC_PASSWORD }}
      WEBRTC_ICE_TRANSPORT_POLICY: ${{ vars.TELECOM_PUBLIC_ICE_TRANSPORT_POLICY }}
      WEBRTC_TURN_URLS: ${{ vars.TELECOM_PUBLIC_TURN_URLS }}
      WEBRTC_TURN_AUTH_SECRET: ${{ secrets.TELECOM_PUBLIC_TURN_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require public verification configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WEBRTC_WSS_URL}" || { echo 'Missing TELECOM_PUBLIC_WSS_URL repository variable.' >&2; exit 1; }
          test -n "${WEBRTC_DOMAIN}" || { echo 'Missing TELECOM_PUBLIC_SIP_DOMAIN repository variable.' >&2; exit 1; }
          test -n "${WEBRTC_EXTENSION}" || { echo 'Missing TELECOM_PUBLIC_WEBRTC_EXTENSION repository variable.' >&2; exit 1; }
          test -n "${WEBRTC_ECHO_EXTENSION}" || { echo 'Missing TELECOM_PUBLIC_ECHO_EXTENSION repository variable.' >&2; exit 1; }
          test -n "${WEBRTC_PASSWORD}" || { echo 'Missing TELECOM_PUBLIC_WEBRTC_PASSWORD repository secret.' >&2; exit 1; }
          if [ "${WEBRTC_ICE_TRANSPORT_POLICY:-all}" = "relay" ]; then
            test -n "${WEBRTC_TURN_URLS}" || { echo 'Relay verification requires TELECOM_PUBLIC_TURN_URLS.' >&2; exit 1; }
            test -n "${WEBRTC_TURN_AUTH_SECRET}" || { echo 'Relay verification requires TELECOM_PUBLIC_TURN_AUTH_SECRET.' >&2; exit 1; }
          fi

      - name: Build short-lived TURN verification credential
        if: env.WEBRTC_ICE_TRANSPORT_POLICY == 'relay'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const crypto=require('node:crypto');
          const fs=require('node:fs');
          const urls=(process.env.WEBRTC_TURN_URLS||'').split(',').map(v=>v.trim()).filter(Boolean);
          if(!urls.length) throw new Error('No TURN URLs configured');
          if(urls.some(v=>!v.startsWith('turns:'))) throw new Error('Strict relay verification requires turns: URLs');
          const expires=Math.floor(Date.now()/1000)+900;
          const username=`${expires}:${process.env.WEBRTC_EXTENSION}`;
          const credential=crypto.createHmac('sha1',process.env.WEBRTC_TURN_AUTH_SECRET).update(username).digest('base64');
          const ice=[{urls,username,credential,credentialType:'password'}];
          fs.appendFileSync(process.env.GITHUB_ENV,`WEBRTC_ICE_SERVERS_JSON=${JSON.stringify(ice)}\n`);
          fs.mkdirSync('/tmp/magnanimous-public-webrtc',{recursive:true});
          const targets=urls.map(value=>{
            const authority=value.slice('turns:'.length).split('?')[0];
            const parsed=new URL('https://'+authority);
            return `${parsed.hostname}|${parsed.port||'5349'}`;
          });
          fs.writeFileSync('/tmp/magnanimous-public-webrtc/turn-tls-targets.txt',targets.join('\n')+'\n');
          NODE

      - name: Verify TURN TLS chains and hostnames
        if: env.WEBRTC_ICE_TRANSPORT_POLICY == 'relay'
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r host port; do
            test -n "${host}" || continue
            openssl s_client \
              -connect "${host}:${port}" \
              -servername "${host}" \
              -verify_hostname "${host}" \
              -verify_return_error \
              </dev/null
          done < /tmp/magnanimous-public-webrtc/turn-tls-targets.txt

      - name: Reject local or private verification targets
        working-directory: telecom-core/webrtc-e2e
        run: node validate-public-target.mjs

      - name: Prepare optional short-lived TURN credentials
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const raw = String(process.env.TELECOM_PUBLIC_TURN_URLS || '').trim();
          const policy = process.env.WEBRTC_ICE_TRANSPORT_POLICY === 'relay' ? 'relay' : 'all';
          const urls = raw ? raw.split(',').map(v => v.trim()).filter(Boolean) : [];
          if (urls.some(url => !/^turns?:/i.test(url))) {
            throw new Error('TELECOM_PUBLIC_TURN_URLS entries must use turn: or turns:');
          }
          if (!urls.length) {
            if (policy === 'relay') throw new Error('Relay-only verification requires TELECOM_PUBLIC_TURN_URLS');
            fs.appendFileSync(process.env.GITHUB_ENV, 'WEBRTC_ICE_SERVERS_JSON=[]\n');
            process.exit(0);
          }
          const secret = String(process.env.TELECOM_PUBLIC_TURN_AUTH_SECRET || '');
          if (!secret) throw new Error('TELECOM_PUBLIC_TURN_AUTH_SECRET is required when TURN URLs are configured');
          const expires = Math.floor(Date.now() / 1000) + 900;
          const username = expires + ':github-public-proof-' + String(process.env.GITHUB_RUN_ID || 'run');
          const credential = crypto.createHmac('sha1', secret).update(username).digest('base64');
          const ice = [{ urls, username, credential, credentialType: 'password' }];
          fs.appendFileSync(process.env.GITHUB_ENV, 'WEBRTC_ICE_SERVERS_JSON=' + JSON.stringify(ice) + '\n');
          NODE

      - name: Resolve strict TLS target
        id: target
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const url = new URL(process.env.WEBRTC_WSS_URL);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `host=${url.hostname}\nport=${url.port || '443'}\n`);
          NODE

      - name: Verify trusted public TLS chain and hostname
        shell: bash
        env:
          TLS_HOST: ${{ steps.target.outputs.host }}
          TLS_PORT: ${{ steps.target.outputs.port }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/magnanimous-public-webrtc
          openssl s_client \
            -connect "${TLS_HOST}:${TLS_PORT}" \
            -servername "${TLS_HOST}" \
            -verify_hostname "${TLS_HOST}" \
            -verify_return_error \
            </dev/null 2>&1 | tee /tmp/magnanimous-public-webrtc/tls-verification.txt

      - name: Install browser probe dependencies
        working-directory: telecom-core/webrtc-e2e
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: telecom-core/webrtc-e2e
        run: npx playwright install --with-deps chromium

      - name: Generate deterministic microphone audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/magnanimous-public-webrtc
          python3 - <<'PY'
          import math, struct, wave
          path='/tmp/magnanimous-public-webrtc/tone.wav'
          rate=48000
          seconds=60
          frequency=440.0
          amplitude=0.18
          with wave.open(path,'wb') as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)
              for n in range(rate*seconds):
                  sample=int(32767*amplitude*math.sin(2*math.pi*frequency*n/rate))
                  wav.writeframesraw(struct.pack('<h',sample))
          PY

      - name: Build browser probe
        working-directory: telecom-core/webrtc-e2e
        run: npm run build

      - name: Start local probe page
        shell: bash
        run: |
          python3 -m http.server 4173 --directory telecom-core/webrtc-e2e/dist >/tmp/magnanimous-public-webrtc/web.log 2>&1 &
          echo $! >/tmp/magnanimous-public-webrtc/web.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/magnanimous-public-webrtc/web.log >&2 || true
          exit 1

      - name: Prove public registration and bidirectional RTP
        working-directory: telecom-core/webrtc-e2e
        env:
          WEBRTC_TEST_PAGE: http://127.0.0.1:4173/
          FAKE_AUDIO_WAV: /tmp/magnanimous-public-webrtc/tone.wav
          WEBRTC_ALLOW_INSECURE_TLS: 'false'
          WEBRTC_SERVER_ASSERT_MODE: remote
        run: npm run probe 2>&1 | tee /tmp/magnanimous-public-webrtc/browser-proof.txt

      - name: Upload public WebRTC evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-telecom-webrtc-${{ github.run_number }}
          path: /tmp/magnanimous-public-webrtc/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop probe page
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/magnanimous-public-webrtc/web.pid ]; then
            kill "$(cat /tmp/magnanimous-public-webrtc/web.pid)" 2>/dev/null || true
          fi

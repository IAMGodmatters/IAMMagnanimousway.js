name: Repair platform resilience locks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Apply Agent Mesh resilience repair
        run: node scripts/repair-agent-mesh-timeouts.mjs

      - name: Apply contact-center carrier privacy repair
        run: node scripts/repair-contact-center-provider-privacy.mjs

      - name: Verify Worker syntax
        run: |
          node --check worker/src/agent-mesh-runtime.js
          node --check worker/src/contact-center-runtime.js

      - name: Commit repair
        run: |
          if git diff --quiet -- worker/src/agent-mesh-runtime.js worker/src/contact-center-runtime.js; then
            echo "Platform resilience repairs already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/agent-mesh-runtime.js worker/src/contact-center-runtime.js
          git commit -m "Lock Agent Mesh resilience and carrier privacy"
          git push origin HEAD:main

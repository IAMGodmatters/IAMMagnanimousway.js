name: Validate I AM Platform

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend
        working-directory: frontend
        run: npm install

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Bundle Worker with Wrangler dry-run
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir /tmp/iam-worker-dry-run

      - name: Check critical Worker JavaScript syntax
        run: |
          node --check worker/src/integrations.js
          node --check worker/src/assistant-integrations.js
          node --check worker/src/assistant-integrations-runtime.js
          node --check worker/src/composio-managed-auth.js
          node --check worker/src/billing-runtime.js
          node --check worker/src/router-entrypoint.js
          node --check worker/src/contact-center-runtime.js
          node --check worker/src/contact-center-dial-runtime.js
          node --check worker/src/contact-center-ivr-routing-runtime.js
          node --check worker/src/twilio-softphone-runtime.js
          node --check worker/src/bpo-operations-runtime.js

name: Email Assistant Production Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify connected email assistant contract
        env:
          BASE_URL: https://iam-magnanimous.iam-magnanimous.workers.dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 7c9f798b-04d2-443c-a9e9-933c51899771
        run: |
          set -euo pipefail

          email="email-assistant-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          tenant_id=""

          cleanup() {
            if [ -z "${tenant_id:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
              return 0
            fi
            python - "$tenant_id" > /tmp/d1-cleanup.json <<'PY'
          import json,sys
          tenant=sys.argv[1].replace("'", "''")
          sql=f"""
          DELETE FROM assistant_actions WHERE tenant_id='{tenant}';
          DELETE FROM assistant_activity WHERE tenant_id='{tenant}';
          DELETE FROM assistant_permissions WHERE tenant_id='{tenant}';
          DELETE FROM integrations WHERE tenant_id='{tenant}';
          DELETE FROM integration_states WHERE tenant_id='{tenant}';
          DELETE FROM agent_mesh_messages WHERE tenant_id='{tenant}';
          DELETE FROM billing_management_requests WHERE tenant_id='{tenant}';
          DELETE FROM voice_agent_turns WHERE tenant_id='{tenant}';
          DELETE FROM voice_do_not_call WHERE tenant_id='{tenant}';
          DELETE FROM voice_agents WHERE tenant_id='{tenant}';
          DELETE FROM consent_records WHERE user_id IN (SELECT id FROM users WHERE tenant_id='{tenant}');
          DELETE FROM tenant_settings WHERE tenant_id='{tenant}';
          DELETE FROM billing_subscriptions WHERE tenant_id='{tenant}';
          DELETE FROM users WHERE tenant_id='{tenant}';
          DELETE FROM tenants WHERE id='{tenant}';
          """
          print(json.dumps({"sql":sql}))
          PY
            curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'content-type: application/json' \
              --data-binary @/tmp/d1-cleanup.json >/dev/null || true
          }
          trap cleanup EXIT

          python - "$email" > /tmp/signup.json <<'PY'
          import json,sys
          email=sys.argv[1]
          print(json.dumps({
            "name":"Email Assistant Smoke",
            "workspace":"Email Assistant Smoke",
            "email":email,
            "password":"Email-Smoke-Only-2026!",
            "accountProcessingConsent":True,
            "termsAccepted":True,
            "marketingConsent":False
          }))
          PY

          status=$(curl -sS -o /tmp/signup-response.json -w '%{http_code}' -X POST "$BASE_URL/api/auth/signup" -H 'content-type: application/json' --data-binary @/tmp/signup.json)
          test "$status" = "201"

          readarray -t values < <(python - <<'PY'
          import json
          d=json.load(open('/tmp/signup-response.json'))
          print((d.get('user') or {}).get('tenant_id',''))
          print(d.get('token',''))
          PY
          )
          tenant_id="${values[0]}"
          token="${values[1]}"
          test -n "$tenant_id"
          test -n "$token"

          status=$(curl -sS -o /tmp/context.json -w '%{http_code}' "$BASE_URL/api/assistant-integrations/context" -H "Authorization: Bearer $token")
          test "$status" = "200"

          python - <<'PY'
          import json
          d=json.load(open('/tmp/context.json'))
          providers={p.get('id'):p for p in (d.get('providers') or [])}
          for provider in ('google','outlook'):
              assert provider in providers, d
              caps=set(providers[provider].get('capabilities') or [])
              assert 'read_mail' in caps, (provider,caps)
              assert 'send_mail' in caps, (provider,caps)
          automation=d.get('automation') or {}
          assert automation.get('owner_approval_required') is False, automation
          assert automation.get('provider_authorization_required') is True, automation
          assert automation.get('email_read_send_supported') is True, automation
          assert automation.get('email_token_refresh_supported') is True, automation
          print('Connected email assistant production contract passed.')
          PY

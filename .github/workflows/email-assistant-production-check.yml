name: Email Assistant Production Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify connected email assistant contract
        env:
          BASE_URL: https://iam-magnanimous.iam-magnanimous.workers.dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 7c9f798b-04d2-443c-a9e9-933c51899771
        run: |
          set -euo pipefail

          email="email-assistant-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          tenant_id=""

          cleanup() {
            if [ -z "${tenant_id:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
              return 0
            fi

            cat > /tmp/d1-schema-query.json <<'JSON'
          {"sql":"SELECT name, sql FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';"}
          JSON
            if ! curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'content-type: application/json' \
              --data-binary @/tmp/d1-schema-query.json > /tmp/d1-schema.json; then
              echo "Warning: unable to inspect D1 schema for disposable email-assistant cleanup."
              return 0
            fi

            python - "$tenant_id" > /tmp/d1-cleanup.json <<'PY'
          import json,sys,re
          tenant=sys.argv[1].replace("'", "''")
          raw=json.load(open('/tmp/d1-schema.json'))
          rows=[]
          for block in raw.get('result') or []:
              rows.extend(block.get('results') or [])
          table_sql={str(r.get('name') or ''):str(r.get('sql') or '') for r in rows if r.get('name')}
          statements=[]

          # Consent is keyed by user rather than tenant in this schema; remove it before users.
          if 'consent_records' in table_sql and 'users' in table_sql:
              statements.append(f"DELETE FROM consent_records WHERE user_id IN (SELECT id FROM users WHERE tenant_id='{tenant}')")

          # Remove all tenant-scoped data discovered in the live schema, excluding users until the end.
          for name,ddl in sorted(table_sql.items()):
              if name in {'users','tenants','consent_records'}:
                  continue
              if re.search(r'\btenant_id\b', ddl, re.I):
                  safe=name.replace('"','""')
                  statements.append(f'DELETE FROM "{safe}" WHERE tenant_id=\'{tenant}\'')

          if 'users' in table_sql and re.search(r'\btenant_id\b', table_sql['users'], re.I):
              statements.append(f"DELETE FROM users WHERE tenant_id='{tenant}'")
          if 'tenants' in table_sql:
              statements.append(f"DELETE FROM tenants WHERE id='{tenant}'")

          print(json.dumps({'batch':[{'sql':s} for s in statements]}))
          PY

            if ! curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'content-type: application/json' \
              --data-binary @/tmp/d1-cleanup.json > /tmp/d1-cleanup-response.json; then
              echo "Warning: D1 cleanup request failed."
              cat /tmp/d1-cleanup-response.json || true
              return 0
            fi
            python - <<'PY'
          import json
          d=json.load(open('/tmp/d1-cleanup-response.json'))
          assert d.get('success') is True, d
          assert all(x.get('success') is True for x in (d.get('result') or [])), d
          print('Disposable email-assistant workspace cleaned from D1.')
          PY
          }
          trap cleanup EXIT

          python - "$email" > /tmp/signup.json <<'PY'
          import json,sys
          email=sys.argv[1]
          print(json.dumps({
            "name":"Email Assistant Smoke",
            "workspace":"Email Assistant Smoke",
            "email":email,
            "password":"Email-Smoke-Only-2026!",
            "accountProcessingConsent":True,
            "termsAccepted":True,
            "marketingConsent":False
          }))
          PY

          status=$(curl -sS -o /tmp/signup-response.json -w '%{http_code}' -X POST "$BASE_URL/api/auth/signup" -H 'content-type: application/json' --data-binary @/tmp/signup.json)
          test "$status" = "201"

          readarray -t values < <(python - <<'PY'
          import json
          d=json.load(open('/tmp/signup-response.json'))
          print((d.get('user') or {}).get('tenant_id',''))
          print(d.get('token',''))
          PY
          )
          tenant_id="${values[0]}"
          token="${values[1]}"
          test -n "$tenant_id"
          test -n "$token"

          status=$(curl -sS -o /tmp/context.json -w '%{http_code}' "$BASE_URL/api/assistant-integrations/context" -H "Authorization: Bearer $token")
          test "$status" = "200"

          python - <<'PY'
          import json
          d=json.load(open('/tmp/context.json'))
          providers={p.get('id'):p for p in (d.get('providers') or [])}
          for provider in ('google','outlook'):
              assert provider in providers, d
              caps=set(providers[provider].get('capabilities') or [])
              assert 'read_mail' in caps, (provider,caps)
              assert 'send_mail' in caps, (provider,caps)
          automation=d.get('automation') or {}
          assert automation.get('owner_approval_required') is False, automation
          assert automation.get('provider_authorization_required') is True, automation
          assert automation.get('email_read_send_supported') is True, automation
          assert automation.get('email_token_refresh_supported') is True, automation
          print('Connected email assistant production contract passed.')
          PY

          status=$(curl -sS -o /tmp/integrations.json -w '%{http_code}' "$BASE_URL/api/integrations" -H "Authorization: Bearer $token")
          test "$status" = "200"

          readarray -t oauth_state < <(python - <<'PY'
          import json
          d=json.load(open('/tmp/integrations.json'))
          items={p.get('id'):p for p in (d.get('integrations') or [])}
          for provider in ('google','outlook'):
              assert provider in items, d
              print('1' if items[provider].get('configured') else '0')
          PY
          )
          google_ready="${oauth_state[0]}"
          outlook_ready="${oauth_state[1]}"
          echo "Google OAuth configured: $google_ready"
          echo "Microsoft Outlook OAuth configured: $outlook_ready"

          verify_auth_url() {
            local provider="$1" expected_host="$2"
            local status
            status=$(curl -sS -o "/tmp/${provider}-connect.json" -w '%{http_code}' -X POST "$BASE_URL/api/integrations/${provider}/connect" -H 'content-type: application/json' -H "Authorization: Bearer $token" --data '{}')
            test "$status" = "200"
            python - "$provider" "$expected_host" <<'PY'
          import json,sys,urllib.parse
          provider,host=sys.argv[1],sys.argv[2]
          d=json.load(open(f'/tmp/{provider}-connect.json'))
          u=urllib.parse.urlparse(d.get('authorization_url',''))
          assert u.scheme == 'https', d
          assert u.hostname == host, d
          print(f'{provider} official authorization URL verified: {u.hostname}')
          PY
          }

          if [ "$google_ready" = "1" ]; then
            verify_auth_url google accounts.google.com
          else
            echo "Google OAuth developer credentials are not installed yet; platform code remains ready."
          fi

          if [ "$outlook_ready" = "1" ]; then
            verify_auth_url outlook login.microsoftonline.com
          else
            echo "Microsoft OAuth developer credentials are not installed yet; platform code remains ready."
          fi

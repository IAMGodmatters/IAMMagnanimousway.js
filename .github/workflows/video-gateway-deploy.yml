name: Deploy I AM Video Gateway

on:
  push:
    branches: [main]
    paths:
      - 'video-gateway/**'
      - 'video-renderer/**'
      - 'render.yaml'
      - '.github/workflows/video-gateway-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-gateway:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VIDEO_GATEWAY_URL: https://iam-magnanimous-video-gateway.iam-magnanimous.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Wrangler
        working-directory: video-gateway
        run: npm install --save-dev wrangler@latest

      - name: Deploy video gateway
        working-directory: video-gateway
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify video gateway health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors --max-time 120 \
            "$VIDEO_GATEWAY_URL/health" >/tmp/video-health.json
          grep -q '"status":"ok"' /tmp/video-health.json
          echo "Video gateway is healthy."

      - name: Check optional remote MP4 renderer
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 300 \
            -H 'Content-Type: application/json' \
            -d '{"title":"I AM Video Smoke Test","text":"Production vertical video test","width":720,"height":1280,"duration":1}' \
            "$VIDEO_GATEWAY_URL/api/video/render" >/tmp/video-render.json

          DOWNLOAD_PATH="$(python - <<'PY'
          import json
          with open('/tmp/video-render.json', encoding='utf-8') as f:
              data = json.load(f)
          path = data.get('download_url')
          if not path:
              raise SystemExit(f"Missing download_url: {data}")
          print(path)
          PY
          )"

          curl -fsS --max-time 300 "$VIDEO_GATEWAY_URL$DOWNLOAD_PATH" -o /tmp/iam-video-smoke.mp4
          test -s /tmp/iam-video-smoke.mp4
          echo "Optional remote MP4 renderer is available."

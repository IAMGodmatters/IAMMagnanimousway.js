name: Private Repository Readiness Lock

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: private-repo-readiness-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify private source visibility and distribution readiness
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RULESET_READ_TOKEN: ${{ secrets.GITHUB_RULESET_READ_TOKEN }}
        run: node qa/scripts/private-repo-readiness-lock.mjs

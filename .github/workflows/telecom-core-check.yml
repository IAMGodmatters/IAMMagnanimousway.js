name: Magnanimous Telecom Core Verification

on:
  push:
    branches: [main]
    paths:
      - 'telecom-core/**'
      - 'frontend/app/telecom/**'
      - 'worker/src/magnanimous-telecom-runtime.js'
      - 'worker/src/magnanimous-telecom-network-runtime.js'
      - 'worker/src/magnanimous-carrier-core.js'
      - 'worker/src/lead-phone.js'
      - 'worker/src/magnanimous-telecom-service-runtime.js'
      - 'worker/src/magnanimous-telecom-operations-runtime.js'
      - 'worker/src/magnanimous-telecom-bss-admin-runtime.js'
      - 'worker/src/magnanimous-telecom-charging-runtime.js'
      - 'worker/src/magnanimous-telecom-charging-safety-guard.js'
      - 'worker/src/magnanimous-telecom-security-gate.js'
      - 'worker/src/entrypoint.js'
      - 'worker/migrations/0040_magnanimous_telecom_business.sql'
      - 'worker/migrations/0041_magnanimous_telecom_commercial_ops.sql'
      - 'worker/migrations/0042_magnanimous_sim_esim.sql'
      - 'worker/migrations/0043_magnanimous_regulated_network.sql'
      - 'worker/migrations/0044_magnanimous_telecom_retail_service_lock.sql'
      - 'worker/migrations/0045_magnanimous_telecom_oss_bss.sql'
      - 'worker/migrations/0046_magnanimous_telecom_charging_policy.sql'
      - 'worker/migrations/0047_magnanimous_telecom_charging_integrity.sql'
      - '.github/workflows/telecom-core-check.yml'
      - '.github/workflows/public-webrtc-verification.yml'
  pull_request:
    paths:
      - 'telecom-core/**'
      - 'frontend/app/telecom/**'
      - 'worker/src/magnanimous-telecom-runtime.js'
      - 'worker/src/magnanimous-telecom-network-runtime.js'
      - 'worker/src/magnanimous-carrier-core.js'
      - 'worker/src/lead-phone.js'
      - 'worker/src/magnanimous-telecom-service-runtime.js'
      - 'worker/src/magnanimous-telecom-operations-runtime.js'
      - 'worker/src/magnanimous-telecom-bss-admin-runtime.js'
      - 'worker/src/magnanimous-telecom-charging-runtime.js'
      - 'worker/src/magnanimous-telecom-charging-safety-guard.js'
      - 'worker/src/magnanimous-telecom-security-gate.js'
      - 'worker/src/entrypoint.js'
      - 'worker/migrations/0040_magnanimous_telecom_business.sql'
      - 'worker/migrations/0041_magnanimous_telecom_commercial_ops.sql'
      - 'worker/migrations/0042_magnanimous_sim_esim.sql'
      - 'worker/migrations/0043_magnanimous_regulated_network.sql'
      - 'worker/migrations/0044_magnanimous_telecom_retail_service_lock.sql'
      - 'worker/migrations/0045_magnanimous_telecom_oss_bss.sql'
      - 'worker/migrations/0046_magnanimous_telecom_charging_policy.sql'
      - 'worker/migrations/0047_magnanimous_telecom_charging_integrity.sql'
      - '.github/workflows/telecom-core-check.yml'
      - '.github/workflows/public-webrtc-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Telecom control API dependencies
        run: python -m pip install -r telecom-core/control-api/requirements.txt

      - name: Install Telecom control API dependencies
        run: python -m pip install -r telecom-core/control-api/requirements.txt

      - name: Compile Telecom API
        run: python -m py_compile telecom-core/control-api/app/main.py

      - name: Run Telecom control API unit tests
        run: python -m unittest discover -s telecom-core/control-api/tests -p 'test_*.py'

      - name: Validate Asterisk bootstrap shell
        run: sh -n telecom-core/asterisk/entrypoint.sh

      - name: Validate public Telecom host tooling
        run: |
          bash -n telecom-core/deploy/bootstrap-public-host.sh
          bash -n telecom-core/deploy/sync-public-tls.sh
          node --check telecom-core/webrtc-e2e/validate-public-target.mjs

      - name: Validate Compose model
        env:
          TELECOM_API_TOKEN: ci-token
          TELECOM_WEBHOOK_SECRET: ci-webhook
          ASTERISK_ARI_USER: ci-user
          ASTERISK_ARI_PASSWORD: ci-ari-password
          MAGNANIMOUS_AI_PASSWORD: ci-ai-password
          MAGNANIMOUS_ADMIN_PASSWORD: ci-admin-password
        run: docker compose -f telecom-core/docker-compose.yml config -q

      - name: Build Telecom API image
        run: docker build -t magnanimous-telecom-api:ci telecom-core/control-api

      - name: Validate Worker Telecom runtimes
        run: |
          node --check worker/src/magnanimous-telecom-runtime.js
          node --check worker/src/magnanimous-telecom-network-runtime.js
          node --check worker/src/magnanimous-carrier-core.js
          node --check worker/src/lead-phone.js
          node --check worker/src/magnanimous-telecom-service-runtime.js
          node --check worker/src/magnanimous-telecom-operations-runtime.js
          node --check worker/src/magnanimous-telecom-bss-admin-runtime.js
          node --check worker/src/magnanimous-telecom-charging-runtime.js
          node --check worker/src/magnanimous-telecom-charging-safety-guard.js
          node --check worker/src/magnanimous-telecom-security-gate.js
          node --check worker/src/entrypoint.js

      - name: Validate Telecom schema foundations
        run: |
          grep -q 'telecom_numbers' worker/migrations/0040_magnanimous_telecom_business.sql
          grep -q 'telecom_service_plans' worker/migrations/0041_magnanimous_telecom_commercial_ops.sql
          grep -q 'telecom_fraud_controls' worker/migrations/0041_magnanimous_telecom_commercial_ops.sql
          grep -q 'telecom_audit_log' worker/migrations/0041_magnanimous_telecom_commercial_ops.sql
          grep -q 'telecom_sim_inventory' worker/migrations/0042_magnanimous_sim_esim.sql
          grep -q 'telecom_esim_orders' worker/migrations/0042_magnanimous_sim_esim.sql
          grep -q 'telecom_mobile_adapters' worker/migrations/0042_magnanimous_sim_esim.sql
          grep -q 'telecom_network_providers' worker/migrations/0043_magnanimous_regulated_network.sql
          grep -q 'telecom_regulatory_cases' worker/migrations/0043_magnanimous_regulated_network.sql
          grep -q 'telecom_network_events' worker/migrations/0043_magnanimous_regulated_network.sql
          grep -q 'telecom_provider_policy' worker/migrations/0044_magnanimous_telecom_retail_service_lock.sql
          grep -q 'telecom_retail_plans' worker/migrations/0044_magnanimous_telecom_retail_service_lock.sql
          grep -q 'telecom_customer_lines' worker/migrations/0044_magnanimous_telecom_retail_service_lock.sql
          grep -q 'telecom_usage_cycles' worker/migrations/0044_magnanimous_telecom_retail_service_lock.sql
          grep -q 'telecom_offer_extensions' worker/migrations/0045_magnanimous_telecom_oss_bss.sql
          grep -q 'telecom_balance_buckets' worker/migrations/0045_magnanimous_telecom_oss_bss.sql
          grep -q 'telecom_usage_events' worker/migrations/0045_magnanimous_telecom_oss_bss.sql
          grep -q 'telecom_rating_entries' worker/migrations/0045_magnanimous_telecom_oss_bss.sql
          grep -q 'telecom_service_orders' worker/migrations/0045_magnanimous_telecom_oss_bss.sql
          grep -q 'telecom_trouble_tickets' worker/migrations/0045_magnanimous_telecom_oss_bss.sql
          grep -q 'telecom_network_functions' worker/migrations/0045_magnanimous_telecom_oss_bss.sql
          grep -q 'telecom_routing_policies' worker/migrations/0045_magnanimous_telecom_oss_bss.sql
          grep -q 'telecom_fraud_cases' worker/migrations/0045_magnanimous_telecom_oss_bss.sql
          grep -q 'telecom_architecture_patterns' worker/migrations/0045_magnanimous_telecom_oss_bss.sql
          grep -q 'telecom_charging_sessions' worker/migrations/0046_magnanimous_telecom_charging_policy.sql
          grep -q 'telecom_balance_reservations' worker/migrations/0046_magnanimous_telecom_charging_policy.sql
          grep -q 'telecom_balance_transactions' worker/migrations/0046_magnanimous_telecom_charging_policy.sql
          grep -q 'telecom_balance_groups' worker/migrations/0046_magnanimous_telecom_charging_policy.sql
          grep -q 'telecom_policy_profiles' worker/migrations/0046_magnanimous_telecom_charging_policy.sql
          grep -q 'telecom_policy_decisions' worker/migrations/0046_magnanimous_telecom_charging_policy.sql
          grep -q 'telecom_devices' worker/migrations/0046_magnanimous_telecom_charging_policy.sql
          grep -q 'telecom_apn_profiles' worker/migrations/0046_magnanimous_telecom_charging_policy.sql
          grep -q 'telecom_sim_registration_state' worker/migrations/0046_magnanimous_telecom_charging_policy.sql
          grep -q 'telecom_rate_decks' worker/migrations/0046_magnanimous_telecom_charging_policy.sql
          grep -q 'telecom_rate_rules' worker/migrations/0046_magnanimous_telecom_charging_policy.sql
          grep -q 'telecom_invoices' worker/migrations/0046_magnanimous_telecom_charging_policy.sql
          grep -q 'trg_telecom_partial_commit_release_ledger' worker/migrations/0047_magnanimous_telecom_charging_integrity.sql
          grep -q "'partial-release:' || NEW.charging_session_id" worker/migrations/0047_magnanimous_telecom_charging_integrity.sql
          grep -q 'The application MUST NOT generate, clone, copy or store raw Ki' telecom-core/SIM_ESIM.md

      - name: Validate consequential action locks
        run: |
          grep -q 'TELECOM_PURCHASE_ACTIONS_ENABLED' worker/src/magnanimous-telecom-network-runtime.js
          grep -q 'confirm_purchase' worker/src/magnanimous-telecom-network-runtime.js
          grep -q 'TELECOM_REGULATED_ACTIONS_ENABLED' worker/src/magnanimous-telecom-network-runtime.js
          grep -q 'confirm_regulated_action' worker/src/magnanimous-telecom-network-runtime.js
          grep -q 'Software readiness is not regulatory authority' worker/src/magnanimous-telecom-network-runtime.js
          grep -q 'confirm_sim_swap_security_review' worker/src/magnanimous-telecom-security-gate.js
          grep -q 'identity_verification_reference' worker/src/magnanimous-telecom-security-gate.js
          grep -q 'confirm_port_out_authorization' worker/src/magnanimous-telecom-security-gate.js
          grep -q 'porting_authorization_reference' worker/src/magnanimous-telecom-security-gate.js
          grep -q 'purchase_action:false' worker/src/magnanimous-telecom-charging-runtime.js
          grep -q 'public_network_action:false' worker/src/magnanimous-telecom-charging-runtime.js
          grep -q 'This runtime does not charge or purchase funds' worker/src/magnanimous-telecom-charging-runtime.js
          grep -q 'Number.isFinite' worker/src/magnanimous-telecom-charging-safety-guard.js
          grep -q 'commitPath=path.match' worker/src/magnanimous-telecom-charging-safety-guard.js
          grep -q 'roaming_requires_explicit_plan_and_line_permission' worker/src/magnanimous-telecom-charging-safety-guard.js
          grep -q 'international_requires_explicit_plan_line_and_fraud_permission' worker/src/magnanimous-telecom-charging-safety-guard.js
          grep -q 'premium_rate_requires_explicit_plan_and_fraud_permission' worker/src/magnanimous-telecom-charging-safety-guard.js
          grep -q 'internal_rate_quote_required' worker/src/magnanimous-telecom-charging-safety-guard.js
          grep -q 'public_network_action:false' worker/src/magnanimous-telecom-bss-admin-runtime.js
          grep -q 'network_activation_performed:false' worker/src/magnanimous-telecom-bss-admin-runtime.js
          grep -q 'raw_identity_documents_stored:false' worker/src/magnanimous-telecom-bss-admin-runtime.js

      - name: Validate no-white-label Telecom lock
        run: |
          grep -q "white_label_allowed INTEGER NOT NULL DEFAULT 0 CHECK(white_label_allowed=0)" worker/migrations/0044_magnanimous_telecom_retail_service_lock.sql
          grep -q "reseller_allowed INTEGER NOT NULL DEFAULT 0 CHECK(reseller_allowed=0)" worker/migrations/0044_magnanimous_telecom_retail_service_lock.sql
          grep -q "subcarrier_allowed INTEGER NOT NULL DEFAULT 0 CHECK(subcarrier_allowed=0)" worker/migrations/0044_magnanimous_telecom_retail_service_lock.sql
          grep -q "customer_number_resale_allowed INTEGER NOT NULL DEFAULT 0 CHECK(customer_number_resale_allowed=0)" worker/migrations/0044_magnanimous_telecom_retail_service_lock.sql
          grep -q "provider_identity TEXT NOT NULL DEFAULT 'Magnanimous Telecom' CHECK(provider_identity='Magnanimous Telecom')" worker/migrations/0044_magnanimous_telecom_retail_service_lock.sql
          grep -q "brain_identity TEXT NOT NULL DEFAULT 'Magnanimous AI' CHECK(brain_identity='Magnanimous AI')" worker/migrations/0044_magnanimous_telecom_retail_service_lock.sql
          grep -q "white-label, reseller, sub-carrier" worker/src/magnanimous-telecom-service-runtime.js
          grep -q "customer-created phone company" worker/src/magnanimous-telecom-service-runtime.js
          grep -q 'retailLock' worker/src/magnanimous-telecom-charging-runtime.js
          grep -q 'external_provider_brand_override_allowed' worker/src/magnanimous-telecom-bss-admin-runtime.js

      - name: Validate absorbed carrier operations model
        run: |
          grep -q 'Normalize usage before rating/billing' worker/src/magnanimous-telecom-operations-runtime.js
          grep -q 'GSMA eSIM Consumer' worker/src/magnanimous-telecom-operations-runtime.js
          grep -q 'carrier-grade OSS/BSS orchestration' worker/src/magnanimous-telecom-operations-runtime.js
          grep -q 'reserve_commit_release' worker/src/magnanimous-telecom-charging-runtime.js
          grep -q 'fair_use_threshold' worker/src/magnanimous-telecom-charging-runtime.js
          grep -q 'sim_registration_not_verified' worker/src/magnanimous-telecom-charging-runtime.js
          grep -q 'rate-quote' worker/src/magnanimous-telecom-bss-admin-runtime.js
          grep -q 'destination_prefix' worker/src/magnanimous-telecom-bss-admin-runtime.js
          grep -q 'Mobile core lab' frontend/app/telecom/operations/page.tsx
          grep -q 'Future mobile core: lab first' frontend/app/telecom/operations/page.tsx
          grep -q 'Real-Time' frontend/app/telecom/charging/page.tsx
          grep -q 'Starter node' telecom-core/RESEARCH_ABSORPTION.md
          grep -q 'Internal rate decks and billing units' telecom-core/RESEARCH_ABSORPTION.md

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Typecheck standalone Telecom dashboard
        working-directory: frontend
        run: npm run typecheck

      - name: Build production frontend assets
        working-directory: frontend
        run: npm run build

      - name: Lock Magnanimous identity contract
        run: |
          grep -q 'Magnanimous Telecom' frontend/app/telecom/page.tsx
          grep -q 'Magnanimous AI' frontend/app/telecom/page.tsx
          grep -q 'Plans & Subscriptions' frontend/app/telecom/page.tsx
          grep -q 'Carrier Operations' frontend/app/telecom/page.tsx
          grep -q 'White-label / reseller telecom: locked off' frontend/app/telecom/page.tsx
          grep -q 'Telecom is intentionally excluded from white labeling' frontend/app/telecom/plans/page.tsx
          grep -q 'SIM + eSIM Control' frontend/app/telecom/page.tsx
          grep -q 'Carrier Access' frontend/app/telecom/page.tsx
          grep -q 'Magnanimous remains the public identity' frontend/app/telecom/network/page.tsx
          grep -q 'Magnanimous Telecom stays the provider' frontend/app/telecom/charging/page.tsx
          grep -q 'outside networks stay replaceable and internal' frontend/app/telecom/charging/page.tsx
          grep -q 'integrated-and-standalone' worker/src/magnanimous-telecom-runtime.js
          grep -q 'MOBILE_PROVISIONER_URL' worker/src/magnanimous-telecom-runtime.js
          grep -q 'TELECOM_EMERGENCY_LIVE' telecom-core/STANDALONE.md
          grep -q 'Provider-search result' telecom-core/REGULATED_NETWORK.md

name: Magnanimous Telecom Core Verification

on:
  push:
    branches: [main]
    paths:
      - 'telecom-core/**'
      - 'frontend/app/telecom/**'
      - 'worker/src/magnanimous-telecom-runtime.js'
      - 'worker/src/entrypoint.js'
      - 'worker/migrations/0040_magnanimous_telecom_business.sql'
      - 'worker/migrations/0041_magnanimous_telecom_commercial_ops.sql'
      - 'worker/migrations/0042_magnanimous_sim_esim.sql'
      - '.github/workflows/telecom-core-check.yml'
  pull_request:
    paths:
      - 'telecom-core/**'
      - 'frontend/app/telecom/**'
      - 'worker/src/magnanimous-telecom-runtime.js'
      - 'worker/src/entrypoint.js'
      - 'worker/migrations/0040_magnanimous_telecom_business.sql'
      - 'worker/migrations/0041_magnanimous_telecom_commercial_ops.sql'
      - 'worker/migrations/0042_magnanimous_sim_esim.sql'
      - '.github/workflows/telecom-core-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Compile Telecom API
        run: python -m py_compile telecom-core/control-api/app/main.py

      - name: Validate Asterisk bootstrap shell
        run: sh -n telecom-core/asterisk/entrypoint.sh

      - name: Validate Compose model
        env:
          TELECOM_API_TOKEN: ci-token
          TELECOM_WEBHOOK_SECRET: ci-webhook
          ASTERISK_ARI_USER: ci-user
          ASTERISK_ARI_PASSWORD: ci-ari-password
          MAGNANIMOUS_AI_PASSWORD: ci-ai-password
          MAGNANIMOUS_ADMIN_PASSWORD: ci-admin-password
        run: docker compose -f telecom-core/docker-compose.yml config -q

      - name: Build Telecom API image
        run: docker build -t magnanimous-telecom-api:ci telecom-core/control-api

      - name: Validate Worker Telecom runtime
        run: |
          node --check worker/src/magnanimous-telecom-runtime.js
          node --check worker/src/entrypoint.js

      - name: Validate Telecom schema foundations
        run: |
          grep -q 'telecom_numbers' worker/migrations/0040_magnanimous_telecom_business.sql
          grep -q 'telecom_service_plans' worker/migrations/0041_magnanimous_telecom_commercial_ops.sql
          grep -q 'telecom_fraud_controls' worker/migrations/0041_magnanimous_telecom_commercial_ops.sql
          grep -q 'telecom_audit_log' worker/migrations/0041_magnanimous_telecom_commercial_ops.sql
          grep -q 'telecom_sim_inventory' worker/migrations/0042_magnanimous_sim_esim.sql
          grep -q 'telecom_esim_orders' worker/migrations/0042_magnanimous_sim_esim.sql
          grep -q 'telecom_mobile_adapters' worker/migrations/0042_magnanimous_sim_esim.sql
          grep -q 'The application MUST NOT generate, clone, copy or store raw Ki' telecom-core/SIM_ESIM.md

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Typecheck standalone Telecom dashboard
        working-directory: frontend
        run: npm run typecheck

      - name: Build production frontend assets
        working-directory: frontend
        run: npm run build

      - name: Lock Magnanimous identity contract
        run: |
          grep -q 'Magnanimous Telecom' frontend/app/telecom/page.tsx
          grep -q 'Magnanimous AI' frontend/app/telecom/page.tsx
          grep -q 'SIM + eSIM Control' frontend/app/telecom/page.tsx
          grep -q 'integrated-and-standalone' worker/src/magnanimous-telecom-runtime.js
          grep -q 'MOBILE_PROVISIONER_URL' worker/src/magnanimous-telecom-runtime.js
          grep -q 'TELECOM_EMERGENCY_LIVE' telecom-core/STANDALONE.md

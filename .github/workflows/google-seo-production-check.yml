name: Google SEO Production Verification

on:
  workflow_run:
    workflows: ["Build and Deploy I AM"]
    types: [completed]

jobs:
  verify-google-seo:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify branded sitemap, crawlable public pages, trust content and reviews
        shell: bash
        env:
          SITE: https://iammagnanimousway.com
        run: |
          set -euo pipefail

          must_contain() {
            local file="$1" needle="$2" label="$3"
            grep -qi "$needle" "$file" || { echo "Missing expected production content: $label"; exit 1; }
            echo "Verified: $label"
          }

          status=$(curl -LsS -o /tmp/home.html -w '%{http_code}' "$SITE/")
          [ "$status" = "200" ] || { echo "Branded production homepage returned $status"; exit 1; }
          must_contain /tmp/home.html "I AM Magnanimous Way" "branded homepage"

          status=$(curl -LsS -o /tmp/solutions.html -w '%{http_code}' "$SITE/solutions/")
          [ "$status" = "200" ] || { echo "Solutions page returned $status"; exit 1; }
          must_contain /tmp/solutions.html "I AM Operator" "I AM Operator positioning"
          must_contain /tmp/solutions.html "Run the business" "operator-led Solutions hero"
          if grep -qi "Opening secure access" /tmp/solutions.html; then echo "Solutions is still exposing the secure-loading shell to crawlers"; exit 1; fi
          if grep -qi "0 providers ready" /tmp/solutions.html; then echo "Public Solutions page exposes provider diagnostics"; exit 1; fi
          echo "Verified: Solutions is crawlable without secure-loading/provider-diagnostic copy"

          status=$(curl -LsS -o /tmp/security.html -w '%{http_code}' "$SITE/security/")
          [ "$status" = "200" ] || { echo "Data & Security page returned $status"; exit 1; }
          must_contain /tmp/security.html "Trust should be understandable" "Data & Security page"
          must_contain /tmp/security.html "Workspace isolation" "workspace-isolation trust content"

          status=$(curl -LsS -o /tmp/robots.txt -w '%{http_code}' "$SITE/robots.txt")
          [ "$status" = "200" ] || { echo "robots.txt returned $status"; exit 1; }
          must_contain /tmp/robots.txt "Sitemap: https://iammagnanimousway.com/sitemap.xml" "sitemap declaration"
          must_contain /tmp/robots.txt "Disallow: /ai-chat/" "AI workspace crawl boundary"
          must_contain /tmp/robots.txt "Disallow: /crm/" "CRM crawl boundary"

          status=$(curl -LsS -o /tmp/sitemap.xml -w '%{http_code}' "$SITE/sitemap.xml")
          [ "$status" = "200" ] || { echo "sitemap.xml returned $status"; exit 1; }
          must_contain /tmp/sitemap.xml "https://iammagnanimousway.com/solutions/" "Solutions sitemap entry"
          must_contain /tmp/sitemap.xml "https://iammagnanimousway.com/security/" "Data & Security sitemap entry"
          must_contain /tmp/sitemap.xml "https://iammagnanimousway.com/reviews/" "Reviews sitemap entry"
          must_contain /tmp/sitemap.xml "https://iammagnanimousway.com/free-tools/" "Free Tools sitemap entry"
          must_contain /tmp/sitemap.xml "https://iammagnanimousway.com/ai-apps/" "AI Apps sitemap entry"

          status=$(curl -LsS -o /tmp/reviews.html -w '%{http_code}' "$SITE/reviews/")
          [ "$status" = "200" ] || { echo "Reviews page returned $status"; exit 1; }
          must_contain /tmp/reviews.html "Reviews" "Reviews page"
          must_contain /tmp/reviews.html "I AM Magnanimous Way" "Reviews branding"

          status=$(curl -LsS -o /tmp/reviews.json -w '%{http_code}' "$SITE/api/support/reviews")
          [ "$status" = "200" ] || { echo "Public reviews API returned $status"; cat /tmp/reviews.json; exit 1; }
          python - <<'PY'
          import json
          data=json.load(open('/tmp/reviews.json'))
          assert data.get('moderated') is True, data
          assert isinstance(data.get('reviews'), list), data
          assert isinstance(data.get('summary'), dict), data
          PY
          echo "Verified: moderated public reviews API"

          status=$(curl -LsS -o /tmp/health.json -w '%{http_code}' "$SITE/health")
          [ "$status" = "200" ] || { echo "Production health returned $status"; cat /tmp/health.json; exit 1; }

          echo "Public crawlability, I AM Operator positioning, Data & Security, protected-route robots, reviews API and health passed."

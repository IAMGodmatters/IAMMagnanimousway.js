name: Magnanimous Python Security Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'video-renderer/requirements.txt'
      - 'telecom-core/control-api/requirements.txt'
      - '.github/workflows/magnanimous-python-security-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - video-renderer/requirements.txt
          - telecom-core/control-api/requirements.txt
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install audited wheels without running source builds
        shell: bash
        env:
          REQUIREMENTS: ${{ matrix.requirements }}
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: -r "$REQUIREMENTS"
          python -m pip check
      - name: Verify framework API availability
        shell: bash
        run: |
          python - <<'PY'
          import fastapi,starlette,anyio,uvicorn
          from fastapi import FastAPI, Depends, Header, HTTPException, WebSocket, Request
          from starlette.responses import JSONResponse, StreamingResponse
          from starlette.middleware.cors import CORSMiddleware
          import asyncio
          app=FastAPI()
          @app.get('/health')
          def health(): return {'ok': True}
          messages=[]
          async def receive(): return {'type':'http.request','body':b'','more_body':False}
          async def send(message): messages.append(message)
          async def exercise():
              await app({
                  'type':'http','asgi':{'version':'3.0'},'http_version':'1.1',
                  'method':'GET','scheme':'http','path':'/health','raw_path':b'/health',
                  'query_string':b'','root_path':'','headers':[],
                  'client':('127.0.0.1',1234),'server':('test.local',80)
              },receive,send)
          asyncio.run(exercise())
          assert any(x.get('type')=='http.response.start' and x.get('status')==200 for x in messages)
          assert any(x.get('type')=='http.response.body' and b'"ok":true' in x.get('body',b'') for x in messages)
          print('Python dependencies and framework smoke PASS:',fastapi.__version__,starlette.__version__)
          PY
      - name: Import the actual service entrypoint
        shell: bash
        env:
          REQUIREMENTS: ${{ matrix.requirements }}
        run: |
          set -euo pipefail
          if [[ "$REQUIREMENTS" == 'video-renderer/requirements.txt' ]]; then
            PYTHONPATH=video-renderer python -c "from server import app; assert app.title == 'I AM Magnanimous Free Video Renderer'; print('Real video renderer import PASS')"
          else
            PYTHONPATH=telecom-core/control-api python -c "from app.main import app; assert app.title == 'Magnanimous Telecom Core'; print('Real Telecom Core import PASS')"
          fi

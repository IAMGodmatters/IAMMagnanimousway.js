name: Webhook Security Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  webhook-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify webhook signature, replay and idempotency contracts
        run: node qa/scripts/webhook-security-lock.mjs
      - name: Verify Worker syntax
        run: |
          node --check worker/src/carrier-webhook-security.js
          node --check worker/src/session-authority.js
          node --check worker/src/security-entrypoint.js

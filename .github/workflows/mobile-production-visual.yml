name: Mobile Production Visual Verification

on:
  workflow_run:
    workflows: ['Build and Deploy I AM']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-mobile:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live phone and desktop compositions
        shell: bash
        env:
          LIVE_URL: https://iammagnanimousway.com/
          APPROVED_MOBILE_GIT_BLOB: 1b894696ed7bcdc1613c93d36e29fa2210acaad3
          APPROVED_DESKTOP_SHA256: 4782F5011B660DC4A189B1A2A315352C241CAD40C4800AD2A5C78949837EC548
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [ -n "$chrome" ] || { echo '::error::Chrome/Chromium is not available on the hosted runner.'; exit 1; }
          mkdir -p mobile-visual-proof

          curl -fsSL --retry 3 --retry-delay 2 \
            -D mobile-visual-proof/mobile-approved.headers \
            -o mobile-visual-proof/mobile-dashboard-approved.webp \
            "${LIVE_URL}mobile-dashboard-approved.webp?lock=${APPROVED_MOBILE_GIT_BLOB}&verify=${GITHUB_RUN_ID}"
          magic="$(head -c 12 mobile-visual-proof/mobile-dashboard-approved.webp | xxd -p -c 12 || true)"
          [[ "$magic" == 52494646*57454250 ]] || { echo '::error::Live approved mobile artwork is not a valid WebP.'; exit 1; }
          mobile_bytes="$(stat -c%s mobile-visual-proof/mobile-dashboard-approved.webp)"
          actual_mobile_blob="$( { printf 'blob %s\0' "$mobile_bytes"; cat mobile-visual-proof/mobile-dashboard-approved.webp; } | sha1sum | awk '{print $1}')"
          [ "$actual_mobile_blob" = "$APPROVED_MOBILE_GIT_BLOB" ] || { echo "::error::Live mobile artwork changed: ${actual_mobile_blob}."; exit 1; }

          curl -fsSL --retry 3 --retry-delay 2 \
            -o mobile-visual-proof/crm-upgrade.jpeg \
            "${LIVE_URL}crm-upgrade.jpeg?verify=${GITHUB_RUN_ID}"
          actual_desktop_sha256="$(sha256sum mobile-visual-proof/crm-upgrade.jpeg | awk '{print toupper($1)}')"
          [ "$actual_desktop_sha256" = "$APPROVED_DESKTOP_SHA256" ] || { echo "::error::Live desktop artwork changed: ${actual_desktop_sha256}."; exit 1; }

          render() {
            local width="$1" height="$2" name="$3" budget="$4"
            timeout 90s "$chrome" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --disable-dev-shm-usage \
              --window-size="${width},${height}" \
              --virtual-time-budget="$budget" \
              --screenshot="mobile-visual-proof/${name}.png" \
              --dump-dom \
              "${LIVE_URL}?mobile_visual_verify=${GITHUB_RUN_ID}_${name}" \
              > "mobile-visual-proof/${name}.html" 2> "mobile-visual-proof/${name}.log" || {
                cat "mobile-visual-proof/${name}.log" || true
                exit 1
              }
          }

          render 390 844 phone-390x844 12000
          render 430 932 phone-430x932 12000
          render 1440 900 desktop-1440x900 10000

          for phone in phone-390x844 phone-430x932; do
            grep -q 'mobileExactStage' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing the canonical mobile dashboard."; exit 1; }
            grep -q 'mobileReferenceFrame' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing the portrait reference frame."; exit 1; }
            grep -q '/mobile-dashboard-approved.webp' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} no longer uses the approved portrait artwork."; exit 1; }
            if grep -q '/mobile-dashboard-fallback.svg' "mobile-visual-proof/${phone}.html"; then echo "::error::${phone} still exposes the rejected substitute fallback artwork."; exit 1; fi
            grep -q 'Video Studio' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing Video Studio."; exit 1; }
            grep -q 'White Label' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing White Label."; exit 1; }
            grep -q 'Creator Studio' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing Creator Studio."; exit 1; }
            grep -q 'Growth' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing Growth."; exit 1; }
            grep -q 'Opportunity Vault' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing Opportunity Vault."; exit 1; }
            grep -q 'Professional Business' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing Professional Business."; exit 1; }
            grep -q 'mobileBottomMore' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing the approved bottom navigation."; exit 1; }
            grep -q 'id="mobile-side-menu"' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing the collapsible menu."; exit 1; }
            [ -s "mobile-visual-proof/${phone}.png" ] || { echo "::error::${phone} screenshot was not produced."; exit 1; }
            bytes="$(stat -c%s "mobile-visual-proof/${phone}.png")"
            [ "$bytes" -ge 50000 ] || { echo "::error::${phone} screenshot is only ${bytes} bytes and is likely not the approved detailed artwork."; exit 1; }
          done

          grep -q 'desktopStage' mobile-visual-proof/desktop-1440x900.html || { echo '::error::Approved desktop dashboard marker is missing.'; exit 1; }
          grep -q '/crm-upgrade.jpeg' mobile-visual-proof/desktop-1440x900.html || { echo '::error::Desktop approved artwork source is missing.'; exit 1; }
          [ -s mobile-visual-proof/desktop-1440x900.png ] || { echo '::error::Desktop verification screenshot was not produced.'; exit 1; }

          echo 'Locked artwork verification PASS: production serves the exact approved mobile blob and exact approved desktop SHA-256, with working responsive controls.'

      - name: Upload responsive visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-production-visual-proof-${{ github.run_id }}
          path: mobile-visual-proof/
          retention-days: 14

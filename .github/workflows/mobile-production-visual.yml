name: Mobile Production Visual Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-production-visual.yml'
  workflow_run:
    workflows: ['Build and Deploy I AM']
    types: [completed]

permissions:
  contents: read

jobs:
  verify-live-mobile:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live phone and desktop compositions
        shell: bash
        env:
          LIVE_URL: https://iammagnanimousway.com/
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [ -n "$chrome" ] || { echo '::error::Chrome/Chromium is not available on the hosted runner.'; exit 1; }
          mkdir -p mobile-visual-proof

          render() {
            local width="$1" height="$2" name="$3" budget="$4"
            timeout 90s "$chrome" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --disable-dev-shm-usage \
              --window-size="${width},${height}" \
              --virtual-time-budget="$budget" \
              --screenshot="mobile-visual-proof/${name}.png" \
              --dump-dom \
              "${LIVE_URL}?mobile_visual_verify=${GITHUB_RUN_ID}_${name}" \
              > "mobile-visual-proof/${name}.html" 2> "mobile-visual-proof/${name}.log" || {
                cat "mobile-visual-proof/${name}.log" || true
                exit 1
              }
          }

          render 390 844 phone-390x844 12000
          render 430 932 phone-430x932 12000
          render 1440 900 desktop-1440x900 10000

          for phone in phone-390x844 phone-430x932; do
            grep -q 'mobileExactStage' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing the exact portrait mobile dashboard."; exit 1; }
            grep -q 'mobileReferenceArtwork' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing the approved portrait artwork element."; exit 1; }
            grep -q '/mobile-dashboard-approved.webp' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is not using the literal approved portrait artwork."; exit 1; }
            grep -q 'mobileCardGrid' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing the two-column module hotspot grid."; exit 1; }
            grep -q 'mobileBottomNav' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing the five-item bottom navigation."; exit 1; }
            for label in 'Video Studio' 'White Label' 'Creator Studio' 'Growth' 'Opportunity Vault' 'Professional Business' 'Command' 'Social Studio' 'Virtual Assistant' 'Reports'; do
              grep -q "$label" "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing ${label}."; exit 1; }
            done
            grep -q 'aria-label="Search Magnanimous AI"' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing clickable mobile search."; exit 1; }
            grep -q 'aria-label="Open owner profile"' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing the owner/profile hotspot."; exit 1; }
            grep -q 'aria-label="Open notifications and reports"' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing the notifications hotspot."; exit 1; }
            grep -q 'aria-label="Watch platform tutorial"' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing the tutorial hotspot."; exit 1; }
            grep -q 'id="mobile-side-menu"' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing the collapsible menu."; exit 1; }
            [ -s "mobile-visual-proof/${phone}.png" ] || { echo "::error::${phone} screenshot was not produced."; exit 1; }
          done

          grep -q 'desktopStage' mobile-visual-proof/desktop-1440x900.html || { echo '::error::Approved desktop dashboard marker is missing.'; exit 1; }
          grep -q '/crm-upgrade.jpeg' mobile-visual-proof/desktop-1440x900.html || { echo '::error::Desktop approved artwork source is missing.'; exit 1; }
          if grep -q '/mobile-dashboard-approved.webp' mobile-visual-proof/desktop-1440x900.html; then
            echo '::error::Desktop hydrated the mobile portrait artwork; desktop isolation failed.'
            exit 1
          fi
          [ -s mobile-visual-proof/desktop-1440x900.png ] || { echo '::error::Desktop verification screenshot was not produced.'; exit 1; }

          echo 'Live responsive verification PASS: 390x844 and 430x932 use the literal approved portrait dashboard with interactive controls while desktop retains its approved artwork.'

      - name: Upload responsive visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-production-visual-proof-${{ github.run_id }}
          path: mobile-visual-proof/
          retention-days: 14

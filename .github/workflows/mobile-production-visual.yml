name: Mobile Production Visual Verification

on:
  workflow_run:
    workflows: ['Build and Deploy I AM']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-mobile:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify live phone and desktop compositions
        shell: bash
        env:
          LIVE_URL: https://iammagnanimousway.com/
          APPROVED_MOBILE_GIT_BLOB: 65036a811159196e6fe1789760db162e901cf4fa
          SHARP_MOBILE_GIT_BLOB: b355bb1821555513c28786a19ec3be202f75575f
          CLEAR_MOBILE_SHA256: 7939b2bd5f404c9378f3cd745dc1448c6bd00d0b799fdbd93ae2ee8c276babaa
          APPROVED_DESKTOP_SHA256: 4782F5011B660DC4A189B1A2A315352C241CAD40C4800AD2A5C78949837EC548
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [ -n "$chrome" ] || { echo '::error::Chrome/Chromium is not available on the hosted runner.'; exit 1; }
          mkdir -p mobile-visual-proof

          curl -fsSL --retry 3 --retry-delay 2 \
            -D mobile-visual-proof/mobile-approved.headers \
            -o mobile-visual-proof/mobile-dashboard-approved.webp \
            "${LIVE_URL}mobile-dashboard-approved.webp?lock=${APPROVED_MOBILE_GIT_BLOB}&verify=${GITHUB_RUN_ID}"
          magic="$(head -c 12 mobile-visual-proof/mobile-dashboard-approved.webp | xxd -p -c 12 || true)"
          [[ "$magic" == 52494646*57454250 ]] || { echo '::error::Live approved mobile fallback is not a valid WebP.'; exit 1; }
          mobile_bytes="$(stat -c%s mobile-visual-proof/mobile-dashboard-approved.webp)"
          actual_mobile_blob="$( { printf 'blob %s\0' "$mobile_bytes"; cat mobile-visual-proof/mobile-dashboard-approved.webp; } | sha1sum | awk '{print $1}')"
          [ "$actual_mobile_blob" = "$APPROVED_MOBILE_GIT_BLOB" ] || { echo "::error::Live mobile fallback changed: ${actual_mobile_blob}."; exit 1; }

          curl -fsSL --retry 3 --retry-delay 2 \
            -D mobile-visual-proof/mobile-sharp.headers \
            -o mobile-visual-proof/mobile-dashboard-approved-sharp.webp \
            "${LIVE_URL}mobile-dashboard-approved-sharp.webp?lock=${SHARP_MOBILE_GIT_BLOB}&verify=${GITHUB_RUN_ID}"
          sharp_magic="$(head -c 12 mobile-visual-proof/mobile-dashboard-approved-sharp.webp | xxd -p -c 12 || true)"
          [[ "$sharp_magic" == 52494646*57454250 ]] || { echo '::error::Live sharp mobile enhancement is not a valid WebP.'; exit 1; }
          sharp_bytes="$(stat -c%s mobile-visual-proof/mobile-dashboard-approved-sharp.webp)"
          actual_sharp_blob="$( { printf 'blob %s\0' "$sharp_bytes"; cat mobile-visual-proof/mobile-dashboard-approved-sharp.webp; } | sha1sum | awk '{print $1}')"
          [ "$actual_sharp_blob" = "$SHARP_MOBILE_GIT_BLOB" ] || { echo "::error::Live sharp mobile enhancement changed: ${actual_sharp_blob}."; exit 1; }
          
          curl -fsSL --retry 3 --retry-delay 2 \
            -o mobile-visual-proof/mobile-dashboard-approved-clear.jpeg \
            "${LIVE_URL}mobile-dashboard-approved-clear.jpeg?verify=${GITHUB_RUN_ID}"
          actual_clear_sha256="$(sha256sum mobile-visual-proof/mobile-dashboard-approved-clear.jpeg | awk '{print $1}')"
          [ "$actual_clear_sha256" = "$CLEAR_MOBILE_SHA256" ] || { echo "::error::Live clear original mobile artwork is missing or modified: ${actual_clear_sha256}."; exit 1; }

          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name in ['mobile-dashboard-approved.webp','mobile-dashboard-approved-sharp.webp']:
              data=(Path('mobile-visual-proof')/name).read_bytes()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP', name
              assert struct.unpack_from('<I',data,4)[0]+8==len(data), (name,'RIFF length',len(data))
              off=12
              while off<len(data):
                  assert off+8<=len(data), (name,'truncated chunk header',off)
                  size=struct.unpack_from('<I',data,off+4)[0]
                  end=off+8+size
                  assert end<=len(data), (name,'truncated chunk payload',off,size,len(data))
                  off=end+(size&1)
              assert off==len(data), (name,'chunk boundary',off,len(data))
          PY

          # The files above were downloaded from LIVE_URL and checked against locked Git blobs/SHA256.
          # Decode those exact production bytes locally: file:// pages fetching remote HTTPS
          # can hang in headless Chromium and create false negatives despite intact artwork.
          cat > mobile-visual-proof/decode-check.html <<EOF
          <!doctype html><html><body data-fallback="pending" data-sharp="pending" data-clear="pending">
          <img id="fallback" src="mobile-dashboard-approved.webp" alt="">
          <img id="sharp" src="mobile-dashboard-approved-sharp.webp" alt="">
          <img id="clear" src="mobile-dashboard-approved-clear.jpeg" alt="">
          <script>
          const mark=(id,key)=>{const img=document.getElementById(id);const done=()=>document.body.setAttribute('data-'+key,img.complete&&img.naturalWidth?img.naturalWidth+'x'+img.naturalHeight:'error');img.addEventListener('load',done,{once:true});img.addEventListener('error',done,{once:true});if(img.complete)done()};
          mark('fallback','fallback');mark('sharp','sharp');mark('clear','clear');
          </script></body></html>
          EOF
          decoded=false
          for attempt in 1 2; do
            if timeout 75s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-extensions --no-first-run --allow-file-access-from-files --user-data-dir="$RUNNER_TEMP/magnanimous-chrome-decode-${GITHUB_RUN_ID}-${attempt}" --virtual-time-budget=8000 --dump-dom "file://$(pwd)/mobile-visual-proof/decode-check.html" > mobile-visual-proof/decode-check.dom 2> mobile-visual-proof/decode-check.log; then
              decoded=true
              break
            fi
            echo "::warning::Browser decode attempt ${attempt} failed or timed out; retrying with a new isolated Chrome profile when available."
          done
          if [ "$decoded" != true ]; then
            echo '::error::Chrome failed to decode verified artwork after two bounded attempts.'
            cat mobile-visual-proof/decode-check.log || true
            exit 1
          fi
          grep -q 'data-fallback="320x569"' mobile-visual-proof/decode-check.dom || { echo '::error::Chrome could not decode the known-working 320x569 mobile fallback.'; cat mobile-visual-proof/decode-check.dom; exit 1; }
          grep -q 'data-sharp="1296x2304"' mobile-visual-proof/decode-check.dom || { echo '::error::Chrome could not decode the 1296x2304 sharp mobile enhancement.'; cat mobile-visual-proof/decode-check.dom; exit 1; }
          grep -q 'data-clear="864x1536"' mobile-visual-proof/decode-check.dom || { echo '::error::Chrome could not decode the exact 864x1536 clear owner-approved mobile artwork.'; cat mobile-visual-proof/decode-check.dom; exit 1; }

          curl -fsSL --retry 3 --retry-delay 2 \
            -o mobile-visual-proof/crm-upgrade.jpeg \
            "${LIVE_URL}crm-upgrade.jpeg?verify=${GITHUB_RUN_ID}"
          actual_desktop_sha256="$(sha256sum mobile-visual-proof/crm-upgrade.jpeg | awk '{print toupper($1)}')"
          [ "$actual_desktop_sha256" = "$APPROVED_DESKTOP_SHA256" ] || { echo "::error::Live desktop artwork changed: ${actual_desktop_sha256}."; exit 1; }

          render() {
            local width="$1" height="$2" name="$3" budget="$4"
            local attempt
            for attempt in 1 2; do
              if timeout 90s "$chrome" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-background-networking \
              --disable-extensions \
              --no-first-run \
              --hide-scrollbars \
              --disable-dev-shm-usage \
              --user-data-dir="$RUNNER_TEMP/magnanimous-chrome-render-${name}-${GITHUB_RUN_ID}-${attempt}" \
              --window-size="${width},${height}" \
              --virtual-time-budget="$budget" \
              --screenshot="mobile-visual-proof/${name}.png" \
              --dump-dom \
              "${LIVE_URL}?mobile_visual_verify=${GITHUB_RUN_ID}_${name}" \
              > "mobile-visual-proof/${name}.html" 2> "mobile-visual-proof/${name}.log"; then
                return 0
              fi
              echo "::warning::Browser render ${name} attempt ${attempt} failed or timed out; retrying when available."
            done
            echo "::error::Browser render ${name} failed after two bounded attempts."
            cat "mobile-visual-proof/${name}.log" || true
            return 1
          }

          render 390 844 phone-390x844 12000
          render 430 932 phone-430x932 12000
          render 1440 900 desktop-1440x900 10000

          for phone in phone-390x844 phone-430x932; do
            grep -q 'mobileExactStage' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing the canonical mobile dashboard."; exit 1; }
            grep -q 'mobileReferenceFrame' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing the portrait reference frame."; exit 1; }
            grep -q '/mobile-dashboard-approved.webp' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} no longer uses the known-working approved portrait artwork."; exit 1; }
            grep -q '/mobile-dashboard-approved-sharp.webp' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing the high-resolution approved enhancement layer."; exit 1; }
            grep -q '/mobile-dashboard-approved-clear.jpeg' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} does not display the exact original clear owner reference."; exit 1; }
            if grep -q '/mobile-dashboard-fallback.svg' "mobile-visual-proof/${phone}.html"; then echo "::error::${phone} still exposes the rejected substitute fallback artwork."; exit 1; fi
            grep -q 'Video Studio' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing Video Studio."; exit 1; }
            grep -q 'White Label' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing White Label."; exit 1; }
            grep -q 'Creator Studio' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing Creator Studio."; exit 1; }
            grep -q 'Growth' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing Growth."; exit 1; }
            grep -q 'Opportunity Vault' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing Opportunity Vault."; exit 1; }
            grep -q 'Professional Business' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing Professional Business."; exit 1; }
            grep -q 'mobileBottomMore' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing the approved bottom navigation."; exit 1; }
            grep -q 'id="mobile-side-menu"' "mobile-visual-proof/${phone}.html" || { echo "::error::${phone} is missing the collapsible menu."; exit 1; }
            [ -s "mobile-visual-proof/${phone}.png" ] || { echo "::error::${phone} screenshot was not produced."; exit 1; }
            bytes="$(stat -c%s "mobile-visual-proof/${phone}.png")"
            [ "$bytes" -ge 50000 ] || { echo "::error::${phone} screenshot is only ${bytes} bytes and is likely not the approved detailed artwork."; exit 1; }
          done

          grep -q 'desktopStage' mobile-visual-proof/desktop-1440x900.html || { echo '::error::Approved desktop dashboard marker is missing.'; exit 1; }
          grep -q '/crm-upgrade.jpeg' mobile-visual-proof/desktop-1440x900.html || { echo '::error::Desktop approved artwork source is missing.'; exit 1; }
          [ -s mobile-visual-proof/desktop-1440x900.png ] || { echo '::error::Desktop verification screenshot was not produced.'; exit 1; }

          echo 'Locked artwork verification PASS: production serves intact approved mobile WebPs plus the verified clear original JPEG, browser-decodes every image, responsive controls remain present, and desktop artwork is unchanged.'

      - name: Upload responsive visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-production-visual-proof-${{ github.run_id }}
          path: mobile-visual-proof/
          retention-days: 14

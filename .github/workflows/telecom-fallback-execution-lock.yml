name: Telecom Fallback Execution Lock

on:
  pull_request:
    branches: [main]
    paths:
      - 'worker/src/magnanimous-telecom-provider-fallback.js'
      - 'worker/src/magnanimous-telecom-provider-payment.js'
      - 'worker/src/magnanimous-telecom-charging-safety-guard.js'
      - 'worker/src/phone-carrier-runtime.js'
      - 'worker/src/stripe-webhook-hardened.js'
      - 'worker/wrangler.jsonc'
      - 'qa/scripts/telecom-fallback-execution-lock.mjs'
      - '.github/workflows/telecom-fallback-execution-lock.yml'
  push:
    branches: [main]
    paths:
      - 'worker/src/magnanimous-telecom-provider-fallback.js'
      - 'worker/src/magnanimous-telecom-provider-payment.js'
      - 'worker/src/magnanimous-telecom-charging-safety-guard.js'
      - 'worker/src/phone-carrier-runtime.js'
      - 'worker/src/stripe-webhook-hardened.js'
      - 'worker/wrangler.jsonc'
      - 'qa/scripts/telecom-fallback-execution-lock.mjs'
      - '.github/workflows/telecom-fallback-execution-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telecom-fallback-execution-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check runtime syntax
        run: |
          node --check worker/src/magnanimous-telecom-provider-fallback.js
          node --check worker/src/magnanimous-telecom-provider-payment.js
          node --check worker/src/magnanimous-telecom-charging-safety-guard.js
          node --check worker/src/phone-carrier-runtime.js
          node --check worker/src/stripe-webhook-hardened.js
      - name: Run permanent fallback and execution guardrails
        run: node qa/scripts/telecom-fallback-execution-lock.mjs

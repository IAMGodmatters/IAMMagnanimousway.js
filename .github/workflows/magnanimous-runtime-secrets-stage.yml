# Runtime secret continuity trigger 2026-09-25: rerun after standalone AI/voice rail repair so persisted free-first provider credentials are hot-reloaded on the promoted revision.
name: Magnanimous Runtime Secrets Stage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/magnanimous-runtime-secrets-stage.yml'
      - 'worker/src/github-actions-oidc.js'
      - 'worker/src/credential-vault-migration.js'
      - 'worker/src/platform-credentials.js'
      - 'worker/src/security-entrypoint.js'
      - 'magnanimous-runtime/src/runtime-secret-store.mjs'
      - 'magnanimous-runtime/src/migration-stage.mjs'
      - 'magnanimous-runtime/src/bootstrap.mjs'
      - 'magnanimous-runtime/src/server.mjs'
      - 'magnanimous-runtime/Dockerfile'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: magnanimous-runtime-secrets-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_ORIGIN: https://iammagnanimousway.com
      STANDALONE_ORIGIN: https://magnanimous-production.up.railway.app
      STANDALONE_OIDC_AUDIENCE: magnanimous-production-data-stage
      REWRAP_OIDC_AUDIENCE: magnanimous-credential-rewrap
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
      TAVUS_API_KEY: ${{ secrets.TAVUS_API_KEY }}
      VOIP_PROVIDER_TOKEN: ${{ secrets.VOIP_PROVIDER_TOKEN }}
      VOIP_WEBHOOK_SECRET: ${{ secrets.VOIP_WEBHOOK_SECRET }}
      VIDEO_RENDERER_TOKEN: ${{ secrets.VIDEO_RENDERER_TOKEN }}
      MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
      MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      INKBOX_API_KEY: ${{ secrets.INKBOX_API_KEY }}
      INKBOX_EMAIL_ADDRESS: ${{ secrets.INKBOX_EMAIL_ADDRESS }}
      INKBOX_BASE_URL: ${{ secrets.INKBOX_BASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Wait for exact standalone revision
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 180); do
            if curl -fsS --connect-timeout 10 --max-time 30 "$STANDALONE_ORIGIN/__magnanimous_runtime/health" >/tmp/magnanimous-runtime-health.json; then
              live="$(python -c 'import json; print(json.load(open("/tmp/magnanimous-runtime-health.json")).get("deploy_revision",""))')"
              if [ "$live" = "$GITHUB_SHA" ]; then success=1; break; fi
              echo "Standalone revision is $live; waiting for $GITHUB_SHA (attempt $attempt/180)."
            else
              echo "Standalone health unavailable during deploy (attempt $attempt/180)."
            fi
            sleep 10
          done
          [ "$success" = "1" ] || { echo "::error::Standalone runtime never reached exact revision $GITHUB_SHA."; exit 1; }

      - name: Count production encrypted vault rows
        shell: bash
        run: |
          set -euo pipefail
          (cd worker && npm ci --no-audit --no-fund)
          exists_json="$(cd worker && npx wrangler d1 execute iam-magnanimous-db --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name='platform_credentials';")"
          has_table="$(printf '%s' "$exists_json" | python -c 'import json,sys; d=json.load(sys.stdin); print(1 if "platform_credentials" in json.dumps(d) else 0)')"
          vault_rows=0
          if [ "$has_table" = "1" ]; then
            count_json="$(cd worker && npx wrangler d1 execute iam-magnanimous-db --remote --json --command "SELECT COUNT(*) AS n FROM platform_credentials;")"
            vault_rows="$(printf '%s' "$count_json" | jq -r '[.. | objects | .n? // empty] | last // 0')"
          fi
          printf '%s' "$vault_rows" >/tmp/magnanimous-vault-row-count
          echo "Production encrypted vault rows detected: $vault_rows."

      - name: Generate fresh standalone vault key and non-logging secret bundle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 32 >/tmp/magnanimous-target-vault-key
          python - <<'PY'
          import json,os
          with open('/tmp/magnanimous-target-vault-key') as f:
            target=f.read().strip()
          if len(target) < 32:
            raise SystemExit('Generated standalone vault key is invalid.')
          keys=[
            'CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID',
            'STRIPE_SECRET_KEY','STRIPE_WEBHOOK_SECRET',
            'TWILIO_ACCOUNT_SID','TWILIO_AUTH_TOKEN','TWILIO_PHONE_NUMBER','TAVUS_API_KEY',
            'VOIP_PROVIDER_TOKEN','VOIP_WEBHOOK_SECRET','VIDEO_RENDERER_TOKEN',
            'MUX_TOKEN_ID','MUX_TOKEN_SECRET','OPENAI_API_KEY','GOOGLE_API_KEY','GROQ_API_KEY',
            'OPENROUTER_API_KEY','HF_TOKEN','MISTRAL_API_KEY','INKBOX_API_KEY',
            'INKBOX_EMAIL_ADDRESS','INKBOX_BASE_URL'
          ]
          payload={k:os.environ[k] for k in keys if os.environ.get(k)}
          payload['INTEGRATION_CREDENTIALS_KEY']=target
          with open('/tmp/magnanimous-runtime-secrets.json','w') as f:
            json.dump(payload,f,separators=(',',':'))
          os.chmod('/tmp/magnanimous-runtime-secrets.json',0o600)
          with open('/tmp/magnanimous-runtime-secret-keys.json','w') as f:
            json.dump(sorted(payload),f)
          print(f"Prepared {len(payload)} standalone runtime secret keys without exposing values.")
          PY

      - name: Stage standalone secrets over GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 60); do
            oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${STANDALONE_OIDC_AUDIENCE}")"
            oidc_token="$(printf '%s' "$oidc_json" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            status="$(curl -sS --connect-timeout 10 --max-time 60               -o /tmp/runtime-secret-stage-response.json -w '%{http_code}'               -X POST               -H "Authorization: Bearer $oidc_token"               -H "Content-Type: application/json"               --data-binary @/tmp/magnanimous-runtime-secrets.json               "$STANDALONE_ORIGIN/__magnanimous_runtime/migration/stage-secrets" || true)"
            if [ "$status" = "200" ]; then success=1; break; fi
            echo "Standalone secret-staging endpoint not ready yet (HTTP $status, attempt $attempt/60)."
            sleep 15
          done
          [ "$success" = "1" ] || { echo "::error::Runtime secret staging did not succeed."; exit 1; }
          python - <<'PY'
          import json
          expected=json.load(open('/tmp/magnanimous-runtime-secret-keys.json'))
          response=json.load(open('/tmp/runtime-secret-stage-response.json'))
          assert response.get('ok') is True, response
          assert sorted(response.get('keys') or []) == expected, (expected,response)
          assert int(response.get('count') or 0) == len(expected), response
          assert response.get('reloaded') is True, response
          assert int(response.get('loaded_count') or 0) == len(expected), response
          print(f"Standalone runtime secret staging + live reload PASS for {len(expected)} configured keys.")
          PY

      - name: Rewrap production credential vault without exposing plaintext
        shell: bash
        run: |
          set -euo pipefail
          vault_rows="$(cat /tmp/magnanimous-vault-row-count)"
          if [ "$vault_rows" -eq 0 ]; then
            printf '{"ok":true,"count":0,"rows":[]}' >/tmp/magnanimous-vault-rewrap.json
            echo "Production credential vault is empty; rewrap not required."
            exit 0
          fi
          python - <<'PY'
          import json
          target=open('/tmp/magnanimous-target-vault-key').read().strip()
          with open('/tmp/magnanimous-vault-rewrap-request.json','w') as f:
            json.dump({'target_key':target},f,separators=(',',':'))
          PY
          success=0
          for attempt in $(seq 1 60); do
            oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${REWRAP_OIDC_AUDIENCE}")"
            oidc_token="$(printf '%s' "$oidc_json" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            status="$(curl -sS --connect-timeout 10 --max-time 60               -o /tmp/magnanimous-vault-rewrap.json -w '%{http_code}'               -X POST               -H "Authorization: Bearer $oidc_token"               -H "Content-Type: application/json"               --data-binary @/tmp/magnanimous-vault-rewrap-request.json               "$PRODUCTION_ORIGIN/api/internal/migration/rewrap-platform-credentials" || true)"
            if [ "$status" = "200" ]; then success=1; break; fi
            echo "Production credential-rewrap endpoint not ready yet (HTTP $status, attempt $attempt/60)."
            sleep 15
          done
          [ "$success" = "1" ] || { echo "::error::Production credential vault rewrap did not succeed."; exit 1; }
          VAULT_ROWS="$vault_rows" python - <<'PY'
          import json,os
          response=json.load(open('/tmp/magnanimous-vault-rewrap.json'))
          expected=int(os.environ['VAULT_ROWS'])
          assert response.get('ok') is True, response
          rows=response.get('rows') or []
          assert int(response.get('count') or -1) == expected, response
          assert len(rows) == expected, (expected,len(rows))
          keys=[str(r.get('credential_key') or '') for r in rows]
          assert all(keys) and len(set(keys)) == len(keys), 'Credential rewrap keys invalid'
          assert all(str(r.get('encrypted_value') or '').startswith('enc1.') for r in rows), 'Credential rewrap returned unencrypted value'
          safe_keys=sorted({str(r.get('credential_key') or '') for r in rows if str(r.get('credential_key') or '')})
          print(f"Production credential vault rewrap PASS for {expected} encrypted rows. Credential names only: {','.join(safe_keys) if safe_keys else '(none)'}")
          PY

      - name: Apply rewrapped vault to staged standalone database
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 80); do
            oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${STANDALONE_OIDC_AUDIENCE}")"
            oidc_token="$(printf '%s' "$oidc_json" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            status="$(curl -sS --connect-timeout 10 --max-time 60               -o /tmp/magnanimous-vault-apply-response.json -w '%{http_code}'               -X POST               -H "Authorization: Bearer $oidc_token"               -H "Content-Type: application/json"               --data-binary @/tmp/magnanimous-vault-rewrap.json               "$STANDALONE_ORIGIN/__magnanimous_runtime/migration/stage-credential-rewrap" || true)"
            if [ "$status" = "200" ]; then success=1; break; fi
            echo "Staged database or credential-rewrap endpoint not ready yet (HTTP $status, attempt $attempt/80)."
            sleep 15
          done
          [ "$success" = "1" ] || { echo "::error::Rewrapped credential vault was not applied to the staged database."; exit 1; }
          python - <<'PY'
          import json
          source=json.load(open('/tmp/magnanimous-vault-rewrap.json'))
          target=json.load(open('/tmp/magnanimous-vault-apply-response.json'))
          assert target.get('ok') is True, target
          assert int(target.get('count') or 0) == int(source.get('count') or 0), (source,target)
          assert target.get('ciphertext_sha256'), target
          print(f"Standalone staged credential vault verification PASS for {target['count']} encrypted rows.")
          PY

      - name: Destroy transient secret and vault files
        if: always()
        shell: bash
        run: |
          set +e
          for file in             /tmp/magnanimous-runtime-health.json             /tmp/magnanimous-target-vault-key             /tmp/magnanimous-runtime-secrets.json             /tmp/magnanimous-runtime-secret-keys.json             /tmp/runtime-secret-stage-response.json             /tmp/magnanimous-vault-row-count             /tmp/magnanimous-vault-rewrap-request.json             /tmp/magnanimous-vault-rewrap.json             /tmp/magnanimous-vault-apply-response.json
          do
            if [ -f "$file" ]; then
              size="$(stat -c%s "$file" 2>/dev/null || echo 0)"
              if [ "$size" -gt 0 ]; then
                dd if=/dev/zero of="$file" bs=64K count=$(( (size + 65535) / 65536 )) conv=notrunc status=none 2>/dev/null || true
              fi
              rm -f "$file"
            fi
          done
          echo "Transient migration secret files destroyed."

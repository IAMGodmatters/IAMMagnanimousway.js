name: Sovereign Capability Lock

on:
  push:
    branches: ['**']
    paths:
      - 'worker/src/magnanimous-sovereign-runtime.js'
      - 'worker/src/router-entrypoint.js'
      - 'qa/scripts/sovereign-capability-lock.mjs'
      - '.github/workflows/sovereign-capability-lock.yml'
  pull_request:
    paths:
      - 'worker/src/magnanimous-sovereign-runtime.js'
      - 'worker/src/router-entrypoint.js'
      - 'qa/scripts/sovereign-capability-lock.mjs'
      - '.github/workflows/sovereign-capability-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-capability-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sovereign-contract:
    name: Preserve Magnanimous sovereign contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify sovereign capability contract
        run: node qa/scripts/sovereign-capability-lock.mjs
      - name: Verify Worker JavaScript syntax
        run: node --check worker/src/magnanimous-sovereign-runtime.js && node --check worker/src/router-entrypoint.js

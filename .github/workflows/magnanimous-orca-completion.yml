name: Magnanimous Orca Native Completion

on:
  push:
    branches: [main]
    paths:
      - 'worker/src/magnanimous-parallel-supervisor.js'
      - 'magnanimous-runtime/src/orca-worktree-provisioner.mjs'
      - 'magnanimous-runtime/scripts/orca-worktrees.mjs'
      - 'worker/src/magnanimous-openapi-mcp.js'
      - 'worker/src/magnanimous-tool-traces.js'
      - 'worker/src/magnanimous-dev-agent.js'
      - 'worker/src/magnanimous-api-contract-intelligence.js'
      - 'worker/src/magnanimous-tool-gateway.js'
      - 'qa/scripts/magnanimous-orca-completion-lock.mjs'
      - 'qa/scripts/magnanimous-orca-worktree-lock.mjs'
      - 'qa/scripts/magnanimous-orca-trace-db-lock.mjs'
      - 'qa/scripts/magnanimous-orca-ui-lock.mjs'
      - 'qa/scripts/magnanimous-orca-live-actions-lock.mjs'
      - 'frontend/app/orca-workbench/page.tsx'
      - 'frontend/app/orca-workbench/live-operations.tsx'
      - 'frontend/app/developer-agent/page.tsx'
      - 'frontend/public/robots.txt'
      - '.github/workflows/magnanimous-orca-completion.yml'
  pull_request:
    branches: [main]
    paths:
      - 'worker/src/magnanimous-parallel-supervisor.js'
      - 'magnanimous-runtime/src/orca-worktree-provisioner.mjs'
      - 'magnanimous-runtime/scripts/orca-worktrees.mjs'
      - 'worker/src/magnanimous-openapi-mcp.js'
      - 'worker/src/magnanimous-tool-traces.js'
      - 'worker/src/magnanimous-dev-agent.js'
      - 'worker/src/magnanimous-api-contract-intelligence.js'
      - 'worker/src/magnanimous-tool-gateway.js'
      - 'qa/scripts/magnanimous-orca-completion-lock.mjs'
      - 'qa/scripts/magnanimous-orca-worktree-lock.mjs'
      - 'qa/scripts/magnanimous-orca-trace-db-lock.mjs'
      - 'qa/scripts/magnanimous-orca-ui-lock.mjs'
      - 'qa/scripts/magnanimous-orca-live-actions-lock.mjs'
      - 'frontend/app/orca-workbench/page.tsx'
      - 'frontend/app/orca-workbench/live-operations.tsx'
      - 'frontend/app/developer-agent/page.tsx'
      - 'frontend/public/robots.txt'
      - '.github/workflows/magnanimous-orca-completion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Syntax and module checks
        run: |
          node --check worker/src/magnanimous-parallel-supervisor.js
          node --check magnanimous-runtime/src/orca-worktree-provisioner.mjs
          node --check magnanimous-runtime/scripts/orca-worktrees.mjs
          node --check qa/scripts/magnanimous-orca-trace-db-lock.mjs
          node --check qa/scripts/magnanimous-orca-ui-lock.mjs
          node --check qa/scripts/magnanimous-orca-live-actions-lock.mjs
          node --check qa/scripts/magnanimous-orca-worktree-lock.mjs
          node --check worker/src/magnanimous-openapi-mcp.js
          node --check worker/src/magnanimous-tool-traces.js
          node --check worker/src/magnanimous-dev-agent.js
          node --check worker/src/magnanimous-api-contract-intelligence.js
          node --check worker/src/magnanimous-tool-gateway.js
          node --check qa/scripts/magnanimous-orca-completion-lock.mjs
      - name: Verify safe and free native Orca execution capabilities
        run: |
          node qa/scripts/magnanimous-orca-completion-lock.mjs
          node qa/scripts/magnanimous-orca-worktree-lock.mjs
          node qa/scripts/magnanimous-orca-trace-db-lock.mjs
          node qa/scripts/magnanimous-orca-ui-lock.mjs
          node qa/scripts/magnanimous-orca-live-actions-lock.mjs
          node qa/scripts/magnanimous-mcp-manifest-guard-lock.mjs
          node qa/scripts/magnanimous-api-contract-intelligence-lock.mjs
          node qa/scripts/magnanimous-dev-agent-lock.mjs

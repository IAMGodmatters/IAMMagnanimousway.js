name: Visual Provider Production Verification

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Deploy I AM"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Magnanimous private routing readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 4 \
            https://iammagnanimousway.com/api/providers \
            -o /tmp/providers.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/providers.json'))
          providers=data.get('providers') or []
          assert data.get('magnanimous_ready') is True, data
          assert int(data.get('configured_count') or 0) >= 1, data
          assert data.get('provider_details_private') is True, data
          assert len(providers) == 1, data
          p=providers[0]
          assert p.get('id') == 'auto', data
          assert p.get('name') == 'Magnanimous AI routing', data
          assert p.get('configured') is True and p.get('enabled') is True, data
          assert p.get('type') == 'private-execution', data
          public=json.dumps(data).lower()
          for hidden in ['openai','anthropic','claude','gemini','groq','mistral','openrouter','cerebras','hugging face','cloudflare-ai']:
            assert hidden not in public, (hidden,data)
          print('Magnanimous AI private production routing is configured without exposing the execution provider.')
          PY

      - name: Verify free cinematic visual providers
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 4 \
            https://iammagnanimousway.com/api/visual/providers \
            -o /tmp/visual.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/visual.json'))
          providers=data.get('providers') or []
          by_id={p.get('id'):p for p in providers}
          assert data.get('free_first') is True, data
          assert int(data.get('free_configured_count') or 0) >= 2, data
          assert by_id.get('iam-cinematic-free',{}).get('configured') is True, data
          assert by_id.get('cloudflare-flux-free',{}).get('configured') is True, data
          assert by_id.get('cloudflare-flux-free',{}).get('free') is True, data
          assert by_id.get('google-veo-3.1-lite',{}).get('free') is False, data
          print('Free cinematic stack is configured; Veo remains correctly marked as paid API.')
          PY

      - name: Verify visual generation requires a signed-in user
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/visual-auth.json -w '%{http_code}' \
            -X POST https://iammagnanimousway.com/api/visual/scene \
            -H 'content-type: application/json' \
            --data '{"title":"Production check","text":"cinematic visual"}')
          test "$status" = "401"
          echo "Visual creation endpoint correctly requires authentication."

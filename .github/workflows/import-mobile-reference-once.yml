# Temporary, self-removing importer for the owner's exact approved screenshot.
# This job never modifies desktop artwork or billing/feature code.
name: Import approved clear mobile reference once
on:
  push:
    branches:
      - fix/mobile-home-reference-image-clarity-20261019
    paths:
      - '.github/workflows/import-mobile-reference-once.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import exact user-uploaded reference and remove temporary importer
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 4 --max-time 75 \
            'https://pikaso.cdnpk.net/private/production/5771669090/3747074290.jpg?token=exp=1792627200~hmac=904e32b317619fd5336c7cd10d141bf9fe6fc884a910e215751184b4e2ee9312' \
            -o frontend/public/mobile-dashboard-approved-clear.jpeg
          echo '7939b2bd5f404c9378f3cd745dc1448c6bd00d0b799fdbd93ae2ee8c276babaa  frontend/public/mobile-dashboard-approved-clear.jpeg' | sha256sum --check --status
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('frontend/public/mobile-dashboard-approved-clear.jpeg')
          s=p.read_bytes()
          assert s.startswith(b'\xff\xd8\xff') and s.endswith(b'\xff\xd9')
          assert 400000 <= len(s) <= 3000000, 'Unexpected file length'
          PY
          git add frontend/public/mobile-dashboard-approved-clear.jpeg
          git rm -f .github/workflows/import-mobile-reference-once.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Import exact owner-approved clear mobile dashboard asset"
          git push origin "HEAD:${GITHUB_REF_NAME}"

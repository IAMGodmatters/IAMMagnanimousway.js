services:
  magnanimous:
    build:
      context: ..
      dockerfile: magnanimous-runtime/Dockerfile
    restart: unless-stopped
    expose:
      - "8788"
    env_file:
      - .env
    environment:
      PORT: "8788"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      MAGNANIMOUS_DB_PATH: "/app/data/iam-magnanimous.sqlite"
      MAGNANIMOUS_ASSETS_DIR: "/app/frontend/out"
      MAGNANIMOUS_SCHEDULER_ENABLED: "true"
    volumes:
      - magnanimous_data:/app/data

  edge:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - magnanimous
    ports:
      - "80:80"
      - "443:443"
    environment:
      MAGNANIMOUS_ACME_EMAIL: "${MAGNANIMOUS_ACME_EMAIL}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  magnanimous_data:
  caddy_data:
  caddy_config:
